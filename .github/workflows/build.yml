name: build

# ПРОВЕРКА, не пре-сглобяване. Досега този Action пресглобяваше и правеше СВОЙ
# commit — това пораждаше допълнителни деплойменти на Pages, които отменяха
# текущия и обновлението не стигаше до играча. Сега само проверява, че
# качената сглобка отговаря на изворите. Нищо не комитва и нищо не бута.
on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'index.html'
      - 'build.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Сглоби наново и сравни
        run: |
          cp docs/index.html /tmp/committed.html
          python build.py
          # времевият печат се различава при всяко сглобяване — махаме го от сравнението
          sed -E 's/__BUILD__ = "[^"]*"/__BUILD__ = "X"/' /tmp/committed.html > /tmp/a.html
          sed -E 's/__BUILD__ = "[^"]*"/__BUILD__ = "X"/' docs/index.html > /tmp/b.html
          if diff -q /tmp/a.html /tmp/b.html > /dev/null; then
            echo "OK: качената сглобка отговаря на изворите."
          else
            echo "ВНИМАНИЕ: docs/index.html не е пресглобен след промяна в js/."
            diff /tmp/a.html /tmp/b.html | head -20
            exit 1
          fi

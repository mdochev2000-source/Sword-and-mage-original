// SCALE = цели device-пиксели за 1 арт-пиксел -> винаги остра картина (без дробно мащабиране)
let SCALE = 2, TW = 64, TH = 32;
function computeScale() {
  const dpr = window.devicePixelRatio || 1;
  const dw = window.innerWidth * dpr, dh = window.innerHeight * dpr;
  // мащабът следва реалната резолюция (не dpr), за да се вижда достатъчно от света;
  // на тъч екрани е по-едър (пръсти + малък физически екран); винаги цяло число => остри пиксели
  const touch = (typeof G !== 'undefined') && G.isTouch;
  const bySize = touch
    ? Math.min(Math.floor(dh / 290), Math.floor(dw / 450))
    : Math.min(Math.floor(dh / 340), Math.floor(dw / 520));
  SCALE = Math.max(2, bySize);
  TW = 32 * SCALE;
  TH = 16 * SCALE;
}

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[(Math.random() * arr.length) | 0];
const chance = p => Math.random() < p;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// изометрична проекция (световни координати в плочки -> екранни device px, преди камера)
const isoX = (x, y) => (x - y) * TW / 2;
const isoY = (x, y) => (x + y) * TH / 2;

function angDiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;

}

const ACTION_MAP = {};
for (const a of ACTIONS) ACTION_MAP[a.id] = a;

// менюта, в които контролерът движи маркер по елементите (пространствена навигация)
const menuNavStates = { title: 1, charselect: 1, settings: 1, savetransfer: 1, spellbook: 1, skilltree: 1, stats: 1, inventory: 1, shop: 1, binds: 1, inputmode: 1, potionsel: 1 };
function kbBind(id) {
  const o = G.meta && G.meta.kbBinds;
  return (o && id in o) ? o[id] : ACTION_MAP[id].kb;
}
function padBind(id) {
  const o = G.meta && G.meta.padBinds;
  return (o && id in o) ? o[id] : ACTION_MAP[id].pad;
}
function actionForKey(code) {
  for (const a of ACTIONS) if (kbBind(a.id) === code) return a.id;
  return null;
}
function actionForPad(idx) {
  for (const a of ACTIONS) if (padBind(a.id) === idx) return a.id;
  return null;
}
// задава нов бутон; ако е зает от друго действие, старото остава без бутон
function assignBind(dev, actionId, val) {
  const key = dev === 'kb' ? 'kbBinds' : 'padBinds';
  if (!G.meta[key]) G.meta[key] = {};
  const prev = dev === 'kb' ? actionForKey(val) : actionForPad(val);
  if (prev && prev !== actionId) {
    G.meta[key][prev] = null;
    toast('"' + ACTION_MAP[prev].n + '" is now unbound', '#e0a458');

  G.meta[key][actionId] = val;

  if (typeof Sfx !== 'undefined') Sfx.play('pickup');
}
function resetBinds(dev) {

}

// падът е реалният вход в момента (използван е скоро) — за подсказки/маркери,

function usePad() { const m = inputMode(); return m === 'pad' || m === 'auto'; }

}

// пръски във всички посоки (z = височина в арт-пиксели)
function burst(x, y, colors, n, spd, life) {
  for (let i = 0; i < n; i++) {
    const a = rnd(Math.PI * 2), s = rnd(0.4, 1) * (spd || 3);
    addParticle({
      x, y, z: rnd(4, 12),
      vx: Math.cos(a) * s, vy: Math.sin(a) * s, vz: rnd(6, 26),
      grav: 60, t: 0, life: (life || 0.5) * rnd(0.6, 1.3),
      col: pick(colors), size: chance(0.3) ? 2 : 1,
    });
  }
}
// ==== sprites.js ====
'use strict';
// ================= СПРАЙТОВЕ: процедурен пиксел-арт (арт-резолюция, целочислено мащабиране) =================

function mk(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return g;
}
function px(g, x, y, c) { g.fillStyle = c; g.fillRect(x, y, 1, 1); }
function rc(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }

// 1px тъмен контур около силуета — прави всеки спрайт четлив и остър
function outlineSprite(g, color) {
  const c = g.canvas, w = c.width, h = c.height;
  const id = g.getImageData(0, 0, w, h), a = id.data;
  const solid = (x, y) => x >= 0 && y >= 0 && x < w && y < h && a[(y * w + x) * 4 + 3] > 40;
  g.fillStyle = color || '#0a0c12';
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (a[(y * w + x) * 4 + 3] <= 40 && (solid(x + 1, y) || solid(x - 1, y) || solid(x, y + 1) || solid(x, y - 1)))
      g.fillRect(x, y, 1, 1);
  }
}
function whiteVersion(cv) {
  const g = mk(cv.width, cv.height);
  g.drawImage(cv, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, cv.width, cv.height);
  return g.canvas;
}
function dimVersion(cv, amt) {
  const g = mk(cv.width, cv.height);
  g.drawImage(cv, 0, 0);
  g.globalCompositeOperation = 'source-atop';
  g.fillStyle = 'rgba(8,11,20,' + (amt === undefined ? 0.62 : amt) + ')';
  g.fillRect(0, 0, cv.width, cv.height);
  return g.canvas;
}

// ромб 32x16
function diamondSpan(y) {
  const half = y < 8 ? 2 * (y + 1) : 2 * (16 - y);
  return [16 - half, half * 2];
}
function fillDiamond(g, oy, c) {
  for (let y = 0; y < 16; y++) {
    const [x0, w] = diamondSpan(y);
    rc(g, x0, oy + y, w, 1, c);
  }
}
function inDiamond(x, y) {
  if (y < 0 || y > 15) return false;
  const [x0, w] = diamondSpan(y);
  return x >= x0 && x < x0 + w;
}

// ---------- теми по дълбочина ----------
const THEMES = [

// визията се сменя на всеки 10 етажа (всеки арх-бос пази своя), нова след етаж 50
function themeIndexFor(depth) {

  return depth > 50 ? 4 : Math.min(3, Math.floor((depth - 1) / 10));
}

// ---------- плочки ----------
function genFloor(t, R) {
  const g = mk(32, 16);
  fillDiamond(g, 0, t.base);
  for (let i = 0; i < 70; i++) {
    const x = (R() * 32) | 0, y = (R() * 16) | 0;
    if (inDiamond(x, y)) px(g, x, y, R() < 0.5 ? t.dark : t.light);
  }
  if (R() < 0.55) { // пукнатина
    let x = 8 + (R() * 16 | 0), y = 3 + (R() * 9 | 0);
    for (let i = 0; i < 7; i++) {
      if (inDiamond(x, y)) px(g, x, y, t.crack);
      x += R() < 0.5 ? 1 : -1; y += R() < 0.65 ? 1 : 0;
    }
  }
  if (R() < 0.4) { // камъче / мъх
    const x = 6 + (R() * 18 | 0), y = 4 + (R() * 8 | 0);
    if (inDiamond(x, y) && inDiamond(x + 1, y)) { px(g, x, y, t.accent); px(g, x + 1, y, t.dark); }
  }
  // ръбове: горните светли, долните тъмни -> четене на решетката без размазване
  for (let y = 0; y < 16; y++) {
    const [x0, w] = diamondSpan(y);
    if (y < 8) { px(g, x0, y, t.light); px(g, x0 + 1, y, t.light); px(g, x0 + w - 1, y, t.edge); px(g, x0 + w - 2, y, t.edge); }
    else { px(g, x0, y, t.edge); px(g, x0 + 1, y, t.edge); px(g, x0 + w - 1, y, t.crack); px(g, x0 + w - 2, y, t.crack); }
  }
  return g.canvas;
}

const WALL_HP = 20; // височина на стената в арт-пиксели
function genWall(t, R) {
  const H = WALL_HP;
  const g = mk(32, 16 + H);
  // капак
  fillDiamond(g, 0, t.top);
  for (let i = 0; i < 45; i++) {
    const x = (R() * 32) | 0, y = (R() * 16) | 0;
    if (inDiamond(x, y)) px(g, x, y, R() < 0.5 ? t.topDark : t.topLight);
  }
  for (let y = 0; y < 8; y++) {
    const [x0, w] = diamondSpan(y);
    px(g, x0, y, t.topLight); px(g, x0 + w - 1, y, t.topLight);
  }
  // лица с тухли
  for (let x = 0; x < 32; x++) {
    const left = x < 16;
    const yb = left ? 8 + (x >> 1) + 1 : 8 + ((31 - x) >> 1) + 1;
    for (let k = 0; k < H; k++) {
      const y = yb + k;
      if (y >= 16 + H) continue;
      let col = left ? t.faceL : t.faceR;
      if (k % 5 === 4) col = t.mortar;                       // хоризонтална фуга
      else if (((x + ((k / 5) | 0) * 4) % 8) === 0) col = t.mortar; // вертикална фуга (разместена)
      if (k >= H - 2) col = t.mortar;                        // контактна сянка при пода
      px(g, x, y, col);
    }
    // светъл ръб на върха на лицето
    px(g, x, yb, left ? t.topLight : t.topDark);
  }
  // разделител между двете лица
  for (let k = 0; k < H; k++) px(g, 16, 8 + 7 + 1 + k, t.mortar);
  return g.canvas;
}

// ---------- реквизит ----------
function genBrazier() {
  const frames = [];
  for (let f = 0; f < 3; f++) {
    const g = mk(14, 18);
    // крака + купа
    rc(g, 3, 14, 2, 3, '#2b2521'); rc(g, 9, 14, 2, 3, '#2b2521');
    rc(g, 2, 11, 10, 3, '#4a3f35'); rc(g, 3, 10, 8, 1, '#5c4f42');
    rc(g, 3, 11, 8, 1, '#3a312a');
    // жар
    rc(g, 4, 9, 6, 1, '#ff5a1f');
    // пламък (3 кадъра)
    const fl = [
      [[6, 3, 2, 2], [5, 5, 4, 2], [4, 7, 6, 2]],
      [[7, 2, 2, 2], [5, 4, 4, 3], [4, 7, 6, 2]],
      [[5, 3, 2, 2], [6, 5, 3, 2], [4, 7, 6, 2]],
    ][f];
    rc(g, fl[2][0], fl[2][1], fl[2][2], fl[2][3], '#ff8a1f');

function genStairs(t) {
  const g = mk(32, 16);
  fillDiamond(g, 0, t.dark);
  // спускащи се стъпала към чернота
  for (let s = 0; s < 4; s++) {
    const shrink = s * 3;
    for (let y = 0; y < 16; y++) {
      const [x0, w] = diamondSpan(y);
      const nx0 = x0 + shrink, nw = w - shrink * 2;
      if (nw <= 0) continue;
      const col = s === 3 ? '#05070c' : ['#2a2f3e', '#20242f', '#14171f'][s];
      rc(g, nx0, y, nw, 1, col);
    }
  }
  // стъпаловидни ръбове
  for (let s = 1; s < 3; s++) {
    for (let y = 0; y < 8; y++) {
      const [x0, w] = diamondSpan(y);
      const nx0 = x0 + s * 3, nw = w - s * 6;
      if (nw > 0) { px(g, nx0, y, t.light); px(g, nx0 + nw - 1, y, t.light); }
    }
  }
  return g.canvas;
}
function genFountain(dry) {
  const frames = [];

    if (!dry) {
      rc(g, 4, 9, 3, 1, f ? '#4f9cff' : '#7fc0ff');
      rc(g, 10, 10, 3, 1, f ? '#7fc0ff' : '#4f9cff');

      rc(g, 8, 2, 2, 7, '#4f9cff');

}

function genShadow() {

}

// ---------- хуманоиди ----------
const PAL_KNIGHT = {
  steel: '#94a1b8', steelL: '#c6d3e6', steelD: '#67738c',
  skin: '#e6b48d', eye: '#1a1d26', hair: '#4a3220',
  cape: '#8a2f3c', capeD: '#6e2430', belt: '#42331f', gold: '#e8c04a',
  boot: '#3a3040', pants: '#4a4258',
};
const PAL_BONE = { b: '#d8d3c0', bd: '#a39d8a', bdd: '#6e695a', eye: '#ff3b3b' };

function drawKnight(o) {
  // o: {dir:'down'|'up', frame:0..3, atk:0|1|2}
  // едра "чиби" пропорция: голям затворен шлем, гребен, пелерина, щит
  const g = mk(22, 26);
  const F = o.frame | 0, down = o.dir !== 'up';
  const bob = (F === 1 || F === 3) ? 1 : 0;
  const lOff = F === 1 ? -1 : (F === 3 ? 1 : 0);
  const ST = '#9aa7bd', SL = '#cdd9ea', SM = '#8a97ad', SD = '#5f6a84', SDD = '#454e63';
  const RD = '#c22836', RDD = '#8f1620', RDL = '#e04a52';
  const GOLD = '#e8c04a', DK = '#12151d', BELT = '#42331f';

  // --- крака (под всичко) ---
  const legY = 21;
  rc(g, 6, legY + lOff, 3, 4 - Math.max(0, lOff), SM);
  rc(g, 13, legY - lOff, 3, 4 - Math.max(0, -lOff), SM);
  px(g, 7, legY + 1 + lOff, SL); px(g, 14, legY + 1 - lOff, SL);        // колене
  rc(g, 5, legY + 3 + lOff, 4, 2 - Math.max(0, lOff), SD);              // ботуши
  rc(g, 13, legY + 3 - lOff, 4, 2 - Math.max(0, -lOff), SD);
  rc(g, 5, legY + 4 + lOff, 4, 1, SDD); rc(g, 13, legY + 4 - lOff, 4, 1, SDD);

  const ty = 14 + bob; // торс
  const hy = 2 + bob;  // шлем

  if (down) {
    // пелерина наднича отстрани зад тялото
    rc(g, 4, ty + 1, 2, 7, RDD); rc(g, 16, ty + 1, 2, 7, RDD);
    px(g, 4, ty + 8, RDD); px(g, 17, ty + 8, RDD);
    // кираса
    rc(g, 6, ty, 10, 6, ST);
    rc(g, 7, ty + 1, 3, 2, SL);                                          // отблясък
    rc(g, 11, ty, 1, 5, SD);                                             // централен ръб
    rc(g, 6, ty + 5, 10, 1, BELT); rc(g, 10, ty + 5, 2, 1, GOLD);        // колан + катарама
    // раменни плочи
    rc(g, 3, ty - 1, 4, 3, ST); px(g, 3, ty - 1, SL); px(g, 4, ty - 1, SL);
    rc(g, 15, ty - 1, 4, 3, ST); px(g, 18, ty, SD);
    // дясна ръка + екипираното оръжие
    const wt = o.weapon || 'sword';
    if (o.atk && o.noWeapon) {
      // РЪКАТА ЗАМАХВА (3 пози) — оръжието е отделен компонент, закачен за дланта
      if (o.atk === 1) {        // засилване: ръката вдигната нагоре
        rc(g, 17, ty - 4, 2, 4, ST); px(g, 17, ty - 4, SL); px(g, 18, ty - 1, SD);
      } else if (o.atk === 2) { // среда: ръката изпъната встрани
        rc(g, 17, ty - 1, 4, 2, ST); px(g, 17, ty - 1, SL); px(g, 20, ty, SD);
      } else {                  // завършек: ръката надолу-напред
        rc(g, 16, ty + 2, 2, 4, ST); px(g, 16, ty + 2, SL); px(g, 17, ty + 5, SD);
      }
    }
    else if (o.atk) {
      rc(g, 17, ty - 3, 2, 3, ST);                                       // вдигната ръка
      if (wt === 'axe') {
        rc(g, 18, ty - 8, 1, 5, '#7d5636');                              // дръжка
        rc(g, 16, ty - 11, 4, 3, ST); rc(g, 16, ty - 11, 2, 1, SL);      // широко острие
        px(g, 15, ty - 10, SL); rc(g, 16, ty - 9, 4, 1, SD);
      } else if (wt === 'dagger') {
        rc(g, 18, ty - 6, 2, 3, SL); rc(g, 18, ty - 7, 1, 1, '#ffffff');
        rc(g, 17, ty - 3, 3, 1, GOLD);
      } else if (wt === 'greatsword') {
        rc(g, 18, ty - 12, 3, 9, SL); rc(g, 19, ty - 13, 1, 1, '#ffffff');
        rc(g, 19, ty - 11, 1, 8, SM);
        rc(g, 16, ty - 4, 6, 1, GOLD);                                    // широк гард
      } else if (wt === 'spear') {
        rc(g, 18, ty - 12, 1, 10, '#7d5636');
        px(g, 18, ty - 13, SL); px(g, 18, ty - 14, '#ffffff');
        px(g, 18, ty - 3, GOLD);
      } else if (wt === 'chains') {
        px(g, 17, ty - 2, '#8a97ad'); px(g, 18, ty - 4, '#67738c');       // верига в дъга
        px(g, 20, ty - 6, '#8a97ad'); px(g, 21, ty - 7, '#67738c');
        rc(g, 20, ty - 10, 2, 3, SL); px(g, 21, ty - 11, '#ffffff');      // острие в края
      } else {
        rc(g, 18, ty - 9, 2, 6, SL); rc(g, 18, ty - 10, 1, 1, '#ffffff');
        rc(g, 16, ty - 4, 4, 1, GOLD);
      }
    } else {
      rc(g, 17, ty + 2, 2, 3, SM); px(g, 17, ty + 4, SD);                // ръка
      if (o.noWeapon) { /* оръжието виси отделно, закачено за дланта */ }
      else if (wt === 'axe') {
        rc(g, 19, ty - 4, 1, 8, '#7d5636'); px(g, 19, ty + 3, '#5c4a36');
        rc(g, 17, ty - 5, 2, 4, ST); px(g, 17, ty - 5, SL);              // острие наляво
        px(g, 18, ty - 6, SM); px(g, 17, ty - 2, SD);
      } else if (wt === 'dagger') {
        rc(g, 19, ty - 1, 1, 4, SL); px(g, 19, ty - 2, '#ffffff');
        rc(g, 18, ty + 2, 3, 1, GOLD);
      } else if (wt === 'greatsword') {
        rc(g, 19, ty - 7, 2, 11, SL); rc(g, 20, ty - 6, 1, 10, SM);       // масивно острие
        px(g, 19, ty - 8, SL);
        rc(g, 18, ty + 3, 4, 1, GOLD);
      } else if (wt === 'spear') {
        rc(g, 19, ty - 8, 1, 14, '#7d5636');                              // дълга дръжка
        px(g, 19, ty - 9, SL); px(g, 19, ty - 10, '#ffffff');
        px(g, 19, ty - 2, GOLD);                                          // обков
      } else if (wt === 'chains') {
        px(g, 17, ty + 1, '#8a97ad'); px(g, 18, ty + 2, '#67738c');       // висяща верига
        px(g, 17, ty + 3, '#8a97ad'); px(g, 18, ty + 4, '#67738c');
        rc(g, 17, ty + 5, 2, 3, SL); px(g, 18, ty + 8, '#ffffff');        // острие долу
      } else {
        rc(g, 19, ty - 4, 1, 7, SL); px(g, 19, ty - 5, SL);
        rc(g, 18, ty + 3, 3, 1, GOLD);
      }
    }
    // щит (пред тялото, лява страна) — ясен heater-силует със собствен контур
    const shx = 1, shy = ty - 1;
    const rows = [[0, 7], [0, 7], [0, 7], [0, 7], [0, 7], [1, 6], [1, 6], [2, 5], [3, 4]];
    rows.forEach((sp, yy) => rc(g, shx + sp[0], shy + yy, sp[1] - sp[0] + 1, 1, SM));
    rc(g, shx, shy, 8, 1, GOLD);                                          // златен кант горе
    rows.forEach((sp, yy) => {                                            // тъмен контур
      px(g, shx + sp[0], shy + yy, SDD); px(g, shx + sp[1], shy + yy, SDD);
    });
    rc(g, shx + 1, shy + 1, 1, 4, SL);                                    // блик отляво
    px(g, shx + 4, shy + 3, RD); px(g, shx + 5, shy + 3, RD);             // червен ромб
    px(g, shx + 3, shy + 4, RD); rc(g, shx + 4, shy + 4, 2, 1, RDL); px(g, shx + 6, shy + 4, RD);
    px(g, shx + 4, shy + 5, RD); px(g, shx + 5, shy + 5, RD);
  } else {
    // гръб: пелерина покрива тялото
    rc(g, 4, ty - 1, 14, 8, RD);
    rc(g, 4, ty - 1, 14, 1, RDL);
    rc(g, 7, ty + 1, 1, 6, RDD); rc(g, 12, ty + 2, 1, 5, RDD);            // гънки
    for (let xx = 4; xx < 18; xx += 2) rc(g, xx, ty + 7, 1, 1 + (xx % 4 === 0 ? 1 : 0), RDD); // накъсан край
    rc(g, 10, ty - 1, 2, 1, GOLD);                                        // закопчалка
    // раменни плочи над пелерината
    rc(g, 3, ty - 1, 4, 2, ST); px(g, 3, ty - 1, SL);
    rc(g, 15, ty - 1, 4, 2, ST); px(g, 18, ty - 1, SD);
    // щит на гърба (дясно, огледално на предния)
    const shx = 13, shy = ty;
    const rows2 = [[0, 6], [0, 6], [0, 6], [0, 6], [1, 5], [1, 5], [2, 4], [3, 3]];
    rows2.forEach((sp, yy) => rc(g, shx + sp[0], shy + yy, sp[1] - sp[0] + 1, 1, SM));
    rc(g, shx, shy, 7, 1, GOLD);
    rows2.forEach((sp, yy) => {
      px(g, shx + sp[0], shy + yy, SDD); px(g, shx + sp[1], shy + yy, SDD);
    });
    rc(g, shx + 1, shy + 1, 1, 3, SL);
    if (o.atk && o.noWeapon) {
      // ръката замахва (3 пози) и от гръб — над пелерината
      if (o.atk === 1) { rc(g, 17, ty - 3, 2, 4, ST); px(g, 17, ty - 3, SL); px(g, 18, ty, SD); }
      else if (o.atk === 2) { rc(g, 17, ty, 4, 2, ST); px(g, 17, ty, SL); px(g, 20, ty + 1, SD); }
      else { rc(g, 16, ty + 3, 2, 4, ST); px(g, 16, ty + 3, SL); px(g, 17, ty + 6, SD); }
    }
    else if (o.atk) {
      const wt2 = o.weapon || 'sword';
      if (wt2 === 'axe') {
        rc(g, 18, ty - 8, 1, 5, '#7d5636');
        rc(g, 16, ty - 11, 4, 3, ST); rc(g, 16, ty - 11, 2, 1, SL);
      } else if (wt2 === 'dagger') {
        rc(g, 18, ty - 6, 2, 3, SL); rc(g, 18, ty - 7, 1, 1, '#ffffff');
      } else if (wt2 === 'greatsword') {
        rc(g, 18, ty - 12, 3, 9, SL); rc(g, 19, ty - 13, 1, 1, '#ffffff'); rc(g, 16, ty - 4, 6, 1, GOLD);
      } else if (wt2 === 'spear') {
        rc(g, 18, ty - 12, 1, 10, '#7d5636'); px(g, 18, ty - 13, SL); px(g, 18, ty - 14, '#ffffff');
      } else if (wt2 === 'chains') {
        px(g, 17, ty - 2, '#8a97ad'); px(g, 19, ty - 4, '#67738c'); px(g, 21, ty - 6, '#8a97ad');
        rc(g, 20, ty - 10, 2, 3, SL); px(g, 21, ty - 11, '#ffffff');
      } else {
        rc(g, 18, ty - 9, 2, 6, SL); rc(g, 18, ty - 10, 1, 1, '#ffffff'); rc(g, 17, ty - 4, 3, 1, GOLD);
      }
    }
  }

  // --- шлем (голям, затворен, заоблен купол) ---
  rc(g, 9, hy, 4, 1, ST);                                                 // връх на купола
  rc(g, 7, hy + 1, 8, 1, ST);
  rc(g, 6, hy + 2, 10, 9, ST);                                            // основно тяло
  rc(g, 7, hy + 11, 8, 1, ST);                                            // заоблена брадичка
  rc(g, 8, hy + 12, 6, 1, SDD);                                           // ръб при врата
  rc(g, 9, hy, 2, 1, SL); rc(g, 7, hy + 1, 3, 1, SL);                     // блик горе-ляво
  rc(g, 6, hy + 2, 2, 5, SL);
  rc(g, 15, hy + 3, 1, 8, SD); rc(g, 13, hy + 11, 2, 1, SD);              // сянка дясно-долу
  if (down) {
    rc(g, 6, hy + 5, 10, 2, DK);                                          // широк прорез за очите
    px(g, 6, hy + 5, SD); px(g, 15, hy + 6, SDD);
    px(g, 8, hy + 9, DK); px(g, 10, hy + 9, DK); px(g, 12, hy + 9, DK);   // отдушници
    px(g, 8, hy + 10, DK); px(g, 10, hy + 10, DK); px(g, 12, hy + 10, DK);
    rc(g, 6, hy + 7, 10, 1, SD);                                          // ръб под визьора
  } else {
    rc(g, 10, hy + 3, 1, 8, SD);                                          // шев на тила
    px(g, 10, hy + 12, SD);
  }
  // гребен — висок и развят назад
  rc(g, 10, hy - 3, 2, 4, RD);
  px(g, 10, hy - 3, RDL); px(g, 9, hy - 2, RDL);
  px(g, 12, hy - 2, RD); px(g, 13, hy - 1, RDD); px(g, 12, hy - 1, RDD);  // опашка
  px(g, 14, hy, RDD);

  outlineSprite(g, '#10131c');
  return g.canvas;
}

// отделен спрайт на оръжието (сочи НАГОРЕ, дръжката долу) — за анимацията на ЗАМАХА
function genHeldWeapon(wt) {
  const g = mk(9, 18);

    rc(g, 5, 2, 3, 5, ST); px(g, 8, 3, SD); rc(g, 5, 6, 3, 1, SD);        // дясна глава
  } else if (wt === 'dagger') {
    rc(g, 3, 8, 2, 5, SL); px(g, 3, 7, '#ffffff');

    rc(g, 4, 14, 1, 3, WOOD);

function genItemIcon(kind, rarity) {

  switch (kind) {
    case 'sword':
      for (let i = 0; i < 7; i++) px(g, 3 + i, 9 - i, '#c6d3e6');
      for (let i = 0; i < 6; i++) px(g, 4 + i, 9 - i, '#94a1b8');

      rc(g, 2, 8, 3, 1, '#e8c04a'); rc(g, 3, 9, 1, 2, '#7d5636'); px(g, 2, 10, '#e8c04a');

      rc(g, 7, 1, 3, 5, '#94a1b8'); rc(g, 10, 2, 1, 3, '#67738c');

      break;
    case 'seal':
      // Печат на Бездната: тъмна плочка със светеща руна
      rc(g, 3, 1, 6, 10, '#2a2438');
      rc(g, 3, 1, 6, 1, '#3c3450'); rc(g, 3, 10, 6, 1, '#1c1828');
      px(g, 5, 3, '#c84fff'); px(g, 6, 3, '#c84fff');
      px(g, 4, 4, '#c84fff'); px(g, 7, 4, '#c84fff');
      rc(g, 5, 5, 2, 1, '#f0b0ff');
      px(g, 4, 6, '#c84fff'); px(g, 7, 6, '#c84fff');
      px(g, 5, 8, '#c84fff'); px(g, 6, 8, '#c84fff');
      break;
    case 'soulstone':
      // Камък на душата: тъмночервен кристал с бледа душа, светеща вътре
      rc(g, 4, 2, 4, 2, '#8a1c2a');
      rc(g, 3, 4, 6, 4, '#c22836');
      rc(g, 4, 8, 4, 2, '#8a1c2a');
      rc(g, 5, 5, 2, 2, '#ffd0e0'); // ядрото — душата
      px(g, 5, 4, '#ff8aa0'); px(g, 6, 6, '#ff8aa0');
      px(g, 5, 2, '#ffb0c0'); px(g, 4, 3, '#e0556a');
      px(g, 7, 7, '#5a0f18'); px(g, 3, 6, '#e0556a'); px(g, 8, 5, '#5a0f18');
      break;
  }
  outlineSprite(g, '#0a0c12');
  return g.canvas;
}

// ---------- ефекти ----------
function genSlash() {
  const frames = [];
  for (let f = 0; f < 3; f++) {
    const g = mk(36, 36);
    const prog = (f + 1) / 3;
    const a0 = -1.1, a1 = -1.1 + 2.2 * prog;
    for (let y = 0; y < 36; y++) for (let x = 0; x < 36; x++) {
      const dx = x - 18, dy = y - 18;
      const r = Math.hypot(dx, dy), a = Math.atan2(dy, dx);
      if (a > a0 && a < a1 && a > a1 - 1.15) {
        if (r >= 13 && r < 17) px(g, x, y, '#ffffff');
        else if (r >= 10 && r < 13) px(g, x, y, '#ffe9a8');
        else if (r >= 8 && r < 10 && f > 0) px(g, x, y, 'rgba(255,210,80,0.55)');
      }
    }
    frames.push(g.canvas);
  }
  return frames;
}
function genFireball() {
  const frames = [];
  for (let f = 0; f < 2; f++) {
    const g = mk(9, 9);
    for (let y = 0; y < 9; y++) for (let x = 0; x < 9; x++) {
      const r = Math.hypot(x - 4, y - 4);
      if (r < 2) px(g, x, y, '#fff2a0');
      else if (r < 3.2) px(g, x, y, '#ffd23b');
      else if (r < 4.2 && ((x + y + f) % 2 === 0)) px(g, x, y, '#ff8a1f');
    }
    frames.push(g.canvas);
  }
  return frames;
}
function genExplosion() {
  const frames = [];
  const rads = [3.5, 6.5, 9.5];
  for (let f = 0; f < 3; f++) {
    const g = mk(22, 22);
    const R0 = rads[f];
    for (let y = 0; y < 22; y++) for (let x = 0; x < 22; x++) {
      const r = Math.hypot(x - 11, y - 11);
      if (Math.abs(r - R0) < 1.4) px(g, x, y, f === 2 ? '#ff8a1f' : '#ffd23b');
      else if (r < R0 - 1 && f < 2 && ((x + y) % 2 === 0)) px(g, x, y, '#ff5a1f');
    }
    frames.push(g.canvas);
  }
  return frames;
}
function genArrow() {
  const g = mk(10, 3);
  rc(g, 0, 1, 8, 1, '#a08050');
  px(g, 8, 1, '#c9d1d9'); px(g, 9, 1, '#ffffff'); px(g, 8, 0, '#c9d1d9'); px(g, 8, 2, '#c9d1d9');
  px(g, 0, 0, '#d84a5a'); px(g, 0, 2, '#d84a5a');
  return g.canvas;
}
function genBolt() {
  const frames = [];
  for (let f = 0; f < 2; f++) {
    const g = mk(7, 7);
    for (let y = 0; y < 7; y++) for (let x = 0; x < 7; x++) {
      const r = Math.hypot(x - 3, y - 3);
      if (r < 1.6) px(g, x, y, '#f0b0ff');
      else if (r < 3 && ((x + y + f) % 2 === 0)) px(g, x, y, '#c84fff');
    }
    frames.push(g.canvas);
  }
  return frames;
}
function genSpark() {
  const frames = [];
  for (let f = 0; f < 2; f++) {
    const g = mk(9, 9);
    const L = f === 0 ? 2 : 4;
    for (let i = 1; i <= L; i++) {
      px(g, 4 + i, 4, '#ffffff'); px(g, 4 - i, 4, '#ffffff');
      px(g, 4, 4 + i, '#ffffff'); px(g, 4, 4 - i, '#ffffff');
    }
    px(g, 4, 4, '#ffe9a8');
    if (f) { px(g, 6, 2, '#ffe9a8'); px(g, 2, 6, '#ffe9a8'); px(g, 2, 2, '#ffe9a8'); px(g, 6, 6, '#ffe9a8'); }
    frames.push(g.canvas);
  }
  return frames;
}
function genCursor() {
  const g = mk(11, 11);
  for (let i = 0; i < 3; i++) {
    px(g, 5, i, '#ffffff'); px(g, 5, 10 - i, '#ffffff');
    px(g, i, 5, '#ffffff'); px(g, 10 - i, 5, '#ffffff');
  }
  px(g, 5, 5, '#ffd23b');
  outlineSprite(g, '#0a0c12');
  return g.canvas;
}
function genCrown() {
  const g = mk(7, 4);
  rc(g, 0, 2, 7, 2, '#e8c04a');
  px(g, 0, 1, '#e8c04a'); px(g, 3, 0, '#ffd23b'); px(g, 6, 1, '#e8c04a');
  outlineSprite(g, '#0a0c12');
  return g.canvas;
}

// ---------- пикселов шрифт за числа (3x5) ----------
const FONT3 = {
  '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001011001111',
  '4': '101101111001001', '5': '111100111001111', '6': '111100111101111', '7': '111001001010010',
  '8': '111101111101111', '9': '111101111001111', '+': '000010111010000', '-': '000000111000000',
  '!': '010010010000010',
};
function drawPixText(ctx2, str, x, y, s, color) {
  ctx2.fillStyle = color;
  let cx = x;
  for (const ch of str) {
    const d = FONT3[ch];
    if (d) {
      for (let i = 0; i < 15; i++) {
        if (d[i] === '1') ctx2.fillRect(cx + (i % 3) * s, y + ((i / 3) | 0) * s, s, s);
      }
    }
    cx += 4 * s;
  }
}
function pixTextW(str, s) { return str.length * 4 * s - s; }

// ---------- инициализация ----------
function packFrames(frames) {
  return { frames, white: whiteVersion(frames[0]) };
}

function initSprites(themeIdx) {
  if (Spr.themeIdx === themeIdx && Spr.ready) return;
  const t = THEMES[themeIdx];
  const R = mulberry32(1234 + themeIdx * 777);

  Spr.floor = [];
  for (let v = 0; v < 6; v++) {
    const lit = genFloor(t, R);
    Spr.floor.push({ lit, dim: dimVersion(lit) });
  }
  Spr.wall = [];
  for (let v = 0; v < 3; v++) {
    const lit = genWall(t, R);
    Spr.wall.push({ lit, dim: dimVersion(lit) });
  }
  Spr.stairs = (() => { const lit = genStairs(t); return { lit, dim: dimVersion(lit) }; })();
  Spr.rubble = genRubble(t);

  if (!Spr.staticReady) {
    Spr.staticReady = true;
    Spr.brazier = genBrazier();
    Spr.barrel = genBarrel();
    Spr.crate = genCrate();
    Spr.chest = genChest(false);
    Spr.chestOpen = genChest(true);
    Spr.vaultdoor = genVaultDoor();
    Spr.arena = genArenaMarker();
    Spr.fountain = genFountain(false);
    Spr.fountainDry = genFountain(true)[0];
    Spr.bones = genBones();
    Spr.blood = genBlood();
    Spr.shadow = genShadow();
    Spr.crown = genCrown();
    Spr.cursor = genCursor();

    // герой: комплект спрайтове за всеки тип оръжие
    Spr.player = {};
    for (const wt of ['sword', 'axe', 'dagger', 'greatsword', 'spear', 'chains']) {
      const set = { down: [], up: [], atkDown: [], atkUp: [], downNW: [], upNW: [], atkDownNW: [], atkUpNW: [] };
      for (let f = 0; f < 4; f++) {
        set.down.push(drawKnight({ dir: 'down', frame: f, weapon: wt }));
        set.up.push(drawKnight({ dir: 'up', frame: f, weapon: wt }));
        // тялото БЕЗ оръжие — оръжието е отделен компонент, закачен за дланта
        set.downNW.push(drawKnight({ dir: 'down', frame: f, weapon: wt, noWeapon: true }));
        set.upNW.push(drawKnight({ dir: 'up', frame: f, weapon: wt, noWeapon: true }));
      }
      for (let a = 1; a <= 2; a++) {
        set.atkDown.push(drawKnight({ dir: 'down', frame: 0, atk: a, weapon: wt }));
        set.atkUp.push(drawKnight({ dir: 'up', frame: 0, atk: a, weapon: wt }));
      }
      // атаката: 3 пози на РЪКАТА (засилване/среда/завършек), без вградено оръжие
      for (let a = 1; a <= 3; a++) {
        set.atkDownNW.push(drawKnight({ dir: 'down', frame: 0, atk: a, weapon: wt, noWeapon: true }));
        set.atkUpNW.push(drawKnight({ dir: 'up', frame: 0, atk: a, weapon: wt, noWeapon: true }));
      }
      set.held = genHeldWeapon(wt); // оръжието-компонент (закача се за дланта)
      set.white = whiteVersion(set.down[0]);
      Spr.player[wt] = set;
    }
    // котви на ДЛАНТА (пиксели в спрайта 22x26) — точката, за която се закача оръжието.
    // ходене: кадри 1 и 3 подскачат с 1px (bob); атака: по една котва за всяка от 3-те пози
    Spr.playerAnchors = {
      down: [[18, 18], [18, 19], [18, 18], [18, 19]],
      up: [[19, 16], [19, 17], [19, 16], [19, 17]],
      atkDown: [[18, 10], [20, 14], [17, 20]],
      atkUp: [[18, 11], [20, 15], [17, 21]],
    };

    Spr.enemies = {
      boss2: packFrames([0, 1, 2, 3].map(f => drawGolem({ frame: f }))),
      boss2Atk: drawGolem({ frame: 0, atk: 1 }),
      boss3: packFrames([0, 1, 2, 3].map(f => drawLich({ frame: f }))),
      boss3Atk: drawLich({ frame: 0, atk: 1 }),
      boss4: packFrames([0, 1, 2, 3].map(f => drawArch({ frame: f }))),
      boss4Atk: drawArch({ frame: 0, atk: 1 }),
      totem: packFrames([drawTotem(0), drawTotem(1)]),
      slime: packFrames([drawSlime({ frame: 0 }), drawSlime({ frame: 1 })]),
      slime_red: packFrames([drawSlime({ frame: 0, col: ['#c8465a', '#8f2a3a', '#f0a8b0'] }), drawSlime({ frame: 1, col: ['#c8465a', '#8f2a3a', '#f0a8b0'] })]),
      bat: packFrames([drawBat({ frame: 0 }), drawBat({ frame: 1 })]),
      skeleton: packFrames([0, 1, 2, 3].map(f => drawSkeleton({ frame: f }))),
      skeletonAtk: drawSkeleton({ frame: 0, atk: 1 }),
      archer: packFrames([0, 1, 2, 3].map(f => drawSkeleton({ frame: f, bow: true, hood: '#3a4a3a' }))),
      shaman: packFrames([0, 1, 2, 3].map(f => drawShaman({ frame: f }))),
      brute: packFrames([0, 1, 2, 3].map(f => drawBrute({ frame: f }))),
      bruteAtk: drawBrute({ frame: 0, atk: 1 }),
      wraith: packFrames([0, 1, 2, 3].map(f => drawWraith({ frame: f }))),
      boss: packFrames([0, 1, 2, 3].map(f => drawBoss({ frame: f }))),
      bossAtk: drawBoss({ frame: 0, atk: 1 }),
    };

    Spr.icons = {};
    for (const k of ['sword', 'axe', 'dagger', 'greatsword', 'spear', 'chains', 'armor', 'ring', 'amulet', 'potion_hp', 'potion_mp', 'gold', 'gold_small', 'seal', 'shard', 'tome', 'soulstone',
      'sv_hack', 'sv_ring', 'sv_armring', 'sv_torc', 'sv_goblet', 'sv_ingot', 'sv_bag'])
      Spr.icons[k] = genItemIcon(k, 0);

    Spr.slash = genSlash();
    Spr.fireball = genFireball();
    Spr.explosion = genExplosion();
    Spr.arrow = genArrow();
    Spr.bolt = genBolt();
    Spr.spark = genSpark();
  }

  Spr.themeIdx = themeIdx;
  Spr.ready = true;
}

// ---------- повърхността: тъмно фентъзи здрач ----------
const SURF_PAL = {
  // тревата: тъмна маслинена (#424023 по избор на дизайнера); пътеките остават кафяви
  grass: '#424023', grassD: '#36341a', grassL: '#4e4c2e', moss: '#585a32',
  dirt: '#453a2d', dirtD: '#392f24', dirtL: '#544737', pebble: '#5c5648',
  edge: '#282816',
};
function genGrass(R, path) {
  const t = SURF_PAL;
  const g = mk(32, 16);
  fillDiamond(g, 0, path ? t.dirt : t.grass);
  for (let i = 0; i < 60; i++) {
    const x = (R() * 32) | 0, y = (R() * 16) | 0;
    if (inDiamond(x, y)) px(g, x, y, path ? (R() < 0.5 ? t.dirtD : t.dirtL) : (R() < 0.5 ? t.grassD : t.grassL));
  }
  if (!path && R() < 0.5) { // туфи трева
    const x = 6 + (R() * 20 | 0), y = 3 + (R() * 9 | 0);
    if (inDiamond(x, y + 1)) { px(g, x, y, t.moss); px(g, x, y + 1, t.grassL); px(g, x + 1, y + 1, t.moss); }
  }
  if (path && R() < 0.4) { const x = 8 + (R() * 16 | 0), y = 4 + (R() * 8 | 0); if (inDiamond(x, y)) px(g, x, y, t.pebble); }
  for (let y = 0; y < 16; y++) {
    const [x0, w] = diamondSpan(y);
    if (y >= 8) { px(g, x0, y, t.edge); px(g, x0 + w - 1, y, t.edge); }
  }
  return g.canvas;
}
function genTree(R, dead) {
  const g = mk(20, 30);
  rc(g, 9, 24, 3, 5, '#3a2f24'); rc(g, 9, 24, 1, 5, '#4a3c2d'); // ствол
  if (dead) {
    rc(g, 10, 8, 1, 17, '#33291f');
    rc(g, 6, 12, 4, 1, '#33291f'); px(g, 5, 11, '#3d3226'); px(g, 4, 10, '#3d3226');
    rc(g, 11, 9, 4, 1, '#33291f'); px(g, 15, 8, '#3d3226'); px(g, 16, 7, '#3d3226');
    rc(g, 8, 15, 3, 1, '#33291f'); px(g, 7, 14, '#3d3226');
    px(g, 10, 7, '#3d3226'); px(g, 11, 6, '#33291f');
  } else {
    // тъмна ела на пластове
    const tri = (cy, half, col) => { for (let r = 0; r <= half; r++) { const w = 1 + r * 2; rc(g, 10 - r, cy + r, w, 1, col); } };
    tri(2, 3, '#1f2e24'); tri(6, 4, '#24352a'); tri(11, 5, '#1f2e24'); tri(16, 6, '#1a271f');
    px(g, 8, 4, '#31452f'); px(g, 7, 9, '#31452f'); px(g, 12, 13, '#31452f'); px(g, 6, 18, '#2a3a2c');
  }
  outlineSprite(g, '#0e1512');
  return g.canvas;
}

function genCampfire() {

  for (let f = 0; f < 3; f++) {
    const g = mk(16, 14);
    // камъни в кръг
    px(g, 2, 10, '#4a505e'); px(g, 5, 12, '#565d6e'); px(g, 10, 12, '#4a505e'); px(g, 13, 10, '#565d6e');
    px(g, 3, 11, '#3a4050'); px(g, 12, 11, '#3a4050');

    rc(g, 5, 10, 6, 2, '#3a2f24'); rc(g, 4, 11, 3, 1, '#4a3c2d'); rc(g, 9, 11, 3, 1, '#33291f');
    // пламък
    const fl = [
      [[7, 3, 2, 2], [6, 5, 4, 3], [5, 8, 6, 2]],
      [[8, 2, 2, 3], [6, 5, 4, 3], [5, 8, 6, 2]],
      [[6, 3, 2, 2], [7, 5, 3, 3], [5, 8, 6, 2]],
    ][f];

// 5 нива развитие на сергия: количка -> малка палатка -> палатка -> голяма палатка -> шатра
function genStallTier(tier, c, goods) {
  const W = '#5c4a36', WD = '#4a3c2d', WDD = '#33291f', WL = '#6e5a42';
  if (tier === 1) { // количка за бутане
    const g = mk(20, 16);
    rc(g, 3, 5, 14, 6, WD); rc(g, 3, 5, 14, 1, WL);                 // корито
    rc(g, 2, 4, 2, 8, W); rc(g, 16, 4, 2, 8, W);
    for (let i = 0; i < 4; i++) px(g, 5 + i * 3, 4, goods[i % goods.length]); // стока отгоре
    // колело
    for (let a = 0; a < 16; a++) {
      const x = 10 + Math.round(3.2 * Math.cos(a * 0.4)), y = 12 + Math.round(3.2 * Math.sin(a * 0.4) * 0.8);
      px(g, x, y, WDD);
    }
    rc(g, 9, 11, 2, 2, W);
    rc(g, 0, 6, 3, 1, W); px(g, 0, 7, WD);                          // дръжка
    outlineSprite(g, '#10141c');
    return g.canvas;
  }
  if (tier === 2) { // малка палатка
    const g = mk(22, 20);
    for (let r = 0; r < 10; r++) {                                   // А-образен покрив
      const half = 1 + r;
      rc(g, 11 - half, 4 + r, half * 2, 1, ((r / 2) | 0) % 2 ? c[0] : c[1]);
    }
    px(g, 10, 2, W); px(g, 11, 3, W);                                // върхът с колче
    rc(g, 8, 12, 6, 6, '#14100e');                                   // вход
    rc(g, 1, 13, 20, 1, WD);
    outlineSprite(g, '#10141c');
    return g.canvas;
  }
  if (tier === 3) { // палатка с било
    const g = mk(26, 24);
    rc(g, 12, 0, 2, 4, W);                                           // прът
    for (let r = 0; r < 12; r++) {
      const half = 2 + r;
      rc(g, 13 - Math.min(half, 12), 4 + r, Math.min(half, 12) * 2, 1, ((r / 3) | 0) % 2 ? c[0] : c[1]);
    }
    rc(g, 1, 16, 24, 5, c[1]);                                       // стени
    rc(g, 9, 15, 8, 8, '#14100e');                                   // вход
    px(g, 0, 22, WD); px(g, 25, 22, WD);                             // колчета
    outlineSprite(g, '#10141c');
    return g.canvas;
  }
  if (tier === 4) { // голяма палатка със знаме
    const g = mk(32, 28);
    rc(g, 15, 0, 1, 6, W);
    rc(g, 16, 0, 4, 2, c[0]); px(g, 16, 2, c[0]);                    // знаме
    for (let r = 0; r < 12; r++) {                                    // широк покрив-трапец
      const half = 3 + r;
      rc(g, 16 - Math.min(half, 15), 5 + r, Math.min(half, 15) * 2, 1, ((r / 3) | 0) % 2 ? c[0] : c[1]);
    }
    rc(g, 1, 17, 30, 8, c[1]);
    rc(g, 1, 17, 30, 1, WD);
    rc(g, 11, 17, 10, 10, '#14100e');                                 // широк вход
    rc(g, 2, 19, 1, 7, WD); rc(g, 29, 19, 1, 7, WD);
    outlineSprite(g, '#10141c');
    return g.canvas;
  }
  // tier 5: шатра, окичена със стоката
  const g = mk(38, 32);
  rc(g, 18, 0, 2, 5, W); rc(g, 20, 0, 5, 2, '#e8c04a'); px(g, 20, 2, '#e8c04a'); // златно знаме
  for (let r = 0; r < 13; r++) {
    const half = 4 + r;
    rc(g, 19 - Math.min(half, 18), 4 + r, Math.min(half, 18) * 2, 1, ((r / 3) | 0) % 2 ? c[0] : c[1]);
  }
  rc(g, 1, 17, 36, 2, '#e8c04a');                                    // златен фриз
  // фестонен ръб на навеса
  for (let x = 1; x < 37; x += 4) { rc(g, x, 19, 2, 1, c[0]); px(g, x + 2, 19, c[1]); }
  rc(g, 1, 20, 36, 8, c[1]);
  rc(g, 14, 20, 10, 12, '#14100e');                                   // вход
  rc(g, 2, 21, 1, 9, WD); rc(g, 35, 21, 1, 9, WD);
  // окачена стока от двете страни на входа
  for (let i = 0; i < 3; i++) {
    px(g, 5 + i * 3, 22, goods[i % goods.length]); px(g, 5 + i * 3, 23, goods[(i + 1) % goods.length]);
    px(g, 27 + i * 3, 22, goods[(i + 1) % goods.length]); px(g, 27 + i * 3, 23, goods[i % goods.length]);
  }
  outlineSprite(g, '#10141c');
  return g.canvas;
}

function genPortal() {
  const frames = [];
  for (let f = 0; f < 3; f++) {
    const g = mk(26, 30);
    // каменна арка
    rc(g, 2, 6, 4, 22, '#4a505e'); rc(g, 20, 6, 4, 22, '#4a505e');
    rc(g, 2, 4, 22, 4, '#565d6e');
    rc(g, 4, 2, 18, 3, '#4a505e');
    rc(g, 2, 6, 1, 22, '#6b7283'); rc(g, 23, 6, 1, 22, '#3a4050');
    px(g, 3, 12, '#3a4050'); px(g, 21, 18, '#3a4050');
    // руни
    px(g, 3, 9, f === 0 ? '#b34fff' : '#6a2f9e'); px(g, 22, 15, f === 1 ? '#b34fff' : '#6a2f9e'); px(g, 12, 3, f === 2 ? '#b34fff' : '#6a2f9e');
    // портална мъгла (пикселни ивици, без градиент)
    for (let y = 8; y < 28; y++) {
      for (let x = 6; x < 20; x++) {
        const wave = Math.sin(y * 0.7 + f * 2.1 + x * 0.3);
        if (wave > 0.55) px(g, x, y, '#2a1444');
        else if (wave > 0.1) px(g, x, y, '#1a0d2e');
        else px(g, x, y, '#120a20');
      }
    }
    for (let i = 0; i < 6; i++) { // искри
      const x = 7 + ((i * 5 + f * 3) % 12), y = 10 + ((i * 7 + f * 5) % 16);
      px(g, x, y, i % 2 ? '#b34fff' : '#7a4fd0');
    }
    outlineSprite(g, '#10141c');
    frames.push(g.canvas);
  }
  return frames;
}

// ---------- МИРХОЛД: сгради, стена, кула, порта ----------
// палитра: сив камък, кафява кал/дърво, тъмни покриви, едно топло оранжево (фенери/прозорци)

// ================= 2.5D СГРАДИ: изометрични тела върху 2x2 клетки =================
// Основата е ромб 64x32 (= точно 2x2-те блокирани клетки), две видими стени
// (СЗ-фасада с врата и СИ-страница) и пирамидален покрив с късо било.
// Котва: pyo=16 — дъното на спрайта ляга на южния връх на футпринта.

// долният ръб на "тавана" за колона x (ромб 64x32 с горен връх на (32, oy))
function iso2EdgeY(oy, x) { return x < 32 ? oy + 16 + (x >> 1) : oy + 48 - (x >> 1); }

// общата снага: стени + основа + ДВУСКАТЕН покрив със стария силует
// (билото върви по дълбочината: триъгълен фронтон на СИ-стената, скат над фасадата)
function iso2Body(g, R, oy, wallH, roofH, pal) {
  const N = 8 + roofH; // редове на ската (половин клетка дълбочина + височината на билото)
  // стените: колона по колона от долните ръбове на тавана надолу
  for (let x = 0; x < 64; x++) {
    const sw = x < 32, ey = iso2EdgeY(oy, x);
    for (let k = 1; k <= wallH; k++) {
      let col = sw ? pal.wallSW : pal.wallSE;
      if (k === 1 || k === ((wallH / 2) | 0)) col = pal.beam;   // пояси като старите
      else if (k >= wallH - 2) col = pal.stone;                 // каменна основа
      if (k === wallH) col = pal.stoneD;
      px(g, x, ey + k, col);
    }
  }
  // шум по мазилката
  for (let i = 0; i < 40; i++) {
    const x = (R() * 64) | 0, ey = iso2EdgeY(oy, x);
    const k = 2 + ((R() * (wallH - 5)) | 0);
    px(g, x, ey + k, x < 32 ? pal.wallSWd : pal.wallSEd);
  }
  // вертикални стойки по фасадата (както в старата визия)
  for (const cx2 of [0, 1, 10, 21, 31, 32, 62, 63]) {
    const ey = iso2EdgeY(oy, cx2);
    for (let k = 1; k <= wallH - 3; k++) px(g, cx2, ey + k, pal.beam);
  }
  // ТРИЪГЪЛНИЯТ ФРОНТОН на СИ-стената (дясно) — старият силует, видян отстрани
  for (let x = 32; x < 64; x++) {
    const ey = iso2EdgeY(oy, x);
    const ph = Math.max(0, Math.round((roofH + 1) * (1 - Math.abs(x - 47.5) / 15.5)));
    for (let k = 0; k < ph; k++) px(g, x, ey - k, pal.wallSE);
    if (ph > 0) {
      px(g, x, ey - ph, pal.rB); px(g, x, ey - ph - 1, pal.rD);  // покривен кант по ската
      if (ph > 1) px(g, x, ey - ph + 1, pal.beam);               // гредата под стрехата
    }
  }
  { const mx = 47, ey = iso2EdgeY(oy, mx);                       // таванско прозорче
    rc(g, mx - 1, ey - (roofH >> 1) - 2, 3, 2, '#171310'); px(g, mx, ey - (roofH >> 1) - 1, '#8a6420'); }
  // СКАТЪТ над фасадата: старият покрив, изтеглен по дълбочината към билото
  for (let s = 0; s < N; s++) {
    const dx = Math.round(16 * s / N);
    for (let x = 0; x < 32; x++) {
      const ey = iso2EdgeY(oy, x);
      px(g, x + dx, ey - s, s % 2 ? pal.rA : pal.rB);
    }
  }
  // текстура + светло било
  for (let i = 0; i < 16; i++) {
    const x = 4 + ((R() * 40) | 0), s2 = 1 + ((R() * (N - 2)) | 0);
    px(g, x + Math.round(16 * s2 / N), iso2EdgeY(oy, Math.min(31, Math.max(0, x))) - s2, pal.rC);
  }
  for (let x = 0; x < 32; x++) {
    px(g, x + 16, iso2EdgeY(oy, x) - N, pal.rD);       // билото
    px(g, x + 16, iso2EdgeY(oy, x) - N - 1, pal.rD);   // загатнат заден скат —
    px(g, x + 16, iso2EdgeY(oy, x) - N - 2, pal.rB);   // покривът има гръб,
    px(g, x + 16, iso2EdgeY(oy, x) - N - 3, '#1a1e26'); // не е хартия
  }
}
// врата на СЗ-фасадата (колони x0..x0+w-1, височина dh от земята)
function iso2Door(g, oy, wallH, x0, w, dh) {
  for (let x = x0; x < x0 + w; x++) {
    const ey = iso2EdgeY(oy, x);
    for (let k = wallH - dh; k <= wallH - 1; k++) px(g, x, ey + k, k === wallH - dh ? '#241f1a' : '#1a140e');
  }
  const mx = x0 + (w >> 1), mey = iso2EdgeY(oy, mx);
  px(g, x0 + w - 2, mey + wallH - (dh >> 1), '#9a9da5'); // дръжката
}
// прозорец върху стена: x0..x0+w-1, от ред top до top+h по колоната
function iso2Win(g, oy, x0, w, top, h, warm) {
  for (let x = x0; x < x0 + w; x++) {
    const ey = iso2EdgeY(oy, x);
    for (let k = top; k < top + h; k++) px(g, x, ey + k, '#171310');
  }
  if (warm) {
    const mx = x0 + 1, ey = iso2EdgeY(oy, mx);
    px(g, mx, ey + top + 1, '#e8a84d'); px(g, mx + 1, ey + top + 2, '#c98a3b');
  }
}
const ISO_PAL_HOUSE = v => ({

});

// ЖИЛИЩНА КЪЩА (t0 едноетажна, t1 двуетажна) — старата визия + странична стена (2.5D)
function genMirHouse(R, v, twoStory) {
  const wallH = twoStory ? 30 : 18, roofH = 12, oy = 14;
  const g = mk(64, oy + 32 + wallH);
  const pal = ISO_PAL_HOUSE(v);
  // КОМИНЪТ: рисува се ПРЕДИ снагата и наднича иззад ската (никакъв шев),
  // двойно по-висок, за да се вижда добре зад билото
  rc(g, 30, 3, 4, 14, '#565a62');
  rc(g, 30, 3, 1, 14, '#6d7280'); rc(g, 33, 3, 1, 14, '#4a4e56');
  px(g, 31, 6, '#3a3e46'); px(g, 32, 9, '#3a3e46'); px(g, 31, 12, '#3a3e46'); // фуги
  rc(g, 29, 2, 6, 2, '#4a4e56'); rc(g, 29, 2, 6, 1, '#6d7280');               // капак-плоча
  rc(g, 31, 1, 2, 1, '#171310'); px(g, 30, 1, '#2b2f36');                     // отворът и саждите
  // комина също го режем под билото — за всеки случай
  for (let c = 29; c <= 35; c++) g.clearRect(c, iso2EdgeY(oy, Math.min(31, c - 16)) - (8 + roofH) + 1, 1, 80);
  iso2Body(g, R, oy, wallH, roofH, pal);
  iso2Door(g, oy, wallH, 10, 8, 11);
  iso2Win(g, oy, 3, 5, twoStory ? 19 : 6, 4, true);       // фасаден прозорец (долен етаж)
  iso2Win(g, oy, 36, 5, twoStory ? 19 : 6, 4, false);     // страничен прозорец
  if (twoStory) {
    iso2Win(g, oy, 4, 5, 5, 4, true);                     // горният етаж
    iso2Win(g, oy, 22, 5, 5, 4, false);
    iso2Win(g, oy, 38, 5, 5, 4, true);

  if (v) for (let x = 1; x < 31; x += 3) px(g, x + 1, iso2EdgeY(oy, x) + 1, pal.rB); // рошав край на сламата
  outlineSprite(g, '#10131c');
  return g.canvas;
}

// 2.5D гарнизонна кула-КИЙП върху 2x2 клетки: масивна, 64x156 (pyo=16)
function genMirTower(R) {
  const FH = 112, oy = 12; // корона 0..11, капак-ромб 12..43, лица 44..155
  const g = mk(64, oy + 32 + FH);
  const st = '#5c6068', stD = '#4a4e56', stL = '#6d7280', mort = '#3a3e46';
  // капакът (бойната площадка) — ромб 64x32
  for (let yy = 0; yy < 32; yy++) {
    const half = yy < 16 ? (yy + 1) * 2 : (32 - yy) * 2;
    rc(g, 32 - half, oy + yy, half * 2, 1, st);
  }
  for (let i = 0; i < 60; i++) {
    const x = 4 + ((R() * 56) | 0), yy = 2 + ((R() * 28) | 0);
    px(g, x, oy + yy, R() < 0.5 ? stD : stL);
  }
  // лицата: масивна зидария с фуги, ъглов ръб и тъмна основа
  for (let x = 0; x < 64; x++) {
    const sw = x < 32, ey = iso2EdgeY(oy, x);
    for (let k = 1; k <= FH; k++) {
      let col = sw ? '#4e525a' : '#41454d';
      if (k % 7 === 6) col = mort;
      else if (((x + ((k / 7) | 0) * 5) % 11) === 0) col = mort;
      if (k >= FH - 3) col = k >= FH - 1 ? '#20242b' : '#2b2f36';
      px(g, x, ey + k, col);
    }
    px(g, x, ey, sw ? stL : stD);
  }
  for (let k = 1; k <= FH; k++) { px(g, 31, iso2EdgeY(oy, 31) + k, stL); px(g, 32, iso2EdgeY(oy, 32) + k, '#383c44'); } // южният ъгъл
  // шум по камъка
  for (let i = 0; i < 60; i++) {
    const x = 1 + ((R() * 62) | 0), ey = iso2EdgeY(oy, x);
    const k = 2 + ((R() * (FH - 8)) | 0);
    px(g, x, ey + k, R() < 0.5 ? '#454952' : '#565a62');
  }
  // ПРОЗОРЦИ: бойници и топли прозорчета, разхвърляни по двете лица
  const slit = (x0, top) => { for (let x = x0; x < x0 + 2; x++) { const ey = iso2EdgeY(oy, x); for (let k = top; k < top + 9; k++) px(g, x, ey + k, '#12100c'); } };
  const warm = (x0, top, lit) => {
    for (let x = x0; x < x0 + 6; x++) { const ey = iso2EdgeY(oy, x); for (let k = top; k < top + 6; k++) px(g, x, ey + k, '#171310'); }
    if (lit) { const ey = iso2EdgeY(oy, x0 + 1); px(g, x0 + 1, ey + top + 2, '#e8a84d'); px(g, x0 + 3, ey + top + 3, '#c98a3b'); }
  };
  slit(10, 16); slit(22, 44); slit(6, 62); warm(14, 78, true);
  slit(44, 26); warm(48, 54, true); slit(56, 84);
  // ВРАТАТА: арка със стъпала на фасадата
  for (let x = 11; x < 22; x++) {
    const ey = iso2EdgeY(oy, x);
    for (let k = FH - 17; k <= FH - 4; k++) px(g, x, ey + k, k === FH - 17 ? '#241f1a' : '#1a140e');
  }
  { const ey = iso2EdgeY(oy, 12); rc(g, 12, ey + FH - 19, 9, 2, stD); px(g, 20, ey + FH - 9, '#9a9da5'); }
  // факла до вратата
  { const ey = iso2EdgeY(oy, 24); px(g, 24, ey + FH - 14, '#241f1a'); px(g, 24, ey + FH - 15, '#ffb84d'); px(g, 24, ey + FH - 16, '#c98a3b'); }
  // КОРОНАТА: зъбери по ръбовете на площадката
  for (const [mx, my] of [[29, 0], [10, 7], [47, 7], [0, 17], [58, 17], [20, 3], [38, 3]]) {
    rc(g, mx, my, 6, 9, st);
    px(g, mx, my, stL); rc(g, mx + 5, my + 1, 1, 8, stD);
    px(g, mx + 1, my + 8, stD); px(g, mx + 3, my + 2, mort);
  }
  outlineSprite(g, '#10131c');
  return g.canvas;
}

// каменна снага (двойна височина) + дървена палисада, издигаща се от пътеката отгоре
function genMirWallBlock(R) {
  const SK = 12, FH = 26;
  const g = mk(32, SK + 16 + FH);
  const top = '#5a5f67', topL = '#6d7280', topD = '#4a4e56';
  const faceL = '#454952', faceR = '#383c44', mort = '#2b2f36';
  // капак (каменна пътека)
  fillDiamond(g, SK, top);
  for (let i = 0; i < 40; i++) {
    const x = (R() * 32) | 0, y = (R() * 16) | 0;
    if (inDiamond(x, y)) px(g, x, SK + y, R() < 0.5 ? topD : topL);
  }
  for (let y = 0; y < 8; y++) {
    const [x0, w] = diamondSpan(y);
    px(g, x0, SK + y, topL); px(g, x0 + w - 1, SK + y, topL);
  }
  // лица със зидария (същата геометрия като стените на подземието)
  for (let x = 0; x < 32; x++) {
    const left = x < 16;
    const yb = SK + (left ? 8 + (x >> 1) + 1 : 8 + ((31 - x) >> 1) + 1);
    for (let k = 0; k < FH; k++) {
      const y = yb + k;
      if (y >= SK + 16 + FH) continue;
      let col = left ? faceL : faceR;
      if (k % 5 === 4) col = mort;
      else if (((x + ((k / 5) | 0) * 4) % 8) === 0) col = mort;
      if (k >= FH - 2) col = mort;
      px(g, x, y, col);
    }
    px(g, x, yb, left ? topL : topD);
  }
  for (let k = 0; k < FH; k++) px(g, 16, SK + 16 + k, mort);
  outlineSprite(g, '#10131c');
  return g.canvas;
}

function genGateTower(R) {
  const FH = 58, oy = 14; // мерлони 0..13, диамант 14..29, лица 30..87 (+2 блока)
  const g = mk(32, oy + 16 + FH); // канвата РАСТЕ с височината (беше 64 — режеше кулите отдолу!)
  const st = '#5a5f67', stD = '#4a4e56', stL = '#6d7280', mort = '#2b2f36';
  // капак
  for (let y = 0; y < 16; y++) { const [x0, w2] = diamondSpan(y); rc(g, x0, oy + y, w2, 1, st); }
  for (let i = 0; i < 30; i++) { const x = (R() * 32) | 0, y = (R() * 16) | 0; if (inDiamond(x, y)) px(g, x, oy + y, R() < 0.5 ? stD : stL); }
  for (let y = 0; y < 8; y++) { const [x0, w2] = diamondSpan(y); px(g, x0, oy + y, stL); px(g, x0 + w2 - 1, oy + y, stL); }
  // лица със зидария
  for (let x = 0; x < 32; x++) {
    const left = x < 16;
    const yb = oy + (left ? 8 + (x >> 1) + 1 : 8 + ((31 - x) >> 1) + 1);
    for (let k = 0; k < FH; k++) {
      const y = yb + k;
      if (y >= oy + 16 + FH) continue;
      let col = left ? '#454952' : '#383c44';
      if (k % 5 === 4) col = mort;
      else if (((x + ((k / 5) | 0) * 4) % 8) === 0) col = mort;
      if (k === FH - 3) col = mort;
      else if (k === FH - 2) col = '#2b2f36';       // тъмна основа —
      else if (k === FH - 1) col = '#20242b';       // кулата стъпва на земята
      px(g, x, y, col);
    }
    px(g, x, yb, left ? stL : stD);
  }
  for (let k = 0; k < FH; k++) px(g, 16, oy + 16 + k, mort);
  // бойница на лицето + факла
  rc(g, 7, oy + 22, 2, 5, '#12100c'); px(g, 7, oy + 21, stD);
  px(g, 24, oy + 20, '#ffb84d'); px(g, 24, oy + 21, '#c98a3b');
  // мерлони-корона по задните ръбове на капака
  for (const [mx, my] of [[14, oy - 18 + 14], [4, oy - 13 + 14], [24, oy - 13 + 14], [0, oy - 8 + 14], [28, oy - 8 + 14]]) {
    rc(g, mx, my, 4, 6, st);
    px(g, mx, my, stL); px(g, mx + 3, my + 1, stD);
    px(g, mx + 1, my + 5, stD);
  }
  outlineSprite(g, '#10131c');
  return g.canvas;
}
// ГРЕДАТА СЪС ЗНАМЕНАТА над прохода (рисува се РАНО — никога не скрива героя)
// канвата е по-висока с прозрачно дъно -> виси във въздуха на нивото на кулите
function genGateBanner(R) {
  const g = mk(68, 64);
  // гредата минава през ЦЕЛИЯ отвор и опира в двете кули
  for (let x = 0; x < 68; x++) {
    const y = 1 + (x >> 1);
    rc(g, x, y, 1, 2, '#382d20');
    if (x % 10 === 0) { px(g, x, y - 1, '#4a3c2c'); px(g, x, y + 2, '#241c12'); }
  }
  // избелели ЧЕРВЕНИ ЗНАМЕНА
  const ban = (x0, col, colD, hgt) => {
    const by0 = 1 + (x0 >> 1) + 2;
    rc(g, x0, by0, 7, hgt, col); rc(g, x0, by0, 7, 1, colD);

function genChurch(R) {
  const wallH = 34, roofH = 14, oy = 26; // над oy стърчи камбанарията

  };
  // КАМБАНАРИЯТА: рисува се ПРЕДИ покрива и СТЪПВА на билото (гърбът му я подпира)
  rc(g, 34, 12, 12, 24, '#565a62');
  rc(g, 34, 12, 2, 22, '#6d7280'); rc(g, 44, 12, 2, 22, '#4a4e56');
  for (let y = 16; y < 33; y += 4) rc(g, 35, y, 10, 1, '#3a3e46');

  px(g, 37, 17, '#4a4e56'); px(g, 42, 17, '#4a4e56');

  rc(g, 39, 0, 2, 6, '#c9a23b'); rc(g, 37, 1, 6, 2, '#c9a23b'); px(g, 39, 0, '#e8c04a');   // КРЪСТЪТ
  // ОТРЯЗВАМЕ кулата под линията на билото — под ската просто я няма (никакъв теч)
  for (let c = 32; c <= 48; c++) g.clearRect(c, iso2EdgeY(oy, Math.min(31, c - 16)) - (8 + roofH) + 1, 1, 80);
  iso2Body(g, R, oy, wallH, roofH, pal);
  // контрафорси по фасадата
  for (const cx2 of [6, 24]) { const ey = iso2EdgeY(oy, cx2); for (let k = 2; k <= wallH - 2; k++) { px(g, cx2, ey + k, '#6d7280'); px(g, cx2 + 1, ey + k, '#4a4e56'); } }
  // АРКА-ВРАТА в центъра на фасадата
  iso2Door(g, oy, wallH, 12, 8, 14);
  { const ey = iso2EdgeY(oy, 15); px(g, 13, ey + wallH - 15, '#33373d'); px(g, 17, ey + wallH - 15, '#33373d'); }
  // РОЗЕТКАТА — кръгло топло прозорче над вратата
  { const mx = 15, ey = iso2EdgeY(oy, mx);

  for (const wx of [38, 46, 54]) {

function genHearthRune() {
  const mkLayer = (col, dilate) => {
    const g = mk(11, 14);
    const set = new Set();
    for (const [x, y] of HEARTH_RUNE_PX) {
      set.add((x + 2) + ':' + (y + 2));
      if (dilate) for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) set.add((x + 2 + dx) + ':' + (y + 2 + dy));

    for (const key of set) { const [x, y] = key.split(':').map(Number); px(g, x, y, col); }

  };
  return { halo: mkLayer('#2f8a80', true), core: mkLayer('#a8fff2', false) };
}

// ---------- рисуване с целочислено мащабиране ----------
function blit(ctx2, spr, x, y, flip, alpha) {
  x |= 0; y |= 0;
  if (alpha !== undefined) ctx2.globalAlpha = alpha;
  if (flip) {
    ctx2.save();
    ctx2.translate(x + spr.width * SCALE, y);
    ctx2.scale(-1, 1);
    ctx2.drawImage(spr, 0, 0, spr.width, spr.height, 0, 0, spr.width * SCALE, spr.height * SCALE);
    ctx2.restore();
  } else {
    ctx2.drawImage(spr, 0, 0, spr.width, spr.height, x, y, spr.width * SCALE, spr.height * SCALE);
  }
  if (alpha !== undefined) ctx2.globalAlpha = 1;
}

'use strict';
// ================= ЗВУК: процедурни ефекти + тъмна фонова музика (WebAudio) =================

const Sfx = {
  ctx: null, master: null, musicGain: null, muted: false,
  _noiseBuf: null, _musicTimer: 0, _bar: 0,

  baseGain() {
    const v = (typeof G !== 'undefined' && G.meta && G.meta.volume !== undefined) ? G.meta.volume : 0.8;
    return 0.7 * v;
  },
  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { return; }
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : this.baseGain();
    this.master.connect(this.ctx.destination);
    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0.16;
    this.musicGain.connect(this.master);
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setVolume(v) {
    if (typeof G !== 'undefined' && G.meta) G.meta.volume = clamp(v, 0, 1);
    if (this.master && !this.muted) this.master.gain.value = this.baseGain();
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : this.baseGain();
    return this.muted;
  },

  noise() {
    if (!this._noiseBuf) {
      const len = this.ctx.sampleRate * 1;
      this._noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this._noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = this.ctx.createBufferSource();
    src.buffer = this._noiseBuf;
    return src;
  },

  // общ хеликоптер: осцилатор/шум + плик + филтър
  hit(o) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(o.vol || 0.2, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + (o.dur || 0.2));
    let node;
    if (o.noise) {
      node = this.noise();
      const f = this.ctx.createBiquadFilter();
      f.type = o.ftype || 'lowpass';
      f.frequency.setValueAtTime(o.f || 1200, t0);
      if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t0 + (o.dur || 0.2));
      node.connect(f); f.connect(g);
    } else {
      node = this.ctx.createOscillator();
      node.type = o.type || 'square';
      node.frequency.setValueAtTime(o.f || 440, t0);
      if (o.f1) node.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t0 + (o.dur || 0.2));
      node.connect(g);
    }
    g.connect(this.master);
    node.start(t0);
    node.stop(t0 + (o.dur || 0.2) + 0.05);
  },

  play(name) {
    if (!this.ctx || this.muted) return;
    switch (name) {
      case 'swing': this.hit({ noise: true, f: 2400, f1: 400, dur: 0.12, vol: 0.12, ftype: 'bandpass' }); break;
      case 'hit': this.hit({ noise: true, f: 900, f1: 200, dur: 0.14, vol: 0.22 }); this.hit({ f: 220, f1: 90, dur: 0.1, vol: 0.12, type: 'square' }); break;
      case 'crit': this.hit({ noise: true, f: 1400, f1: 250, dur: 0.2, vol: 0.26 }); this.hit({ f: 520, f1: 130, dur: 0.16, vol: 0.16, type: 'sawtooth' }); break;
      case 'hurt': this.hit({ f: 180, f1: 60, dur: 0.25, vol: 0.24, type: 'sawtooth' }); this.hit({ noise: true, f: 600, f1: 150, dur: 0.18, vol: 0.14 }); break;
      case 'die': this.hit({ noise: true, f: 800, f1: 60, dur: 0.45, vol: 0.24 }); this.hit({ f: 140, f1: 30, dur: 0.4, vol: 0.18, type: 'triangle' }); break;
      case 'coin': this.hit({ f: 1050, dur: 0.06, vol: 0.1, type: 'square' }); setTimeout(() => this.hit({ f: 1500, dur: 0.12, vol: 0.1, type: 'square' }), 55); break;
      case 'potion': this.hit({ f: 300, f1: 700, dur: 0.18, vol: 0.14, type: 'sine' }); setTimeout(() => this.hit({ f: 500, f1: 900, dur: 0.14, vol: 0.1, type: 'sine' }), 90); break;
      case 'fire': this.hit({ noise: true, f: 2000, f1: 300, dur: 0.3, vol: 0.16 }); this.hit({ f: 300, f1: 90, dur: 0.28, vol: 0.1, type: 'sawtooth' }); break;
      case 'boom': this.hit({ noise: true, f: 500, f1: 50, dur: 0.5, vol: 0.3 }); this.hit({ f: 90, f1: 30, dur: 0.45, vol: 0.24, type: 'sine' }); break;
      case 'dash': this.hit({ noise: true, f: 3000, f1: 800, dur: 0.14, vol: 0.1, ftype: 'highpass' }); break;
      case 'level': [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.hit({ f, dur: 0.22, vol: 0.14, type: 'triangle' }), i * 90)); break;
      case 'open': this.hit({ f: 160, f1: 240, dur: 0.15, vol: 0.14, type: 'square' }); setTimeout(() => this.hit({ f: 900, dur: 0.1, vol: 0.08, type: 'square' }), 120); break;
      case 'stairs': [440, 349, 262].forEach((f, i) => setTimeout(() => this.hit({ f, dur: 0.25, vol: 0.12, type: 'triangle' }), i * 140)); break;
      case 'pickup': this.hit({ f: 700, f1: 1100, dur: 0.1, vol: 0.1, type: 'square' }); break;
      case 'roar': this.hit({ f: 110, f1: 45, dur: 0.8, vol: 0.3, type: 'sawtooth' }); this.hit({ noise: true, f: 400, f1: 80, dur: 0.7, vol: 0.18 }); break;
      case 'tp': this.hit({ f: 1200, f1: 300, dur: 0.25, vol: 0.1, type: 'sine' }); break;
      case 'thump': this.hit({ f: 65, f1: 35, dur: 0.18, vol: 0.22, type: 'sine' }); break;
      case 'deny': this.hit({ f: 180, dur: 0.12, vol: 0.12, type: 'square' }); break;
    }
  },

  // много семпла тъмна музика: пад-акорд на всеки такт + рядка камбанка
  chord(notes, dur) {
    if (!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime;
    for (const f of notes) {
      const o = this.ctx.createOscillator();
      o.type = 'triangle';
      o.frequency.value = f;
      const o2 = this.ctx.createOscillator();
      o2.type = 'triangle';
      o2.frequency.value = f * 1.005;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(0.05, t0 + 0.6);
      g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
      const fl = this.ctx.createBiquadFilter();
      fl.type = 'lowpass'; fl.frequency.value = 700;
      o.connect(fl); o2.connect(fl); fl.connect(g); g.connect(this.musicGain);
      o.start(t0); o.stop(t0 + dur + 0.1);
      o2.start(t0); o2.stop(t0 + dur + 0.1);
    }
  },
  bell(f) {
    if (!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    o.type = 'sine'; o.frequency.value = f;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.06, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.6);
    o.connect(g); g.connect(this.musicGain);
    o.start(t0); o.stop(t0 + 1.7);
  },

  updateMusic(dt, inGame) {
    if (!this.ctx || this.muted) return;
    this._musicTimer -= dt;
    if (this._musicTimer <= 0) {
      this._musicTimer = 3.6;
      const A = 110, C = 130.8, D = 146.8, E = 164.8, F = 174.6, G_ = 196;
      const prog = [[A, C, E], [F, A, C], [D, F, A], [E, G_ * 0.5 ? 98 : 98, 123.5]];
      const ch = prog[this._bar % 4];
      this.chord(ch, 3.8);
      if (inGame && Math.random() < 0.45) {
        setTimeout(() => this.bell(pick([440, 523, 587, 659, 880])), Math.random() * 2000);
      }
      this._bar++;
    }
  },
};

// разделени пулове за теглене
// 'range' е ИЗКЛЮЧЕН от генерирането: обхватът идва САМО от размера на оръжието (кама < меч < ... < вериги)
const AFFIX_PRE = Object.keys(AFFIXES).filter(k => AFFIXES[k].pool === 'pre' && k !== 'range');
const AFFIX_SUF = Object.keys(AFFIXES).filter(k => AFFIXES[k].pool === 'suf' && k !== 'range');
// тегли `count` афикса: половината от префиксите, половината от суфиксите (при 1 -> произволен пул)
function rollAffixes(depth, count, slot, valMult) {
  const mult = (1 + 0.11 * (depth - 1)) * (valMult || 1);
  const mkAff = k => { const a = AFFIXES[k]; return { k, v: Math.max(1, Math.round(rnd(a.r[0], a.r[1]) * mult)), up: 0 }; };
  const forSlot = arr => arr.filter(k => !(slot === 'weapon' && k === 'armor')); // бронята не пада на оръжие
  const pre = forSlot(AFFIX_PRE.slice()), suf = forSlot(AFFIX_SUF.slice());
  const out = [];
  const take = (pool, n) => { for (let i = 0; i < n && pool.length; i++) out.push(mkAff(pool.splice((Math.random() * pool.length) | 0, 1)[0])); };
  if (count === 1) take(Math.random() < 0.5 ? pre : suf, 1);
  else { const nPre = Math.ceil(count / 2); take(pre, nPre); take(suf, count - nPre); }
  return out;
}

// генерира конкретен уникат: фиксирана сила + 1-2 случайни афикса отгоре
function genUnique(depth, uid) {
  const def = uid ? UNIQUES.find(u => u.uid === uid) : pick(UNIQUES);
  const mult = 1 + 0.13 * (depth - 1);
  const it = { id: Items._id++, uid: def.uid, slot: def.slot, type: def.type, icon: def.icon, rarity: 4, lvl: depth, name: def.name, power: def.power, affixes: [] };
  if (def.dmg) { it.dmg = Math.round(rnd(def.dmg[0], def.dmg[1]) * mult); it.cd = def.cd; it.range = def.range; it.arc = def.arc; }
  if (def.armor) it.armor = Math.round(rnd(def.armor[0], def.armor[1]) * mult);
  it.affixes = rollAffixes(depth, rndi(1, 2), def.slot, 1.3); // 1-2 случайни афикса, разделени пре/суф
  return it;
}

// омагьосване (преправяне): хвърля наново ВСИЧКИ афикси — брой и рядкост се пазят, up се нулира.
// Уникатите се преправят (случайните им афикси), но фиксираната им сила (power) НЕ се пипа.
function rerollAffixes(it) {
  const count = it.affixes ? it.affixes.length : 0;
  if (!count) return;
  const valMult = it.uid ? 1.3 : (it.rarity === 4 ? 1.35 : 1);
  it.affixes = rollAffixes(it.lvl || (G.depth || 1), count, it.slot, valMult); // rollAffixes слага up:0
  // името се преизчислява от новия префикс (уникати и оранжеви пазят фиксираното си име)
  if (!it.uid && it.rarity < 4) {
    const base = BASES.find(b => b.type === it.type);
    const nameAff = it.affixes.find(a => AFFIXES[a.k].pool === 'pre') || it.affixes[0];
    if (base && nameAff) it.name = affixForm(AFFIXES[nameAff.k], base.g) + ' ' + base.n.toLowerCase();
  }
}

const Items = {
  _id: 1,

  rollRarity(depth, boost) {
    // претеглен избор с бонус за дълбочина
    const ws = RARITY.map((r, i) => r.w + (i > 0 ? depth * 1.2 + (boost || 0) * (i) : 0));
    let tot = 0; for (const w of ws) tot += w;
    let v = Math.random() * tot;
    for (let i = 0; i < ws.length; i++) { v -= ws[i]; if (v <= 0) return i; }
    return 0;
  },

  gen(depth, boost, maxRar) {
    const base = (() => {
      const tot = BASES.reduce((s, b) => s + b.w, 0);
      let v = Math.random() * tot;
      for (const b of BASES) { v -= b.w; if (v <= 0) return b; }
      return BASES[0];
    })();
    let rar = this.rollRarity(depth, boost);
    if ((base.slot === 'ring' || base.slot === 'amulet') && rar === 0) rar = 1;
    if (maxRar !== undefined) rar = Math.min(rar, maxRar);
    const mult = 1 + 0.13 * (depth - 1);
    // lvl = силата на предмета (дълбочината, на която е създаден); цветът е броят свойства
    const it = { id: this._id++, slot: base.slot, type: base.type, icon: base.icon, rarity: rar, lvl: depth, affixes: [] };
    if (base.dmg) {
      it.dmg = Math.round(rnd(base.dmg[0], base.dmg[1]) * mult * (1 + rar * 0.06));
      it.cd = base.cd; it.range = base.range; it.arc = base.arc;
    }
    if (base.armor) it.armor = Math.round(rnd(base.armor[0], base.armor[1]) * mult * (1 + rar * 0.08));

    const chosen = rollAffixes(depth, RARITY[rar].affixes, base.slot, rar === 4 ? 1.35 : 1);
    it.affixes = chosen;

    // името взима първия ПРЕФИКС (звучи по-естествено), иначе първия наличен афикс
    const nameAff = chosen.find(a => AFFIXES[a.k].pool === 'pre') || chosen[0];
    if (rar === 4) it.name = LEGENDARY_NAMES[base.type] || ('Relic: ' + base.n);
    else if (nameAff) it.name = affixForm(AFFIXES[nameAff.k], base.g) + ' ' + base.n.toLowerCase();
    else it.name = base.n;
    return it;
  },

  // какво пада от враг; mult — множител за елит/босс
  // X век: монетите са ОСКЪДНИ (шепа сребро) — истинската плячка е сеченото сребро
  // (гривни, слитъци, накити), което тежи и се обменя при сарафина
  rollDrop(depth, mult, silverFind) {
    const out = [];
    const m = mult || 1;
    const sf = 1 + (silverFind || 0) / 100;
    // ТВЪРДА икономика: НЕ всяко чудовище носи сребро, и то е шепа монети
    if (chance(0.22 * Math.min(1, m) * sf)) {
      out.push({ gold: Math.max(1, Math.min(4, Math.round((1 + rnd(0, 1.4) + depth * 0.12) * m))) }); // 1-3 монети
    }
    if (chance(0.045 * m * sf)) out.push({ silver: rollSilver(depth) });        // сечено сребро — рядко
    if (chance(0.04 * m)) out.push({ item: this.gen(depth, m > 1 ? 12 : 0) });
    if (chance(0.012 * m)) out.push({ item: genTome() });                       // томове с магии
    if (G.meta.legendPool && chance(m > 1 ? 0.025 : 0.004)) out.push({ item: genUnique(depth) }); // уникати — само с отключен пул
    return out;
  },

  rarityCol(it) { return RARITY[it.rarity].col; },

  statLines(it) {
    const L = [];
    if (it.soulstone) {
      L.push({ s: 'Revives you once at 50% life', c: '#ff8aa0' });
      L.push({ s: 'on a lethal hit, then shatters.', c: '#ff8aa0' });
      L.push({ s: 'Spent after Second Chance (free).', c: '#7d8899' });
      return L;
    }
    if (it.slot === 'spell') {
      const sp = SPELLS[it.spell];
      L.push({ s: sp.d, c: '#a8b2c4' });
      L.push({ s: sp.cost + ' mana · ' + sp.cd + ' sec cooldown', c: '#7fb0ff' });
      L.push({ s: 'take it to Master Zahari', c: '#c84fff' });
      return L;
    }
    if (it.dmg) L.push({ s: it.dmg + ' damage  (' + (1 / it.cd).toFixed(1) + '/sec)', c: '#e8e4d0' });
    if (it.armor) L.push({ s: it.armor + ' armor', c: '#e8e4d0' });
    for (const a of it.affixes) {
      const d = AFFIXES[a.k];
      if (!d) continue;
      // омагьосаните афикси показват нивото си със звезди, напр. ★★☆
      const stars = (a.up || 0) > 0 ? '  ' + '★'.repeat(a.up) + '☆'.repeat(3 - a.up) : '';
      L.push({ s: '+' + a.v + ' ' + d.n + stars, c: (a.up || 0) > 0 ? '#57e6c8' : '#7fd0a0' });
    }
    if (it.power) {
      // уникална сила — на златни редове, пренесена по думи
      const words = it.power.split(' ');
      let line = '';
      for (const w of words) {
        if ((line + ' ' + w).length > 26) { L.push({ s: line, c: '#ff7a1f' }); line = w; }
        else line = line ? line + ' ' + w : w;
      }
      if (line) L.push({ s: line, c: '#ff7a1f' });
    }
    return L;
  },
};

'use strict';
// ================= ПОДЗЕМИЯ: процедурна генерация на етажи =================

// вярно ли е, че ако запечатаме стаята, ВСИЧКИ други стаи остават достижими от старта?
// (пази специалните стаи да не блокират единствен коридор -> да не заключват играча)
function sealKeepsConnected(room, rooms, cells, w, h, sx, sy) {
  const gates = roomGates(room, cells, w, h);
  const saved = gates.map(([i, j]) => cells[j * w + i]);
  for (const [i, j] of gates) cells[j * w + i] = WALL; // временно зазиждаме входовете
  const seen = new Uint8Array(w * h);
  const q = [sy * w + sx]; seen[sy * w + sx] = 1;
  for (let qi = 0; qi < q.length; qi++) {
    const c = q[qi], cx = c % w, cy = (c / w) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      const ni = ny * w + nx;
      if (cells[ni] === FLOOR && !seen[ni]) { seen[ni] = 1; q.push(ni); }
    }
  }
  gates.forEach(([i, j], k) => cells[j * w + i] = saved[k]); // връщаме
  for (const rr of rooms) { if (rr !== room && !seen[rr.cy * w + rr.cx]) return false; }
  return true;
}
// подовите плочки по ръба на стаята, чийто външен съсед е под (=входовете-проходи)
function roomGates(room, cells, w, h) {
  const g = [];
  for (let i = room.x; i < room.x + room.w; i++) {
    if (room.y - 1 >= 0 && cells[room.y * w + i] === FLOOR && cells[(room.y - 1) * w + i] === FLOOR) g.push([i, room.y]);
    if (room.y + room.h < h && cells[(room.y + room.h - 1) * w + i] === FLOOR && cells[(room.y + room.h) * w + i] === FLOOR) g.push([i, room.y + room.h - 1]);
  }
  for (let j = room.y; j < room.y + room.h; j++) {
    if (room.x - 1 >= 0 && cells[j * w + room.x] === FLOOR && cells[j * w + room.x - 1] === FLOOR) g.push([room.x, j]);
    if (room.x + room.w < w && cells[j * w + room.x + room.w - 1] === FLOOR && cells[j * w + room.x + room.w] === FLOOR) g.push([room.x + room.w - 1, j]);
  }
  return g;
}

const Dungeon = {
  generate(depth, runSeed) {
    const R = mulberry32(((depth * 2654435761) ^ runSeed) >>> 0);
    const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
    const size = Math.min(62, 40 + depth * 2);
    const w = size, h = size;
    const cells = new Uint8Array(w * h); // VOID
    const variant = new Uint8Array(w * h);

    // --- стаи ---
    const rooms = [];
    for (let tries = 0; tries < 90 && rooms.length < 9 + Math.min(5, depth); tries++) {
      const rw = ri(5, 10), rh = ri(5, 10);
      const x = ri(2, w - rw - 3), y = ri(2, h - rh - 3);
      let ok = true;
      for (const r of rooms) {
        if (x < r.x + r.w + 2 && x + rw + 2 > r.x && y < r.y + r.h + 2 && y + rh + 2 > r.y) { ok = false; break; }
      }
      if (!ok) continue;
      rooms.push({ x, y, w: rw, h: rh, cx: x + (rw >> 1), cy: y + (rh >> 1) });
      for (let j = y; j < y + rh; j++) for (let i = x; i < x + rw; i++) cells[j * w + i] = FLOOR;
    }
    if (rooms.length < 2) return this.generate(depth, runSeed + 101); // защита

    // --- коридори (свързваме всяка стая с най-близката вече свързана) ---
    const carve = (i, j) => {
      for (let dj = 0; dj < 2; dj++) for (let di = 0; di < 2; di++) {
        const x = i + di, y = j + dj;
        if (x > 0 && y > 0 && x < w - 1 && y < h - 1) cells[y * w + x] = FLOOR;
      }
    };
    const corridor = (a, b) => {
      let x = a.cx, y = a.cy;
      const horFirst = R() < 0.5;
      const goX = () => { while (x !== b.cx) { carve(x, y); x += x < b.cx ? 1 : -1; } };
      const goY = () => { while (y !== b.cy) { carve(x, y); y += y < b.cy ? 1 : -1; } };
      if (horFirst) { goX(); goY(); } else { goY(); goX(); }
      carve(x, y);
    };
    const connected = [rooms[0]];
    const rest = rooms.slice(1);
    while (rest.length) {
      let bi = 0, bj = 0, bd = 1e9;
      for (let i = 0; i < rest.length; i++) for (let j = 0; j < connected.length; j++) {
        const d = Math.abs(rest[i].cx - connected[j].cx) + Math.abs(rest[i].cy - connected[j].cy);
        if (d < bd) { bd = d; bi = i; bj = j; }
      }
      corridor(connected[bj], rest[bi]);
      connected.push(rest.splice(bi, 1)[0]);
    }
    // няколко цикъла за алтернативни пътища
    for (let k = 0; k < 2 && rooms.length > 3; k++) {
      const a = rooms[ri(0, rooms.length - 1)], b = rooms[ri(0, rooms.length - 1)];
      if (a !== b) corridor(a, b);
    }

    // --- стени около пода ---
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      if (cells[j * w + i] !== VOID) continue;
      let nearFloor = false;
      for (let dj = -1; dj <= 1 && !nearFloor; dj++) for (let di = -1; di <= 1; di++) {
        const x = i + di, y = j + dj;
        if (x >= 0 && y >= 0 && x < w && y < h && cells[y * w + x] === FLOOR) { nearFloor = true; break; }
      }
      if (nearFloor) cells[j * w + i] = WALL;
    }
    for (let i = 0; i < w * h; i++) variant[i] = Math.floor(R() * 6);

    // --- начало и най-далечна стая (BFS по пода) ---
    const startRoom = rooms[0];
    const sx = startRoom.cx, sy = startRoom.cy;
    const distMap = new Int32Array(w * h).fill(-1);
    const q = [sy * w + sx];
    distMap[sy * w + sx] = 0;
    for (let qi = 0; qi < q.length; qi++) {
      const cur = q[qi], cx0 = cur % w, cy0 = (cur / w) | 0;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = cx0 + dx, ny = cy0 + dy;
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        const ni = ny * w + nx;
        if (cells[ni] === FLOOR && distMap[ni] < 0) { distMap[ni] = distMap[cur] + 1; q.push(ni); }
      }
    }
    let farRoom = rooms[rooms.length - 1], farD = -1;
    for (const r of rooms) {
      const d = distMap[r.cy * w + r.cx];
      if (d > farD) { farD = d; farRoom = r; }
    }

    // --- босовият етаж: разширяваме стаята до ГОЛЯМА (място за битката + да не заклещим боса) ---
    if (depth % 5 === 0) {
      const TGT = 14;
      const nw = Math.min(TGT, w - 6), nh = Math.min(TGT, h - 6);
      const nx = clamp(farRoom.cx - (nw >> 1), 2, w - nw - 2);
      const ny = clamp(farRoom.cy - (nh >> 1), 2, h - nh - 2);
      for (let j = ny; j < ny + nh; j++) for (let i = nx; i < nx + nw; i++) cells[j * w + i] = FLOOR;
      // стени около новия под (само където е било празно, за да не зазидаме входовете-коридори)
      for (let j = ny - 1; j <= ny + nh; j++) for (let i = nx - 1; i <= nx + nw; i++) {
        if (i < 0 || j < 0 || i >= w || j >= h) continue;
        if (cells[j * w + i] === VOID) cells[j * w + i] = WALL;
      }
      farRoom.x = nx; farRoom.y = ny; farRoom.w = nw; farRoom.h = nh;
      farRoom.cx = nx + (nw >> 1); farRoom.cy = ny + (nh >> 1);
    }

    const map = { w, h, cells, variant, rooms, start: { x: sx + 0.5, y: sy + 0.5 }, distMap };
    const props = [];
    const spawns = [];
    const used = new Set();
    used.add(sy * w + sx);
    const free = (i, j) => cells[j * w + i] === FLOOR && !used.has(j * w + i);
    const take = (i, j) => { used.add(j * w + i); };

    // --- стълби (на босов етаж — запечатани) ---
    const bossFloor = depth % 5 === 0;
    props.push({ kind: 'stairs', x: farRoom.cx + 0.5, y: farRoom.cy + 0.5, r: 0.45, sealed: bossFloor, solid: false });
    take(farRoom.cx, farRoom.cy);
    if (bossFloor) { take(farRoom.cx, farRoom.cy - 3); take(farRoom.cx, farRoom.cy + 1); } // мястото на боса остава свободно

    // --- фонтан ---
    if (R() < 0.65) {
      const r = rooms[ri(1, rooms.length - 1)];
      const i = r.cx + (R() < 0.5 ? -1 : 1), j = r.cy;
      if (free(i, j)) { props.push({ kind: 'fountain', x: i + 0.5, y: j + 0.5, r: 0.42, solid: true, used: false }); take(i, j); }
    }

    // --- сандъци ---
    const nChests = 1 + (R() < 0.35 ? 1 : 0);
    for (let c = 0; c < nChests; c++) {
      const r = rooms[ri(1, rooms.length - 1)];
      const i = ri(r.x + 1, r.x + r.w - 2), j = ri(r.y + 1, r.y + r.h - 2);
      if (free(i, j)) { props.push({ kind: 'chest', x: i + 0.5, y: j + 0.5, r: 0.4, solid: true, opened: false }); take(i, j); }
    }

    // --- специални стаи: Съкровищница (%5===3) и Арена (четни етажи) ---
    const usedRooms = new Set([startRoom, farRoom]);
    // разширената босова стая може да е погълнала съседни стаи -> изключваме всяка, която я застъпва
    const intersects = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    const pickSpecialRoom = () => {
      // само стаи, чието запечатване НЕ отрязва достъпа до останалите (иначе играчът засяда), и които не застъпват босовата/стълбищната стая
      const avail = rooms.filter(r => !usedRooms.has(r) && r.w >= 4 && r.h >= 4 && !intersects(r, farRoom) && sealKeepsConnected(r, rooms, cells, w, h, sx, sy));
      if (!avail.length) return null;
      const r = avail[ri(0, avail.length - 1)];
      usedRooms.add(r);
      return r;
    };
    const vaultRoom = (depth % 5 === 3) ? pickSpecialRoom() : null;
    const arenaRoom = (depth % 2 === 0) ? pickSpecialRoom() : null;
    let vault = null, arena = null;
    if (vaultRoom) {
      // заключени врати на всеки вход + 3 сандъка вътре, без обикновени врагове
      for (const [gi, gj] of roomGates(vaultRoom, cells, w, h)) props.push({ kind: 'vaultdoor', x: gi + 0.5, y: gj + 0.5, r: 0.5, solid: true, opened: false });
      let placed = 0;
      for (let tries = 0; tries < 50 && placed < 3; tries++) {
        const i = ri(vaultRoom.x + 1, vaultRoom.x + vaultRoom.w - 2), j = ri(vaultRoom.y + 1, vaultRoom.y + vaultRoom.h - 2);
        if (free(i, j)) { props.push({ kind: 'chest', x: i + 0.5, y: j + 0.5, r: 0.4, solid: true, opened: false }); take(i, j); placed++; }
      }
      vault = { room: { x: vaultRoom.x, y: vaultRoom.y, w: vaultRoom.w, h: vaultRoom.h } };
    }
    if (arenaRoom) {
      props.push({ kind: 'arena', x: arenaRoom.cx + 0.5, y: arenaRoom.cy + 0.5, r: 0.5, solid: false });
      take(arenaRoom.cx, arenaRoom.cy);
      arena = { room: { x: arenaRoom.x, y: arenaRoom.y, w: arenaRoom.w, h: arenaRoom.h } };
    }

    // --- мангали, бъчви, декор ---
    for (const r of rooms) {
      if (R() < 0.75) {
        const corners = [[r.x, r.y], [r.x + r.w - 1, r.y], [r.x, r.y + r.h - 1], [r.x + r.w - 1, r.y + r.h - 1]];
        const [i, j] = corners[ri(0, 3)];
        if (free(i, j)) { props.push({ kind: 'brazier', x: i + 0.5, y: j + 0.5, r: 0.35, solid: true, animT: R() * 3 }); take(i, j); }
      }
      const nB = ri(0, 2);
      for (let b = 0; b < nB; b++) {
        const i = ri(r.x, r.x + r.w - 1), j = ri(r.y, r.y + r.h - 1);
        if (free(i, j)) {
          props.push({ kind: R() < 0.6 ? 'barrel' : 'crate', x: i + 0.5, y: j + 0.5, r: 0.35, solid: true, hp: 1 });
          take(i, j);
        }
      }
      // плосък декор (кости/отломки) — не блокира
      if (R() < 0.6) {
        const i = ri(r.x, r.x + r.w - 1), j = ri(r.y, r.y + r.h - 1);
        if (cells[j * w + i] === FLOOR) props.push({ kind: R() < 0.5 ? 'bones' : 'rubble', x: i + 0.5, y: j + 0.5, r: 0, solid: false, flat: true });
      }
    }

    // --- врагове ---
    const kinds = [];
    const pushK = (k, wgt, minD) => { if (depth >= minD) kinds.push({ k, w: wgt }); };
    pushK('slime', 30, 1); pushK('skeleton', 24, 1); pushK('bat', 20, 2);
    pushK('archer', 16, 3); pushK('shaman', 12, 5); pushK('brute', 10, 6); pushK('wraith', 9, 8);
    const pickKind = () => {
      let tot = 0; for (const k of kinds) tot += k.w;
      let v = R() * tot;
      for (const k of kinds) { v -= k.w; if (v <= 0) return k.k; }
      return 'slime';
    };

    for (const r of rooms) {

      if (bossFloor && r === farRoom) continue; // босовата стая е само за боса
      if (r === vaultRoom || r === arenaRoom) continue; // специалните стаи нямат обикновени врагове
      const roomN = Math.min(budget, Math.max(1, Math.round(r.w * r.h / 14) + (R() < 0.5 ? 0 : 1)));

      if (kg) { kg.elite = true; kg.keyGuardian = true; }
    }

      map, props, spawns, theme: themeIndexFor(depth), bossFloor,
      bossRoom: bossFloor ? { x: farRoom.x, y: farRoom.y, w: farRoom.w, h: farRoom.h } : null,
      vault, arena,
    };
  },

  generate(seed) {

      if (i >= B && j >= B && i < w - B && j < h - B) cells[j * w + i] = FLOOR;
      variant[j * w + i] = Math.floor(R() * 4);
    }

    const cx = w >> 1, cy = h >> 1;
    // сгъстен лагер: търговците са на 7-9 плочки от огъня, порталът малко по-далеч
    const spots = {
      camp: { x: cx, y: cy },
      weapon: { x: cx - 8, y: cy - 3 },          // запад
      armor: { x: cx + 8, y: cy - 3 },           // изток
      potion: { x: cx - 6, y: cy + 6 },          // югозапад
      jewel: { x: cx + 1, y: cy - 9 },           // север, при руините

      portal: { x: cx + 9, y: cy + 9 },          // югоизток — гробището

// ---------- врагове ----------
function makeEnemy(kind, t, x, y, hpMult, dmgMult) {
  return {
    kind, t,
    x, y, r: t.r,
    hp: Math.round(t.hp * hpMult), maxhp: Math.round(t.hp * hpMult),
    dmg: t.dmg * dmgMult,
    elite: false,
    state: 'idle', aggro: false,
    atkCd: 0, windupT: 0, flash: 0, animT: rnd(10),
    flip: false, path: null, pathT: 0, dead: false,
    wobble: rnd(Math.PI * 2), blinkCd: 0, roared: false,
    slowT: 0, poisonT: 0, burnT: 0,
  };
}
// най-близката свободна подова плочка (не стена, не плътен реквизит) — за портала/боса
function freeFloorNear(x, y) {
  const solidAt = (i, j) => {
    if (cellAt(i, j) !== FLOOR) return true;
    for (const pr of G.props) if (pr.solid && !pr.broken && Math.floor(pr.x) === i && Math.floor(pr.y) === j) return true;
    return false;
  };
  const i0 = Math.floor(x), j0 = Math.floor(y);
  if (!solidAt(i0, j0)) return { x, y };
  for (let rad = 1; rad <= 8; rad++)
    for (let dj = -rad; dj <= rad; dj++) for (let di = -rad; di <= rad; di++)
      if (Math.abs(di) === rad || Math.abs(dj) === rad) {
        const i = i0 + di, j = j0 + dj;
        if (!solidAt(i, j)) return { x: i + 0.5, y: j + 0.5 };
      }
  return { x, y };
}
function spawnEnemies(spawns) {
  const depthHp = 1 + 0.38 * (G.depth - 1);
  const depthDmg = 1 + 0.26 * (G.depth - 1);
  for (const s of spawns) {
    if (s.bossId) {
      // бос от отделната структура BOSS_TYPES
      const bd = BOSS_TYPES[s.bossId];
      const t = Object.assign({ aggro: 99, xp: bd.xp, boss: true }, bd);
      // предпазна проверка: никога да не спауннем боса залепен/забит в стена
      const bp = freeFloorNear(s.x, s.y);
      const e = makeEnemy(s.bossId, t, bp.x, bp.y, depthHp, depthDmg);
      e.bossDef = bd;
      e.phase = 1;
      e.sigT = 5;       // таймер на сигнатурната механика
      e.dormant = true; // чака в стаята си, докато влезеш
      G.enemies.push(e);
      continue;
    }
    const t = ENEMY_TYPES[s.kind];
    const e = makeEnemy(s.kind, t, s.x, s.y, depthHp * (s.elite ? 2.4 : 1), depthDmg * (s.elite ? 1.5 : 1));
    e.elite = s.elite;
    if (s.elite) {
      // модификатор-флаг върху съществуващия елит
      e.mod = pick(Object.keys(ELITE_MODS));
      if (e.mod === 'shielded') e.shield = true;
      if (e.mod === 'swift') { e.swift = true; }
      if (e.mod === 'firetrail') e.trailT = 0;
      if (e.mod === 'mender') e.mendT = 0;
    }
    if (s.keyGuardian) e.keyGuardian = true; // пази ключа за Съкровищницата
    if (s.arena) e.arena = true;             // враг от вълна на Арената
    G.enemies.push(e);
  }
}
// призоваване по време на бой (адове на Костния крал, тотеми на Архилича)
function summonEnemy(kind, x, y) {
  if (hitsWall(x, y, ENEMY_TYPES[kind].r)) {
    for (let a = 0; a < 8; a++) {
      const nx = x + rnd(-1.5, 1.5), ny = y + rnd(-1.5, 1.5);
      if (!hitsWall(nx, ny, ENEMY_TYPES[kind].r)) { x = nx; y = ny; break; }
    }
  }
  const e = makeEnemy(kind, ENEMY_TYPES[kind], x, y, 1 + 0.38 * (G.depth - 1), 1 + 0.26 * (G.depth - 1));
  e.aggro = true;
  e.summoned = true; // без плячка и без опит — за да не се фарми босът
  G.enemies.push(e);
  burst(x, y, ['#c84fff', '#6a4f9e', '#d8d3c0'], 12, 3.5, 0.5);
  return e;
}

// тих DoT — без нокбек и звуков спам
function damageEnemyDot(e, dmg, col) {
  e.hp -= dmg;
  if (chance(0.35)) addText(e.x, e.y, Math.max(1, Math.round(dmg)), col);
  if (e.hp <= 0 && !e.dead) killEnemy(e);
}

function updateEnemies(dt) {
  const p = G.player;
  for (const e of G.enemies) {
    if (e.dead) continue;
    e.flash = Math.max(0, e.flash - dt);
    e.atkCd = Math.max(0, e.atkCd - dt);
    e.animT += dt;
    e.pathT -= dt;
    e.blinkCd = Math.max(0, e.blinkCd - dt);
    // ефекти върху врага: забавяне, замразяване/зашеметяване, зареждане, отрова, огън
    e.slowT = Math.max(0, e.slowT - dt);
    e.stunT = Math.max(0, (e.stunT || 0) - dt);
    e.chargedT = Math.max(0, (e.chargedT || 0) - dt);
    if (e.poisonT > 0) {
      e.poisonT -= dt;
      e.dotAcc = (e.dotAcc || 0) + dt;
      if (e.dotAcc >= 0.5) { e.dotAcc -= 0.5; damageEnemyDot(e, (e.poisonDps || 4) * 0.5, '#5fd97a'); }
      if (e.dead) continue;
    }
    if (e.burnT > 0) {
      e.burnT -= dt;
      e.burnAcc = (e.burnAcc || 0) + dt;
      if (e.burnAcc >= 0.5) { e.burnAcc -= 0.5; damageEnemyDot(e, (e.burnDps || 4) * 0.5, '#ff8a1f'); }
      if (e.dead) continue;
    }

    if (e.dormant) continue; // босът чака церемонията по заключването

    const d = dist(e.x, e.y, p.x, p.y);
    const seesPlayer = d < e.t.aggro && losClear(e.x, e.y, p.x, p.y);
    if (seesPlayer) e.aggro = true;
    if (!e.aggro) continue;
    // замразен/зашеметен: нито движение, нито атака (само DoT-ите горе продължават)
    if (e.stunT > 0) {
      e.windupT = 0;
      if (chance(0.35)) addParticle({ x: e.x + rnd(-0.2, 0.2), y: e.y + rnd(-0.2, 0.2), z: 10 + rnd(0, 8), vx: rnd(-3, 3), vy: rnd(-3, 3), vz: 5, grav: 3, t: 0, life: 0.5, col: '#a8d8ff', size: 1 });
      continue;
    }

    // елитни модификатори в действие
    if (e.mod === 'mender') {
      e.mendT -= dt;
      if (e.mendT <= 0) {
        e.mendT = 1;
        for (const a of G.enemies) {
          if (a.dead || a === e || dist(a.x, a.y, e.x, e.y) > 3) continue;
          if (a.hp < a.maxhp) {
            a.hp = Math.min(a.maxhp, a.hp + a.maxhp * 0.03);
            addParticle({ x: a.x, y: a.y, z: 14, vx: 0, vy: 0, vz: 8, grav: -4, t: 0, life: 0.5, col: '#5fd97a', size: 1 });
          }
        }
      }
    }
    if (e.mod === 'firetrail') {
      e.trailT -= dt;
      if (e.trailT <= 0) { e.trailT = 0.35; addHazard({ type: 'fire', x: e.x, y: e.y, t: 0, life: 2.4, r: 0.55, dmg: e.dmg * 0.4 }); }
    }

    if (e.t.boss && !e.roared && seesPlayer) {
      e.roared = true;
      G.bossName = e.bossDef.name;
      toast(e.bossDef.name + ' awakens!', '#ff6b7a');
      Sfx.play('roar');
      G.shake = 8;
    }
    // босова логика: фази + сигнатурна механика
    if (e.bossDef && e.roared) updateBoss(e, dt, d);
    // щурм на Владетеля: прескача нормалния AI
    if (e.chargeState) { updateCharge(e, dt); continue; }

    // прозорец на атака
    if (e.windupT > 0) {
      e.windupT -= dt;
      if (e.windupT <= 0) enemyStrike(e, d);
      continue;
    }

    const inRange = e.t.ranged ? (d < e.t.range && seesPlayer) : (d < e.t.range + p.r);
    if (inRange && e.atkCd <= 0) {
      e.windupT = e.t.windup;
      e.state = 'windup';
      continue;
    }

    // движение
    if (e.t.static) continue; // тотемите не мърдат
    let tx = p.x, ty = p.y;
    let speed = e.t.spd * (e.swift ? 1.45 : 1) * (e.slowT > 0 ? 0.55 : 1);
    const fleeing = e.t.ranged && d < e.t.keep && seesPlayer;
    if (fleeing) {
      // кайтване — отдалечава се
      const a = Math.atan2(e.y - p.y, e.x - p.x);
      tx = e.x + Math.cos(a) * 2; ty = e.y + Math.sin(a) * 2;
    }
    if (e.t.blink && d < 2.2 && e.blinkCd <= 0) {
      // шаманът/личът се телепортира (но НЕ извън запечатаната босова стая)
      for (let att = 0; att < 8; att++) {
        const a = rnd(Math.PI * 2), rr = rnd(3, 4.5);
        const nx = e.x + Math.cos(a) * rr, ny = e.y + Math.sin(a) * rr;
        if (e.bossDef && G.bossRoom && G.bossRoomLocked) {
          const br = G.bossRoom;
          if (nx < br.x + 0.7 || nx > br.x + br.w - 0.7 || ny < br.y + 0.7 || ny > br.y + br.h - 0.7) continue;
        }
        if (e.keyGuardian && G.vault && !G.vaultUnlocked) { // да НЕ се телепортира в собствената си заключена съкровищница
          const vr = G.vault.room;
          if (nx >= vr.x && nx < vr.x + vr.w && ny >= vr.y && ny < vr.y + vr.h) continue;
        }
        if (e.arena && G.arena && G.arena.state !== 'idle') { // да НЕ излиза от запечатаната арена (иначе вълната не се чисти)
          const ar = G.arena.room;
          if (nx < ar.x + 0.7 || nx > ar.x + ar.w - 0.7 || ny < ar.y + 0.7 || ny > ar.y + ar.h - 0.7) continue;
        }
        if (!hitsWall(nx, ny, e.r)) {
          burst(e.x, e.y, ['#c84fff', '#f0b0ff'], 10, 3, 0.4);
          e.x = nx; e.y = ny;
          burst(e.x, e.y, ['#c84fff', '#f0b0ff'], 10, 3, 0.4);
          Sfx.play('tp');
          break;
        }
      }
      e.blinkCd = 3.5;
    }

    let mvx = 0, mvy = 0;
    if (losClear(e.x, e.y, tx, ty) || e.t.ghost) {
      const a = Math.atan2(ty - e.y, tx - e.x);
      mvx = Math.cos(a); mvy = Math.sin(a);
      e.path = null;
    } else if (!fleeing) {
      // път през лабиринта (но не и при бягство — иначе тръгва КЪМ играча)
      if (!e.path || e.pathT <= 0) {
        e.path = findPath(Math.floor(e.x), Math.floor(e.y), Math.floor(p.x), Math.floor(p.y));
        e.pathT = 0.7;
      }
      if (e.path && e.path.length) {
        const wp = e.path[0];
        if (dist(e.x, e.y, wp.x, wp.y) < 0.35) e.path.shift();
        if (e.path.length) {
          const a = Math.atan2(e.path[0].y - e.y, e.path[0].x - e.x);
          mvx = Math.cos(a); mvy = Math.sin(a);
        }
      }
    }
    if (e.kind === 'bat') {
      // хаотично пърхане
      e.wobble += dt * 6;
      const wob = Math.sin(e.wobble) * 0.8;
      const a = Math.atan2(mvy, mvx) + wob * 0.5;
      mvx = Math.cos(a); mvy = Math.sin(a);
    }
    if (mvx || mvy) {
      collideMove(e, mvx * speed * dt, mvy * speed * dt, e.t.ghost);
      const sx = mvx - mvy;
      if (Math.abs(sx) > 0.1) e.flip = sx < 0;
      e.state = 'chase';
    }
  }

  // меко разбутване между врагове
  for (let i = 0; i < G.enemies.length; i++) {
    const a = G.enemies[i];
    if (a.dead) continue;
    for (let j = i + 1; j < G.enemies.length; j++) {
      const b = G.enemies[j];
      if (b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d2 = dx * dx + dy * dy, rr = a.r + b.r;
      if (d2 > 0.0001 && d2 < rr * rr) {
        const d = Math.sqrt(d2), push = (rr - d) * 0.5;
        const nx = dx / d, ny = dy / d;
        collideMove(a, -nx * push, -ny * push, a.t.ghost);
        collideMove(b, nx * push, ny * push, b.t.ghost);
      }
    }
  }
  // изчистване
  for (let i = G.enemies.length - 1; i >= 0; i--) if (G.enemies[i].dead) G.enemies.splice(i, 1);
}

// ---------- босова стая: запечатва се при влизане, отваря се с победата ----------
function checkBossRoom() {
  const p = G.player, br = G.bossRoom;
  if (!br || G.bossRoomLocked) return;
  const boss = G.enemies.find(e => e.bossDef && !e.dead);
  if (!boss) return;
  // трябва да си навътре в стаята, не на прага
  if (p.x > br.x + 0.9 && p.x < br.x + br.w - 0.9 && p.y > br.y + 0.9 && p.y < br.y + br.h - 0.9) {
    lockBossRoom(boss);
  }
}
function lockBossRoom(boss) {
  const br = G.bossRoom, m = G.map;
  G.bossRoomLocked = true;
  G.bossGates = [];
  // зазиждаме всеки подов вход по ръба около стаята
  for (let i = br.x - 1; i <= br.x + br.w; i++) {
    for (const j of [br.y - 1, br.y + br.h]) {
      const idx = j * m.w + i;
      if (m.cells[idx] === FLOOR) { m.cells[idx] = WALL; G.bossGates.push(idx); }
    }
  }
  for (let j = br.y; j < br.y + br.h; j++) {
    for (const i of [br.x - 1, br.x + br.w]) {
      const idx = j * m.w + i;
      if (m.cells[idx] === FLOOR) { m.cells[idx] = WALL; G.bossGates.push(idx); }
    }
  }
  boss.dormant = false;
  boss.aggro = true;
  boss.roared = true;
  G.bossName = boss.bossDef.name;
  toast(boss.bossDef.name + ' — the room is sealed!', '#ff6b7a');
  Sfx.play('roar');
  Sfx.play('boom');
  G.shake = 9;
  computeFOV();
  G.miniDirty = true;
}
function unlockBossRoom() {
  if (!G.bossGates || !G.bossGates.length) return;
  for (const idx of G.bossGates) G.map.cells[idx] = FLOOR;
  G.bossGates = [];
  G.bossRoomLocked = false;
  G.bossRoom = null;
  computeFOV();
  G.miniDirty = true;
  toast('The room\'s seal has broken.', '#7fd0a0');
}

// ---------- АРЕНА: доброволна стая, запечатва се при влизане, 3 вълни, после награда ----------
function arenaKind() {
  const pool = ['slime', 'skeleton', 'bat'];
  if (G.depth >= 3) pool.push('archer');
  if (G.depth >= 5) pool.push('shaman');
  if (G.depth >= 6) pool.push('brute');
  if (G.depth >= 8) pool.push('wraith');
  return pick(pool);
}
function spawnArenaWave(n) {
  const r = G.arena.room;
  const cfg = [{ n: 4, e: 0 }, { n: 5, e: 1 }, { n: 6, e: 2 }][n - 1];
  const specs = [];
  for (let k = 0; k < cfg.n; k++) {
    const pos = freeFloorNear(r.x + 1 + Math.random() * (r.w - 2), r.y + 1 + Math.random() * (r.h - 2));
    specs.push({ kind: arenaKind(), x: pos.x, y: pos.y, elite: k < cfg.e, arena: true });
  }
  spawnEnemies(specs);
}
function startArena() {
  const a = G.arena, r = a.room, m = G.map;
  a.state = 'wave'; a.wave = 1; a.gates = [];
  for (let i = r.x - 1; i <= r.x + r.w; i++) for (const j of [r.y - 1, r.y + r.h]) { const idx = j * m.w + i; if (m.cells[idx] === FLOOR) { m.cells[idx] = WALL; a.gates.push(idx); } }
  for (let j = r.y; j < r.y + r.h; j++) for (const i of [r.x - 1, r.x + r.w]) { const idx = j * m.w + i; if (m.cells[idx] === FLOOR) { m.cells[idx] = WALL; a.gates.push(idx); } }
  spawnArenaWave(1);
  toast('Arena — Wave 1 / 3!', '#ff8a1f');
  Sfx.play('roar'); Sfx.play('boom'); G.shake = 8;
  computeFOV(); G.miniDirty = true;
}
function finishArena() {
  const a = G.arena, r = a.room;
  for (const idx of a.gates) G.map.cells[idx] = FLOOR;
  a.gates = [];
  const ai = G.props.findIndex(pr => pr.kind === 'arena'); if (ai >= 0) G.props.splice(ai, 1);
  const pos = freeFloorNear(r.x + (r.w >> 1) + 0.5, r.y + (r.h >> 1) + 0.5);
  G.props.push({ kind: 'chest', x: pos.x, y: pos.y, r: 0.4, solid: true, opened: false, arenaReward: true });
  toast('Arena cleared! Claim your reward.', '#7fd0a0');
  Sfx.play('level'); G.shake = 6;
  G.arena = null;
  computeFOV(); G.miniDirty = true;
}
function updateArena(dt) {
  const a = G.arena; if (!a) return;
  const p = G.player, r = a.room;
  if (a.state === 'idle') {
    if (p.x > r.x + 0.7 && p.x < r.x + r.w - 0.7 && p.y > r.y + 0.7 && p.y < r.y + r.h - 0.7) startArena();
    return;
  }
  if (a.state === 'wave') {
    if (!G.enemies.some(e => !e.dead && e.arena)) { // само враговете на арената броят
      if (a.wave >= 3) finishArena();
      else { a.state = 'pause'; a.timer = 2; }
    }
  } else if (a.state === 'pause') {
    a.timer -= dt;
    if (a.timer <= 0) { a.wave++; spawnArenaWave(a.wave); a.state = 'wave'; toast('Wave ' + a.wave + ' / 3!', '#ff8a1f'); Sfx.play('roar'); }
  }
}

// ---------- босове: фази по % живот + сигнатурни механики ----------
function updateBoss(e, dt, d) {
  const p = G.player;
  // фази: 100-66 / 66-33 / под 33
  const frac = e.hp / e.maxhp;
  const ph = frac > 0.66 ? 1 : frac > 0.33 ? 2 : 3;
  if (ph > e.phase) {
    e.phase = ph;
    G.shake = 9;
    Sfx.play('roar');
    burst(e.x, e.y, ['#c22836', '#c84fff', '#ffd23b'], 30, 5, 0.8);
    toast(e.bossDef.name + ' — phase ' + ph + '!', '#ff6b7a');
    e.sigT = Math.min(e.sigT, 1.5); // фазата веднага показва зъби
  }
  e.sigT -= dt;
  if (e.sigT > 0) return;
  const sig = e.bossDef.sig;
  if (sig === 'adds') {
    // Костен крал: вика костеливи слуги
    const alive = G.enemies.filter(a => a.summoned && !a.dead && a.kind === 'skeleton').length;
    const want = Math.min(1 + e.phase, 5 - alive);
    for (let i = 0; i < want; i++) summonEnemy('skeleton', e.x + rnd(-2, 2), e.y + rnd(-2, 2));
    if (want > 0) { toast('Rise and serve!', '#a39d8a'); Sfx.play('tp'); }
    e.sigT = 15 - e.phase * 2;
  } else if (sig === 'zones') {
    // Кървав голем: кипяща кръв по пода
    for (let i = 0; i < 1 + e.phase; i++) {
      addHazard({ type: 'blood', x: p.x + rnd(-2.5, 2.5), y: p.y + rnd(-2.5, 2.5), t: 0, delay: 0.85, life: 5.5, r: 1.05, dmg: e.dmg * 0.6 });
    }
    Sfx.play('fire');
    e.sigT = 9.5 - e.phase;
  } else if (sig === 'totems') {
    // Архилич: тотеми, които стрелят
    const alive = G.enemies.filter(a => a.kind === 'totem' && !a.dead).length;
    for (let i = alive; i < 2; i++) summonEnemy('totem', e.x + rnd(-3, 3), e.y + rnd(-3, 3));
    if (alive < 2) toast('The totems drink the light!', '#c84fff');
    e.sigT = 17 - e.phase * 2;
  } else if (sig === 'charge') {
    // Владетелят: телеграфиран щурм (във фаза 3 — двоен)
    e.chargesLeft = e.phase >= 3 ? 2 : 1;
    e.chargeState = { phase: 'tele', t: 0, dir: Math.atan2(p.y - e.y, p.x - e.x) };
    e.sigT = 8.5 - e.phase;
  }
}
function updateCharge(e, dt) {
  const p = G.player;
  const cs = e.chargeState;
  cs.t += dt;
  if (cs.phase === 'tele') {
    cs.dir = Math.atan2(p.y - e.y, p.x - e.x); // следи до последно
    if (cs.t > 0.85) { cs.phase = 'dash'; cs.t = 0; Sfx.play('dash'); }
    return;
  }
  const spd = 13;
  const ox = e.x, oy = e.y;
  collideMove(e, Math.cos(cs.dir) * spd * dt, Math.sin(cs.dir) * spd * dt);
  if (e.phase >= 2 && chance(0.55)) addHazard({ type: 'fire', x: e.x, y: e.y, t: 0, life: 2, r: 0.5, dmg: e.dmg * 0.4 });
  if (p.iframes <= 0 && dist(e.x, e.y, p.x, p.y) < e.r + p.r + 0.25) damagePlayer(e.dmg * 1.4, e.x, e.y);
  const stuck = Math.abs(e.x - ox) < 0.002 && Math.abs(e.y - oy) < 0.002;
  if (cs.t > 0.75 || stuck) {
    G.shake = 8;
    Sfx.play('boom');
    burst(e.x, e.y, ['#5c78e8', '#8ab0ff', '#454e63'], 16, 4.5, 0.5);
    if (e.chargesLeft > 1) { e.chargesLeft--; e.chargeState = { phase: 'tele', t: 0.4, dir: Math.atan2(p.y - e.y, p.x - e.x) }; }
    else e.chargeState = null;
  }
}

// ---------- зони по пода (огън, кръв, отрова, закъснели взривове) ----------
function addHazard(h) {
  G.hazards = G.hazards || [];
  G.hazards.push(h);
  // при препълване маркирай най-стария мъртъв (updateHazards го филтрира) — да не shift-ваме масива по време на цикъл
  if (G.hazards.length > 120) G.hazards[0].dead = true;
}
function updateHazards(dt) {
  if (!G.hazards) return;
  const p = G.player;
  // маркираме мъртви и филтрираме НАКРАЯ — безопасно е, защото damagePlayer/damageEnemy тук
  // могат да извикат addHazard (plague/volatile/wardShatter) и да разместят масива по време на цикъла
  let anyDead = false;
  for (let i = G.hazards.length - 1; i >= 0; i--) {
    const h = G.hazards[i];
    if (h.dead) { anyDead = true; continue; }
    h.t += dt;
    if (h.delay && h.t < h.delay) continue; // телеграф — още не пари
    if (h.type === 'blast') {
      // еднократен взрив (избухващ елит) — маркираме мъртъв ПРЕДИ щетите (те може да добавят хазарди)
      h.dead = true; anyDead = true;
      if (dist(p.x, p.y, h.x, h.y) < h.r + p.r) damagePlayer(h.dmg, h.x, h.y);
      burst(h.x, h.y, ['#ff8a1f', '#ffd23b', '#c22836'], 22, 5, 0.5);
      G.shake = Math.min(8, G.shake + 3);
      Sfx.play('boom');
      continue;
    }
    if (h.type === 'novawave') {
      // Frost Nova „Double Wave": еднократна втора вълна с двойна щета
      h.dead = true; anyDead = true;
      G.novaFx = G.novaFx || [];
      G.novaFx.push({ x: h.x, y: h.y, t: 0, col: '#8ab0ff', maxR: h.r });
      for (const e of G.enemies) {
        if (e.dead || dist(e.x, e.y, h.x, h.y) > h.r + e.r) continue;
        e.slowT = Math.max(e.slowT, 2);
        damageEnemy(e, h.dmg, false, Math.atan2(e.y - h.y, e.x - h.x), 0.2);
      }
      G.shake = Math.min(7, G.shake + 2);
      Sfx.play('boom');
      continue;
    }
    if (h.t - (h.delay || 0) > h.life) { h.dead = true; anyDead = true; continue; }
    if (h.grow && h.r < 3) h.r += dt * 0.5; // Poison „Spread": облакът се разраства
    h.tick = (h.tick || 0) - dt;
    if (h.tick <= 0) {
      h.tick = 0.5;
      if (h.type === 'poison') {
        // нашата отрова — разяжда враговете
        for (const e of G.enemies) {
          if (e.dead) continue;
          if (dist(e.x, e.y, h.x, h.y) < h.r + e.r) { e.poisonT = 1.1; e.poisonDps = h.dps; if (h.plague) e.plagued = true; }
        }
      } else if (h.type === 'pyre') {
        // Fireball „Scorched Earth": горяща земя — пали враговете
        for (const e of G.enemies) {
          if (e.dead) continue;
          if (dist(e.x, e.y, h.x, h.y) < h.r + e.r) { e.burnT = 0.7; e.burnDps = h.dps; }
        }
      } else if (h.type === 'icefield' || h.type === 'fissure') {
        // Ледено поле / Пукнатини: забавят враговете вътре
        for (const e of G.enemies) {
          if (e.dead) continue;
          if (dist(e.x, e.y, h.x, h.y) < h.r + e.r) e.slowT = Math.max(e.slowT, 0.8);
        }
      } else if (dist(p.x, p.y, h.x, h.y) < h.r + p.r) {
        damagePlayer(h.dmg || 8, h.x, h.y); // огън/кръв на враговете пари играча (firetrail/blood)
      }
    }
  }
  if (anyDead) G.hazards = G.hazards.filter(h => !h.dead);
}

function enemyStrike(e, dNow) {
  const p = G.player;
  e.atkCd = e.t.atkCd * (e.swift ? 0.7 : 1) * (e.bossDef ? 1 - 0.1 * (e.phase - 1) : 1);
  e.state = 'chase';
  const d = dist(e.x, e.y, p.x, p.y);
  if (e.t.ranged) {
    if (!losClear(e.x, e.y, p.x, p.y)) return;
    const a = Math.atan2(p.y - e.y, p.x - e.x);
    const spd = e.t.ranged === 'arrow' ? 9 : 7;
    const n = e.t.spread || (e.kind === 'shaman' ? 3 : 1);
    const shots = [];
    for (let i = 0; i < n; i++) shots.push((i - (n - 1) / 2) * 0.22);
    for (const off of shots) {
      G.projectiles.push({
        kind: e.t.ranged, from: 'enemy',
        x: e.x + Math.cos(a) * 0.4, y: e.y + Math.sin(a) * 0.4,
        vx: Math.cos(a + off) * spd, vy: Math.sin(a + off) * spd,
        dmg: e.dmg, r: 0.2, t: 0,
      });
    }
    Sfx.play(e.t.ranged === 'arrow' ? 'swing' : 'fire');
  } else if (e.t.aoe) {
    // тежък размах около себе си
    burst(e.x, e.y, ['#ff8a1f', '#ffd23b', '#8a93a3'], 18, 4.5, 0.5);
    G.shake = Math.min(9, G.shake + 4);
    Sfx.play('boom');
    if (d < e.t.aoe + e.t.range * 0.6 + p.r && losClear(e.x, e.y, p.x, p.y)) {
      damagePlayer(e.dmg, e.x, e.y);
      if (hasPower('golemskin')) damageEnemy(e, e.dmg * 0.3, false); // тръни
      if (p.st.thorns > 0 && !e.dead) damageEnemy(e, p.st.thorns, false); // афикс „отвърнати щети"
    }
  } else {
    if (d < e.t.range + p.r + 0.25 && losClear(e.x, e.y, p.x, p.y)) {
      damagePlayer(e.dmg, e.x, e.y);
      if (hasPower('golemskin')) damageEnemy(e, e.dmg * 0.3, false);
      if (p.st.thorns > 0 && !e.dead) damageEnemy(e, p.st.thorns, false); // афикс „отвърнати щети"
    }
  }
}

// ---------- снаряди ----------
function updateProjectiles(dt) {
  const p = G.player;
  for (let i = G.projectiles.length - 1; i >= 0; i--) {
    const pr = G.projectiles[i];
    pr.t += dt;
    pr.x += pr.vx * dt;
    pr.y += pr.vy * dt;
    let kill = false;
    if (pr.t > 3) kill = true;
    if (cellAt(Math.floor(pr.x), Math.floor(pr.y)) !== FLOOR) {
      kill = true;
      if (pr.kind === 'fireball') {
        // връщаме кълбото на последната свободна позиция, за да има splash покрай стената
        const bx = pr.x - pr.vx * dt, by = pr.y - pr.vy * dt;
        if (cellAt(Math.floor(bx), Math.floor(by)) === FLOOR) { pr.x = bx; pr.y = by; }
        explodeFireball(pr);
      }
      else burst(pr.x, pr.y, ['#8a93a3', '#5a6272'], 5, 2.5, 0.3);
    } else if (pr.from === 'player') {
      for (const e of G.enemies) {
        if (e.dead) continue;
        if (dist(pr.x, pr.y, e.x, e.y) < e.t.r + pr.r) {
          if (pr.kind === 'fireball') { explodeFireball(pr); kill = true; }
          else if (pr.kind === 'icebolt') {
            // пронизва и забавя, продължава до 2 допълнителни цели
            pr.hitSet = pr.hitSet || new Set();
            if (!pr.hitSet.has(e)) {
              pr.hitSet.add(e);
              if ((pr.lv || 1) >= 3 && !e.t.boss) { e.stunT = Math.max(e.stunT || 0, 1.5); freezeFx(e); } // Вкочаняване
              else e.slowT = Math.max(e.slowT, 1.5);
              damageEnemy(e, pr.dmg * rnd(0.9, 1.1), chance(G.player.st.crit / 200), Math.atan2(e.y - pr.y, e.x - pr.x), 0.1);
              pr.pierce--;
              if (pr.pierce < 0) { kill = true; break; } // изчерпан пробив -> спри този кадър (иначе удря всички)
            }
            continue;
          }
          else kill = true;
          break;
        }
      }
      // чупливи предмети
      if (!kill) for (const prop of G.props) {
        if (prop.hp === undefined || prop.broken) continue;
        if (dist(pr.x, pr.y, prop.x, prop.y) < 0.45) {
          if (pr.kind === 'fireball') explodeFireball(pr);
          else breakProp(prop);
          kill = true;
          break;
        }
      }
    } else {
      if (p.iframes <= 0 && dist(pr.x, pr.y, p.x, p.y) < p.r + pr.r + 0.1) {
        damagePlayer(pr.dmg, pr.x - pr.vx * 0.1, pr.y - pr.vy * 0.1);
        kill = true;
      }
    }
    if (pr.kind === 'fireball' && chance(0.6)) {
      addParticle({ x: pr.x, y: pr.y, z: 6, vx: rnd(-1, 1), vy: rnd(-1, 1), vz: rnd(2, 8), grav: 10, t: 0, life: 0.3, col: pick(['#ff8a1f', '#ffd23b']), size: 1 });
    }
    if (kill) G.projectiles.splice(i, 1);
  }
}
function explodeFireball(pr) {
  const p = G.player;
  G.explosions = G.explosions || [];
  G.explosions.push({ x: pr.x, y: pr.y, t: 0 });
  burst(pr.x, pr.y, ['#ff8a1f', '#ffd23b', '#ff5a1f'], 20, 5, 0.5);
  G.shake = Math.min(7, G.shake + 3);
  Sfx.play('boom');
  for (const e of G.enemies) {
    if (e.dead) continue;
    if (dist(pr.x, pr.y, e.x, e.y) < 1.25 + e.t.r && losClear(pr.x, pr.y, e.x, e.y)) {
      const isCrit = chance(p.st.crit / 200);
      damageEnemy(e, pr.dmg * rnd(0.9, 1.1) * (isCrit ? p.st.critd : 1), isCrit, Math.atan2(e.y - pr.y, e.x - pr.x), 0.3);
    }
  }
  for (const prop of G.props) {
    if (prop.hp === undefined || prop.broken) continue;
    if (dist(pr.x, pr.y, prop.x, prop.y) < 1.3) breakProp(prop);
  }
  const lv = pr.lv || 1;
  if (lv >= 2) addHazard({ type: 'pyre', x: pr.x, y: pr.y, t: 0, life: 4, r: 1.2, dps: pr.dmg * 0.35 }); // Пепелище: горяща земя
  if (lv >= 3 && !pr.split) { // Разцепване: 3 по-малки кълба встрани (ниво 1 -> без по-нататъшно цепене/палене)
    const base = Math.atan2(pr.vy, pr.vx);
    for (const off of [-1.15, 0, 1.15]) {
      const a = base + off;
      G.projectiles.push({
        kind: 'fireball', from: 'player', lv: 1, split: true,
        x: pr.x + Math.cos(a) * 0.3, y: pr.y + Math.sin(a) * 0.3,
        vx: Math.cos(a) * 9, vy: Math.sin(a) * 9,
        dmg: pr.dmg * 0.5, r: 0.2, t: 0,
      });
    }
  }
}

// ---------- частици и текст ----------
function updateParticles(dt) {
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const pa = G.particles[i];
    pa.t += dt;
    if (pa.t >= pa.life) { G.particles.splice(i, 1); continue; }
    pa.x += pa.vx * dt * 0.15;
    pa.y += pa.vy * dt * 0.15;
    pa.vz -= pa.grav * dt;
    pa.z += pa.vz * dt;
    if (pa.z < 0) { pa.z = 0; pa.vz = 0; }
  }
  for (let i = G.texts.length - 1; i >= 0; i--) {
    const t = G.texts[i];
    t.t += dt;
    t.z += 26 * dt;
    if (t.t >= t.life) G.texts.splice(i, 1);
  }
  if (G.explosions) {
    for (let i = G.explosions.length - 1; i >= 0; i--) {
      G.explosions[i].t += dt;
      if (G.explosions[i].t > 0.28) G.explosions.splice(i, 1);
    }
  }
  if (G.slashFx) {
    G.slashFx.t += dt;
    if (G.slashFx.t > 0.18) G.slashFx = null;
  }
  // атмосферни искри: огън (топли) и печатът на Мистика (пурпурни)
  for (const pr of G.props) {
    const fire = (pr.kind === 'brazier' || pr.kind === 'campfire') && !pr.broken;
    const mystic = pr.kind === 'stall' && pr.vtype === 'jewel';
    if (!fire && !mystic) continue;
    if (tileVisible(Math.floor(pr.x), Math.floor(pr.y)) && chance(fire ? 0.04 : 0.025)) {
      addParticle({
        x: pr.x + rnd(-0.15, 0.15), y: pr.y + rnd(-0.15, 0.15), z: 16,
        vx: rnd(-0.6, 0.6), vy: rnd(-0.6, 0.6), vz: rnd(8, 16), grav: -6,
        t: 0, life: rnd(0.5, 1.1),
        col: pick(fire ? ['#ff8a1f', '#ffd23b', '#ff5a1f'] : ['#c84fff', '#f0b0ff', '#6a4f9e']),
        size: 1,
      });
    }
  }
}

function startTransition(target) {

function startGame(slot, freshName) {
  G.charSlot = slot;
  G.keys = Object.create(null); // чисто начало за входа
  G.mouse.down = G.mouse.rdown = false;
  G.joy = null; G.atkHold = null; G.fireHold = null;
  G.runSeed = (Math.random() * 0xffffffff) >>> 0;
  G.player = newPlayer();
  G.kills = 0;
  G.maxDepth = 1;
  G.startTime = performance.now();
  G.levelupQueue = 0;
  G.levelupChoices = null;
  G.checkpoint = 1;
  G.mirCheckpoint = 1;
  G.mirholdCleared = false;
  G.city = 'camp';
  G.dungeonId = 'abyss';
  G.heroBank = null;
  if (freshName !== undefined) {
    // чисто нов герой
    G.charName = freshName || 'Exile';
    G.meta = defaultMeta();
    saveProfile();
  }
  const prof = freshName === undefined ? loadProfile() : null;
  if (prof) {
    const p = G.player;
    G.charName = prof.name || 'Exile';
    p.gold = prof.gold || 0;
    p.silverBag = Array.isArray(prof.silverBag) ? prof.silverBag : [];
    p.blessing = prof.blessing || 0;
    // МИГРАЦИЯ към сребърната ера (X век): старото злато се обменя в сребро, но НАПОЛОВИНА
    if (!prof.silverEra) { p.gold = Math.ceil(p.gold / 2); }
    // отвари: нови постоянни флакони; стар запис с брой { hp:N, mp:M } -> само отключване
    p.potionsOwned = prof.potionsOwned || { hp: true, mp: true };
    p.potionSlots = (Array.isArray(prof.potionSlots) && prof.potionSlots.length === 2) ? prof.potionSlots : ['hp', 'mp'];
    p.potionUp = prof.potionUp || {};
    p.potionCd = [0, 0]; p.buffs = {};
    // старите натрупани отвари -> малко злато, за да не се усети като загуба
    if (prof.potions && !prof.potionsOwned) p.gold += ((prof.potions.hp || 0) + (prof.potions.mp || 0)) * 15;
    if (prof.equip) p.equip = prof.equip;
    p.inv = prof.inv || [];
    G.meta = mergeMeta(prof.meta);
    G.checkpoint = prof.checkpoint || 1;
    G.mirCheckpoint = prof.mirCheckpoint || 1;
    G.mirholdCleared = !!prof.mirholdCleared;
    G.city = prof.city || 'camp';
    p.spellsKnown = prof.spellsKnown || { fireball: true };
    p.activeSpells = prof.activeSpells || ['fireball', null, null];
    p.activePassives = Array.isArray(prof.activePassives) ? prof.activePassives.slice(0, 2) : [null, null];
    while (p.activePassives.length < 2) p.activePassives.push(null);
    // МИГРАЦИЯ: щитът/черепът вече са пасивни — ако са в активен слот, местим ги в пасивен
    for (let i = 0; i < 3; i++) {
      const sid = p.activeSpells[i];
      if (sid && SPELLS[sid] && SPELLS[sid].passive) {
        p.activeSpells[i] = null;
        for (let j = 0; j < 2; j++) if (!p.activePassives[j]) { p.activePassives[j] = sid; break; }
      }
    }
    // нива на магиите: стар запис без spellLvl -> всички известни магии на ниво 1
    p.spellLvl = (prof.spellLvl && typeof prof.spellLvl === 'object' && !Array.isArray(prof.spellLvl)) ? prof.spellLvl : {};
    for (const _sid in p.spellsKnown) if (p.spellsKnown[_sid]) p.spellLvl[_sid] = p.spellLvl[_sid] || 1;
    // уменията са постоянни (стари записи ги пазеха в hero)
    p.skills = prof.skills || (prof.hero && prof.hero.skills) || {};
    p.skillPoints = prof.skillPoints !== undefined ? prof.skillPoints : ((prof.hero && prof.hero.skillPoints) || 0);
    // стар запис: томове в екипировката -> в Книгата
    for (const sl of ['spell1', 'spell2', 'spell3']) {
      if (p.equip[sl]) {
        if (p.equip[sl].spell) p.spellsKnown[p.equip[sl].spell] = true;
        delete p.equip[sl];
      }
    }
    if (!p.activeSpells[0]) p.activeSpells[0] = 'fireball';
    // банкиран герой (прибран през портала) — нивото и дарбите оцеляват
    if (prof.hero) {
      p.lvl = prof.hero.lvl || 1;
      p.xp = prof.hero.xp || 0;
      p.xpNext = prof.hero.xpNext || 30;
      p.perks = prof.hero.perks || {};
      G.heroBank = prof.hero;
    }
    // предпазваме се от сблъсък на id-та след зареждане
    let mx = 100;
    for (const it of [].concat(p.inv, Object.values(p.equip))) if (it && it.id >= mx) mx = it.id + 1;
    Items._id = mx;
    calcStats(p);
    p.hp = p.st.maxhp; p.mp = p.st.maxmp;
    p.dashCharges = p.st.dashMax;
  }
  startSurface();
  G.state = 'play';
  document.body.classList.remove('menu');
}
// прибиране у дома през портала: нивото и дарбите се БАНКИРАТ (без загуба)
function goHomeViaPortal() {
  const p = G.player;
  G.heroBank = { lvl: p.lvl, xp: p.xp, xpNext: p.xpNext, perks: p.perks };
  G.meta.bestDepth = Math.max(G.meta.bestDepth, G.maxDepth);
  if (G.dungeonId === 'mirhold') {
    // Гарнизонната тъмница: порталите на ет. 5 и ет. 10 прибират в МИРХОЛД
    if (G.depth >= 10) {
      G.mirholdCleared = true;
      G.mirCheckpoint = 1;
      toast('The Garrison Depths are CLEARED! Mirhold breathes easier.', '#ffd23b');
    } else {

    }
  } else {

// ---------- до 3 герои, всеки със собствено име и запис ----------
function charKey(slot) { return 'sm_char_' + slot; }
const SAVE_VERSION = 1;
function saveProfile() {

      spellsKnown: p.spellsKnown, activeSpells: p.activeSpells, activePassives: p.activePassives || [null, null], spellLvl: p.spellLvl || {}, // нивата на магиите са ЗАВИНАГИ
      skills: p.skills || {}, skillPoints: p.skillPoints || 0, // дървото е ЗАВИНАГИ

    });

  } catch (e) {}

// счупен/липсващ affixes да не срива calcStats
function normItem(it) {
  if (!it || typeof it !== 'object') return;
  if (!Array.isArray(it.affixes)) it.affixes = [];
  // обхватът вече идва САМО от оръжието — старите 'range' афикси отпадат от записите
  for (let i = it.affixes.length - 1; i >= 0; i--) if (it.affixes[i] && it.affixes[i].k === 'range') it.affixes.splice(i, 1);
}
// миграция на запис на герой към текущата версия; при невъзможност -> null
function migrateChar(c) {
  if (!c || typeof c !== 'object' || Array.isArray(c)) return null;
  try {
    const v = c.v || 0; // липсва v -> версия 0
    switch (v) {
      case 0: {
        // версия 0: дозапълваме липсващите полета с безопасни стойности и валидираме типове
        if (typeof c.name !== 'string') c.name = 'Exile';
        if (typeof c.gold !== 'number') c.gold = Number(c.gold) || 0;
        if (c.potions == null || typeof c.potions !== 'object') c.potions = { hp: 2, mp: 1 };
        // екипировката е обект със слотове (не масив); нормализираме предметите
        if (c.equip == null || typeof c.equip !== 'object' || Array.isArray(c.equip)) c.equip = {};
        for (const k in c.equip) normItem(c.equip[k]);
        // инвентарът е масив от предмети; махаме счупените записи
        if (!Array.isArray(c.inv)) c.inv = [];
        for (let i = c.inv.length - 1; i >= 0; i--) {
          if (!c.inv[i] || typeof c.inv[i] !== 'object') c.inv.splice(i, 1);
          else normItem(c.inv[i]);
        }
        // spellsKnown е ОБЕКТ, activeSpells е МАСИВ
        if (c.spellsKnown == null || typeof c.spellsKnown !== 'object' || Array.isArray(c.spellsKnown)) c.spellsKnown = { fireball: true };
        if (!Array.isArray(c.activeSpells)) c.activeSpells = ['fireball', null, null];
        if (!Array.isArray(c.activePassives)) c.activePassives = [null, null];
        if (typeof c.checkpoint !== 'number') c.checkpoint = Number(c.checkpoint) || 1;
        // skills/skillPoints/hero/meta имат собствена fallback логика при зареждане — не ги пипаме
        c.v = 1;
      }
      // case 1: тук ще влиза бъдеща миграция (1 -> 2) — case 0 пропада надолу и се верижи
      default:
        break;
    }
    return c;
  } catch (e) { return null; }
}
// четене на запис за слот: първо основния, при липса/повреда — РЕЗЕРВНОТО копие (и го възстановява)
function readCharSlot(slot) {
  try {
    const main = migrateChar(JSON.parse(localStorage.getItem(charKey(slot)) || 'null'));
    if (main) return main;
  } catch (e) {}
  try {
    const bak = migrateChar(JSON.parse(localStorage.getItem(charKey(slot) + '_bak') || 'null'));
    if (bak) {
      try { localStorage.setItem(charKey(slot), JSON.stringify(bak)); } catch (e2) {}
      return bak;
    }
  } catch (e) {}
  return null;
}
function loadCharList() {
  const out = [];
  for (let i = 0; i < 3; i++) {
    const c = readCharSlot(i);
    out.push(c ? { slot: i, name: c.name || 'Exile', gold: c.gold || 0, depth: (c.meta && c.meta.bestDepth) || 1, deaths: (c.meta && c.meta.deaths) || 0 } : null);
  }
  return out;
}
function loadProfile() {
  return readCharSlot(G.charSlot || 0);
}
function wipeProfile() {
  try { localStorage.removeItem(charKey(G.charSlot || 0)); localStorage.removeItem(charKey(G.charSlot || 0) + '_bak'); } catch (e) {}
}
function deleteChar(slot) {

}
// старият единичен запис става герой №1
function migrateOldProfile() {
  try {
    const old = localStorage.getItem('bezdna_profile');
    if (old && !localStorage.getItem(charKey(0))) {
      const c = JSON.parse(old);
      c.name = 'Exile';
      localStorage.setItem(charKey(0), JSON.stringify(c));
      localStorage.removeItem('bezdna_profile');

function fontPx(n) { return (n * SCALE) + 'px "Segoe UI", Verdana, sans-serif'; }
function fontBold(n) { return 'bold ' + (n * SCALE) + 'px "Segoe UI", Verdana, sans-serif'; }

function panel(x, y, w, h) {
  rcx(x, y, w, h, 'rgba(10,13,20,0.92)');

}
function rcx(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, w | 0, h | 0); }
function strokeRect(x, y, w, h, c, lw) {

}

// ---------- орб (Diablo-стил, пикселна течност) ----------
function drawOrb(cx0, cy0, radArt, frac, kind) {
  const g = mk(radArt * 2 + 2, radArt * 2 + 2);
  const R = radArt, c = R + 1;
  const lvl = (1 - clamp(frac, 0, 1)) * 2 * R;
  const cols = kind === 'hp'
    ? ['#8f1620', '#c22836', '#ff4757', '#ff8a94']
    : ['#173a7a', '#2456a8', '#3b82f6', '#7fb0ff'];
  for (let y = 0; y < 2 * R + 2; y++) for (let x = 0; x < 2 * R + 2; x++) {
    const d = Math.hypot(x - c, y - c);
    if (d > R) continue;
    if (d > R - 1.5) { px(g, x, y, '#454f63'); continue; }         // рамка
    const yy = y - (c - R);
    if (yy > lvl) {
      // течност: вълна отгоре, по-тъмна надолу
      const wave = Math.sin(x * 0.9 + G.time * 4) > 0 ? 1 : 0;
      if (yy < lvl + 1.5 + wave) px(g, x, y, cols[3]);
      else if (yy > 2 * R - 4) px(g, x, y, cols[0]);
      else px(g, x, y, yy > R ? cols[1] : cols[2]);
    } else {
      px(g, x, y, '#10141f');
    }
  }
  // стъклен отблясък
  for (let i = 0; i < 5; i++) px(g, c - R / 2 - i % 2, c - R / 2 - ((i / 2) | 0), 'rgba(255,255,255,0.5)');
  blit(ctx, g.canvas, cx0 - (R + 1) * SCALE, cy0 - (R + 1) * SCALE);
}

  ctx.fillStyle = col; ctx.fillRect(cx - 4 * S, cy - 4 * S, 8 * S, 8 * S);         // тяло

function closePotionSelect() { G.state = 'play'; document.body.classList.remove('menu'); saveProfile(); }
function drawHUD() {
  const p = G.player;
  const S = SCALE;
  UI.hotRects = [];

  // ЦЕНТРАЛНА КОЛБА: живот (ляво) | мана (дясно), XP пръстен-рамка, НИВОТО ОТГОРЕ
  const cx0 = CW / 2, cy0 = CH - 52 * S, orbCr = 28 * S;
  // двоен ръб: тъмен външен + фон на XP пръстена
  ctx.lineWidth = 5 * S;
  ctx.strokeStyle = '#0a0d14';
  ctx.beginPath(); ctx.arc(cx0, cy0, orbCr + 4 * S, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 3 * S;
  ctx.strokeStyle = '#171c28';
  ctx.beginPath(); ctx.arc(cx0, cy0, orbCr + 4 * S, 0, Math.PI * 2); ctx.stroke();
  // половини: течност с дълбочина и ВЪЛНИСТА повърхност
  const orbHalf = (side, frac, body, deep, topCol) => {
    ctx.save();
    ctx.beginPath();
    if (side === 'l') ctx.arc(cx0, cy0, orbCr, Math.PI / 2, Math.PI * 1.5);
    else ctx.arc(cx0, cy0, orbCr, -Math.PI / 2, Math.PI / 2);
    ctx.closePath(); ctx.clip();
    ctx.fillStyle = '#0d1119';
    ctx.fillRect(cx0 - orbCr, cy0 - orbCr, orbCr * 2, orbCr * 2);
    const lvlY = cy0 + orbCr - 2 * orbCr * clamp(frac, 0, 1);
    ctx.fillStyle = body;
    ctx.fillRect(cx0 - orbCr, lvlY, orbCr * 2, 2 * orbCr);
    ctx.fillStyle = deep; // по-тъмно към дъното
    ctx.fillRect(cx0 - orbCr, Math.max(lvlY, cy0 + orbCr * 0.55), orbCr * 2, orbCr * 0.45);
    ctx.fillStyle = topCol; // вълниста повърхност (пиксел стил)
    for (let wx = -orbCr; wx < orbCr; wx += 3 * S) {
      const wy = Math.sin(wx * 0.09 / S + G.time * 2.2 + (side === 'l' ? 0 : 2)) * 1.5 * S;
      ctx.fillRect(cx0 + wx, lvlY + wy, 3 * S, 2 * S);
    }
    ctx.restore();
  };
  orbHalf('l', p.hp / p.st.maxhp, '#a81f2d', '#7c1622', '#ff5b6e');
  orbHalf('r', p.mp / p.st.maxmp, '#1f4d99', '#173a7a', '#6aa8ff');
  // стъклен отблясък горе-вляво
  ctx.save();
  ctx.beginPath(); ctx.arc(cx0, cy0, orbCr, 0, Math.PI * 2); ctx.clip();
  ctx.globalAlpha = 0.10;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(cx0 - orbCr * 0.28, cy0 - orbCr * 0.34, orbCr * 0.55, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
  // контур + разделител по средата
  ctx.lineWidth = Math.max(2, S);
  ctx.strokeStyle = '#454f63';
  ctx.beginPath(); ctx.arc(cx0, cy0, orbCr, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#0a0d14';
  ctx.fillRect(cx0 - S / 2, cy0 - orbCr, S, orbCr * 2);
  // XP прогресът тръгва от ДЪНОТО (за да не се крие под нивото отгоре)
  const xpFrac = clamp(p.xp / p.xpNext, 0, 1);
  if (xpFrac > 0) {
    ctx.lineWidth = 3 * S;
    ctx.strokeStyle = '#c8a832';
    ctx.beginPath(); ctx.arc(cx0, cy0, orbCr + 4 * S, Math.PI / 2, Math.PI / 2 + Math.PI * 2 * xpFrac); ctx.stroke();
  }
  // САМО количеството (без „/макс"), със сянка за четимост
  ctx.textAlign = 'center';
  ctx.font = fontBold(9);
  const orbNum = (v, x) => {
    ctx.fillStyle = 'rgba(5,7,12,0.85)';
    ctx.fillText(v, x + S, cy0 + 3 * S + S);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(v, x, cy0 + 3 * S);
  };
  orbNum(String(Math.ceil(p.hp)), cx0 - orbCr * 0.5);
  orbNum(String(Math.ceil(p.mp)), cx0 + orbCr * 0.5);

  {
    const lt = 'LV ' + p.lvl;
    ctx.font = fontBold(6);
    const ltw = ctx.measureText(lt).width;

    { key: 'LMB', icon: p.equip.weapon ? p.equip.weapon.icon : 'sword', info: null, act: () => autoMelee() },
    { key: 'SP', icon: 'dash', cd: (p.dashCharges || 0) < p.st.dashMax ? (p.dashRegen || 0) / p.st.dashCd : 0, act: () => tryDash() },
    { key: 'SS', soulstoneSlot: true },
  ];
  const colOutL = [potionSlot(0), potionSlot(1)]; // външна лява: двете отвари
  const colInR = [ // вътрешна дясна: трите активни магии
    spellSlot(0, 'RMB', true),
    spellSlot(1, '3', G.meta.magic3),

  const colOutR = [{ key: 'P1', passive: 0 }, { key: 'P2', passive: 1 }]; // външна дясна: двете аури
  const sw = 24 * S; // клетките са залепени
  const pas = p.activePassives || [null, null];
  const drawSlot = (s, sx, sy) => {

    if (s.passive !== undefined) {

        const cx0 = sx + sw / 2, cy0 = sy + sw / 2;
        ctx.fillStyle = sp2.col;
        ctx.beginPath();
        ctx.moveTo(cx0, cy0 - 6 * S); ctx.lineTo(cx0 + 5 * S, cy0); ctx.lineTo(cx0, cy0 + 6 * S); ctx.lineTo(cx0 - 5 * S, cy0);

    if (s.locked) {
      // заключен слот за магия: катинарче (Майсторът го отваря срещу Печат)
      rcx(sx + 2 * S, sy + 2 * S, sw - 4 * S, sw - 4 * S, 'rgba(8,10,16,0.55)');
      const cx0 = sx + sw / 2, cy0 = sy + sw / 2;
      strokeRect(cx0 - 2 * S, cy0 - 5 * S, 4 * S, 4 * S, '#454e63', S);   // скоба
      rcx(cx0 - 3 * S, cy0 - 1 * S, 6 * S, 5 * S, '#454e63');             // тяло
      rcx(cx0 - S / 2, cy0 + S, S, 2 * S, '#171c28');                     // ключалка
    }
    else if (s.empty) {
      // отключен, но празен: гнездо, чакащо том
      rcx(sx + 2 * S, sy + 2 * S, sw - 4 * S, sw - 4 * S, 'rgba(30,20,50,0.5)');
      strokeRect(sx + 5 * S, sy + 5 * S, sw - 10 * S, sw - 10 * S, '#6a4f9e', S);
      const pl = 0.4 + 0.25 * Math.sin(G.time * 3);
      ctx.fillStyle = 'rgba(200,79,255,' + pl.toFixed(2) + ')';
      ctx.fillRect(sx + sw / 2 - S, sy + sw / 2 - S, 2 * S, 2 * S);
    }
    else if (s.spell) {
      // руна на магията в нейния цвят
      const cx0 = sx + sw / 2, cy0 = sy + sw / 2;
      ctx.fillStyle = s.spell.col;
      ctx.beginPath();
      ctx.moveTo(cx0, cy0 - 6 * S); ctx.lineTo(cx0 + 5 * S, cy0); ctx.lineTo(cx0, cy0 + 6 * S); ctx.lineTo(cx0 - 5 * S, cy0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillRect(cx0 - S, cy0 - 3 * S, S, 2 * S);
    }
    else if (s.potion) {
      // флакон в цвета на отварата (без брой — само презареждане)
      drawPotionGlyph(sx + sw / 2, sy + sw / 2 + S, s.potion.col);
    }
    else if (s.emptyPotion) {
      // празен слот за отвара (валиден билд: 1 отвара + бъф)
      rcx(sx + 2 * S, sy + 2 * S, sw - 4 * S, sw - 4 * S, 'rgba(20,25,38,0.5)');
      ctx.fillStyle = '#454e63';
      ctx.fillRect(sx + sw / 2 - S, sy + sw / 2 - S, 2 * S, 2 * S);
    }
    else if (s.icon === 'dash') {
      ctx.font = fontBold(9);
      ctx.fillStyle = '#c9d1d9';
      ctx.fillText('»', sx + sw / 2, sy + sw / 2 + 3 * S);
      // пипове за зарядите
      for (let k = 0; k < p.st.dashMax; k++) {
        ctx.fillStyle = k < (p.dashCharges || 0) ? '#ffd23b' : '#454e63';
        ctx.fillRect(sx + 4 * S + k * 5 * S, sy + sw - 5 * S, 3 * S, 2 * S);
      }
    }
    else blit(ctx, Spr.icons[s.icon], sx + sw / 2 - 6 * S, sy + sw / 2 - 7 * S);
    if (s.cd > 0) rcx(sx, sy + sw * (1 - clamp(s.cd, 0, 1)), sw, sw * clamp(s.cd, 0, 1), 'rgba(8,10,16,0.65)');
    ctx.font = fontPx(5);
    ctx.fillStyle = '#7d8899';
    ctx.fillText(s.key, sx + sw / 2, sy + 6 * S);
    if (s.info !== null && s.info !== undefined) {
      ctx.font = fontBold(6);
      ctx.fillStyle = s.infoCol || '#e8e4d0';
      ctx.fillText(s.info, sx + sw - 5 * S, sy + sw - 3 * S);
    }
    if (s.act) UI.hotRects.push({ x: sx, y: sy, w: sw, h: sw, act: s.act });
  };
  // колоните са вертикално центрирани спрямо колбата
  const colInLx = cx0 - orbCr - 6 * S - sw, colOutLx = colInLx - sw;
  const colInRx = cx0 + orbCr + 6 * S, colOutRx = colInRx + sw;
  // ШАХМАТНО и от двете страни: вътрешните колони (3 слота) започват от -36, външните (2) от -24
  colInL.forEach((s, i) => drawSlot(s, colInLx, cy0 - 36 * S + i * sw));   // оръжие + скок + Камъка (до колбата)
  colOutL.forEach((s, i) => drawSlot(s, colOutLx, cy0 - sw + i * sw));     // двете отвари (навън, изместени)
  colInR.forEach((s, i) => drawSlot(s, colInRx, cy0 - 36 * S + i * sw));   // трите магии (до колбата)
  colOutR.forEach((s, i) => drawSlot(s, colOutRx, cy0 - sw + i * sw));     // двете аури (навън, изместени)

  // горе вляво: злато, осколки/печати, бъфове — под двата бутона (настройки+чанта).
  // (Надписът за локацията е под миникартата; нивото на героя е над XP лентата.)
  ctx.save();
  ctx.translate(0, 15 * S);
  ctx.textAlign = 'left';
  blit(ctx, Spr.icons.gold, 10 * S, 25 * S);
  ctx.fillStyle = '#d8dee8';
  ctx.font = fontBold(7);
  ctx.fillText(String(p.gold), 24 * S, 33 * S);
  // кесията със сечено сребро — ПОД монетата, със собствена иконка
  blit(ctx, Spr.icons.sv_bag, 10 * S, 39 * S);
  ctx.fillStyle = silverWeight(p) >= SILVER_CAP ? '#ff6b7a' : '#8a94a5';
  ctx.font = fontPx(6);
  ctx.fillText(silverWeight(p) + '/' + SILVER_CAP, 24 * S, 47 * S);
  const hasSeal = G.meta.seals > 0, hasShard = (G.meta.shards || 0) > 0;
  if (hasSeal || hasShard) {
    let cx = 10 * S;
    if (hasSeal) {
      blit(ctx, Spr.icons.seal, cx, 50 * S);
      ctx.fillStyle = '#c84fff';
      ctx.fillText(String(G.meta.seals), cx + 14 * S, 58 * S);
      cx += 34 * S;
    }
    if (hasShard) {
      blit(ctx, Spr.icons.shard, cx, 50 * S);
      ctx.fillStyle = '#57e6c8';
      ctx.fillText(String(G.meta.shards), cx + 14 * S, 58 * S);
    }
  }
  // (нивото на героя е преместено над XP лентата; индикаторът „SOUL STONE" е премахнат)

  // активни бъфове от отвари: флаконче + лента с оставащото време
  if (p.buffs) {
    const keys = Object.keys(p.buffs);
    let bx0 = 10 * S, byy = ((hasSeal || hasShard) ? 46 : 35) * S;
    for (const bk of keys) {
      const bd = Object.values(POTIONS).find(pp => pp.buff === bk);
      if (!bd) continue;
      const b = p.buffs[bk];
      panel(bx0, byy, 14 * S, 18 * S);
      drawPotionGlyph(bx0 + 7 * S, byy + 8 * S, bd.col, S * 0.85);
      const frac = clamp(b.t / (bd.dur || 10), 0, 1);
      rcx(bx0 + 2 * S, byy + 15 * S, 10 * S, 2 * S, '#171c28');
      rcx(bx0 + 2 * S, byy + 15 * S, 10 * S * frac, 2 * S, bd.col);
      bx0 += 17 * S;
    }
  }
  ctx.restore(); // край на изместения надолу текстов блок

  drawMinimap();
  // надпис за локацията ПОД миникартата: „THE CAMP / of the Exiles" (лагер) или „FLOOR N / тема" (бездна)
  if (UI.miniRect) {
    const mr = UI.miniRect, cxm = mr.x + mr.w / 2;
    ctx.textAlign = 'center';
    ctx.font = fontBold(8);
    ctx.fillStyle = '#e8e4d0';
    const mir = G.city === 'mirhold';
    ctx.fillText(G.onSurface ? (mir ? 'MIRHOLD' : 'THE CAMP') : 'FLOOR ' + G.depth + (G.dungeonId === 'mirhold' ? '/10' : ''), cxm, mr.y + mr.h + 13 * S);
    ctx.font = fontPx(7);
    ctx.fillStyle = '#7d8899';
    ctx.fillText(G.onSurface ? (mir ? 'the crossroads hold' : 'of the Exiles') : THEMES[Spr.themeIdx].name, cxm, mr.y + mr.h + 23 * S);
    ctx.textAlign = 'left';
  }

  // босбар
  if (G.bossName) {
    const boss = G.enemies.find(e => e.t.boss && !e.dead);
    if (boss) {
      const bw = Math.min(300 * S, CW * 0.5), bh = 6 * S;
      const bxx = (CW - bw) / 2, byy = 12 * S;
      ctx.textAlign = 'center';
      ctx.font = fontBold(8);
      ctx.fillStyle = '#ff6b7a';
      ctx.fillText(G.bossName, CW / 2, byy - 3 * S);
      rcx(bxx, byy, bw, bh, '#171c28');
      rcx(bxx, byy, bw * clamp(boss.hp / boss.maxhp, 0, 1), bh, '#c22836');
      strokeRect(bxx, byy, bw, bh, '#3a4456', S);
    }
  }

  // подсказка за взаимодействие: на клавиатура текст "E — ..."; на тъч е КРЪГЛИЯТ местим бутон (в контролите)
  if (G.interactHint && !G.isTouch) {
    ctx.textAlign = 'center';
    const txt = G.interactHint.txt;
    ctx.font = fontBold(7);
    const tw = ctx.measureText(txt).width;
    const hx = CW / 2, hy = CH - 98 * S; // точно над кръглия HUD
    const pad = 6 * S, hh = 13 * S;
    const rx = hx - tw / 2 - pad, ry = hy - hh + 4 * S;
    rcx(rx, ry, tw + pad * 2, hh, 'rgba(10,13,20,0.9)');
    ctx.fillStyle = '#ffd23b';
    ctx.fillText(txt, hx, hy);
  }

  // тост съобщение
  if (G.msgT > 0 && G.msg) {
    ctx.textAlign = 'center';
    ctx.font = fontBold(8);
    ctx.globalAlpha = clamp(G.msgT / 0.5, 0, 1);
    const tw = ctx.measureText(G.msg.str).width;
    rcx(CW / 2 - tw / 2 - 8 * S, CH - 124 * S, tw + 16 * S, 14 * S, 'rgba(10,13,20,0.85)');
    ctx.fillStyle = G.msg.color;
    ctx.fillText(G.msg.str, CW / 2, CH - 114 * S);
    ctx.globalAlpha = 1;
  }

  // етикети на предмети по земята (близо до мишката)
  drawGroundLabels();

  // тъч бутони по шаблона (или изрично избран режим "virtual buttons")
  if (useTouchUI() && G.state === 'play') drawTouchControls(false);

  // зъбчато колело за настройки (едро) + чанта за инвентара
  {
    const gy = 6 * S; // двата бутона (настройки + чанта) са НАЙ-ГОРЕ, над „THE CAMP" и останалите индикатори
    const gw = 28 * S;
    panel(10 * S, gy, gw, gw);
    const cx0 = 10 * S + gw / 2, cy0 = gy + gw / 2;
    ctx.fillStyle = '#a8b2c4';
    for (let a = 0; a < 8; a++) {
      const ang = a * Math.PI / 4 + G.time * 0.3;
      ctx.fillRect((cx0 + Math.cos(ang) * 8 * S - 2 * S) | 0, (cy0 + Math.sin(ang) * 8 * S - 2 * S) | 0, 4 * S, 4 * S);
    }
    ctx.beginPath(); ctx.arc(cx0, cy0, 6 * S, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#171c28';
    ctx.beginPath(); ctx.arc(cx0, cy0, 3 * S, 0, Math.PI * 2); ctx.fill();
    UI.hotRects.push({ x: 10 * S, y: gy, w: gw, h: gw, act: () => openSettings() });

    // чанта (отваря инвентара — на телефона няма клавиш I)
    const bx2 = 10 * S + gw + 4 * S;
    panel(bx2, gy, gw, gw);
    const bcx = bx2 + gw / 2, bcy = gy + gw / 2;
    rcx(bcx - 8 * S, bcy - 4 * S, 16 * S, 11 * S, '#6e4a2f');            // торба
    rcx(bcx - 8 * S, bcy - 4 * S, 16 * S, 2 * S, '#8f6a42');
    rcx(bcx - 5 * S, bcy - 8 * S, 10 * S, 4 * S, '#5c3d26');             // капак
    rcx(bcx - 2 * S, bcy - 2 * S, 4 * S, 3 * S, '#e8c04a');              // катарама
    UI.hotRects.push({ x: bx2, y: gy, w: gw, h: gw, act: () => { G.state = 'inventory'; document.body.classList.add('menu'); } });
  }

  // червен пулс при поражение
  if (G.hurtFlash > 0) {
    ctx.fillStyle = 'rgba(180,30,45,' + (0.25 * G.hurtFlash) + ')';
    ctx.fillRect(0, 0, CW, CH);
  }
  ctx.textAlign = 'left';
}

function drawGroundLabels() {
  const S = SCALE;
  const p = G.player;
  // с мишка — етикет само под курсора; с контролер/тъч няма курсор, затова
  // показваме сами имената на всички предмети около героя (като задържан Alt в PoE).
  // Ключово: в „авто" режим на компютър useMouseAim() е true дори с контролер,
  // затова гледаме и дали падът е бил използван скоро (реалния вход в момента).
  const autoNear = useTouchUI() || !useMouseAim() || padRecent();
  const R = 3.4; // радиус около героя, в който имената изгряват сами
  // събираме видимите етикети и ги подреждаме по близост, за да не се застъпват хаотично
  const labels = [];
  for (const g of G.ground) {
    if (!g.item) continue;
    let d;
    if (autoNear) { if (!p) continue; d = dist(p.x, p.y, g.x, g.y); if (d > R) continue; }
    else { d = dist(G.mouse.wx, G.mouse.wy, g.x, g.y); if (d > 1) continue; }
    labels.push({ g, d });
  }
  labels.sort((a, b) => (a.g.y + a.g.x) - (b.g.y + b.g.x));
  ctx.font = fontBold(6);
  ctx.textAlign = 'center';
  for (const L of labels) {
    const g = L.g;
    const sx = isoX(g.x, g.y) + G.camRX, sy = isoY(g.x, g.y) + G.camRY - (g.z || 0) * S;
    // най-близкият (в авто-режим) е ярък, останалите леко избледняват на разстояние
    const near = autoNear ? clamp(1 - L.d / (R + 0.6), 0.4, 1) : 1;
    const name = g.item.name + (g.item.lvl ? ' · ' + g.item.lvl : '');
    const tw = ctx.measureText(name).width;
    ctx.globalAlpha = near;
    rcx(sx - tw / 2 - 3 * S, sy - 27 * S, tw + 6 * S, 11 * S, 'rgba(10,13,20,0.9)');
    strokeRect(sx - tw / 2 - 3 * S, sy - 27 * S, tw + 6 * S, 11 * S, Items.rarityCol(g.item), Math.max(1, S * 0.5));
    ctx.fillStyle = Items.rarityCol(g.item);
    ctx.fillText(name, sx, sy - 19 * S);
    ctx.globalAlpha = 1;
  }
}

// ---------- минимапа ----------
function drawMinimap() {
  const m = G.map, S = SCALE;
  const baseCell = Math.max(2, Math.round(S * 1.25));
  const cell = Math.round(baseCell * 1.4); // уголемена 1.4x спрямо предишната миникарта (1.7 - 0.3)
  const mw = m.w * cell, mh = m.h * cell;
  // свалена надолу на нивото на прозореца за инвентара (горния му ръб), но да се побира на екрана
  const mx = Math.max(8 * S, CW - mw - 8 * S);
  let my = invWindowGeom().y0;
  if (my + mh > CH - 8 * S) my = Math.max(8 * S, CH - mh - 8 * S);
  UI.miniRect = { x: mx, y: my, w: mw, h: mh }; // за надписа на локацията под картата
  if (!UI.miniCv || UI.miniCv.width !== m.w) {
    UI.miniCv = document.createElement('canvas');
    UI.miniCv.width = m.w; UI.miniCv.height = m.h;
    G.miniDirty = true;
  }
  if (G.miniDirty) {
    G.miniDirty = false;
    const mg = UI.miniCv.getContext('2d');
    mg.clearRect(0, 0, m.w, m.h);
    for (let j = 0; j < m.h; j++) for (let i = 0; i < m.w; i++) {
      const idx = j * m.w + i;
      if (!G.explored[idx]) continue;
      const c = m.cells[idx];
      if (G.onSurface) mg.fillStyle = c !== FLOOR ? '#131b15' : (m.path && m.path[idx] ? '#54473a' : '#424023');
      else mg.fillStyle = c === FLOOR ? '#3a4456' : '#1a202e';
      mg.fillRect(i, j, 1, 1);
    }
  }
  rcx(mx - 2 * S, my - 2 * S, mw + 4 * S, mh + 4 * S, 'rgba(10,13,20,0.8)');
  strokeRect(mx - 2 * S, my - 2 * S, mw + 4 * S, mh + 4 * S, '#3a4456', S);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(UI.miniCv, 0, 0, m.w, m.h, mx, my, mw, mh);
  // точки
  const dot = (x, y, c, s2) => rcx(mx + x * cell - s2 / 2, my + y * cell - s2 / 2, s2, s2, c);
  for (const pr of G.props) {
    if (pr.broken) continue;
    const idx = Math.floor(pr.y) * m.w + Math.floor(pr.x);
    if (!G.explored[idx]) continue;
    if (pr.kind === 'stairs') dot(pr.x, pr.y, '#7fd0a0', cell * 1.6);
    else if (pr.kind === 'chest' && !pr.opened) dot(pr.x, pr.y, '#ffd23b', cell * 1.3);
    else if (pr.kind === 'fountain') dot(pr.x, pr.y, '#4f9cff', cell * 1.3);
    else if (pr.kind === 'stall' || pr.kind === 'shophouse') {
      const vc = { weapon: '#d84a5a', armor: '#4f9cff', potion: '#5fd97a', jewel: '#b34fff', exchange: '#d8dee8' };
      dot(pr.x, pr.y, vc[pr.vtype] || '#ffd23b', cell * 1.8);
    }
    else if (pr.kind === 'portal') dot(pr.x, pr.y, '#b34fff', cell * 2);
    else if (pr.kind === 'cityportal') dot(pr.x, pr.y, '#5cd6c4', cell * 2);      // хенчстоунът
    else if (pr.kind === 'church') dot(pr.x, pr.y, '#ffd23b', cell * 2);          // църквата
    else if (pr.kind === 'campfire') dot(pr.x, pr.y, '#ff8a1f', cell * 1.6);
  }
  for (const e of G.enemies) {
    if (e.dead || !tileVisible(Math.floor(e.x), Math.floor(e.y))) continue;
    dot(e.x, e.y, e.t.boss ? '#ff3b3b' : '#c8465a', cell * (e.t.boss ? 2 : 1.2));
  }
  const blink = Math.sin(G.time * 6) > -0.3;
  if (blink) dot(G.player.x, G.player.y, '#ffffff', cell * 1.6);
}

// ---------- инвентар ----------
const SLOT_NAMES = { weapon: 'Weapon', armor: 'Armor', ring: 'Ring', ring2: 'Ring 2', amulet: 'Amulet', soulstone: 'Soul Stone', spell: 'Spell Tome', spell1: 'Spell', spell2: 'Spell', spell3: 'Spell' };
// раздели (филтри) за предметите — в инвентара и в магазина
const INV_FILTERS = [ { k: 'weapon', t: 'WEAPONS' }, { k: 'armor', t: 'ARMOR' }, { k: 'magic', t: 'MAGIC' } ];
function itemFilterCat(it) {
  if (!it) return 'magic';
  if (it.slot === 'weapon') return 'weapon';
  if (it.slot === 'armor') return 'armor';
  return 'magic'; // пръстени, амулети, томове, Камък на живота и т.н.
}
// геометрия на прозореца за инвентара — споделена, за да подравняваме миникартата към нея
function invWindowGeom() {
  const MID = 135, CELL = 28, BORDER = 6, cols = 5; // art px: лявата/средна част, клетка 26+2, тънка дясна рамка
  const invRows = Math.ceil(G.meta.invSlots / cols);
  const gridW = cols * 26 + (cols - 1) * 2;                              // реалната ширина на мрежата (art px)
  const equipColA = 24 + 6 * 32 + 4;                                     // 6 екип-слота (вкл. Камъка на живота) + етикети
  // дясна колона: филтри(16) + мрежа + магии(30) + перкове(34) + ред бутони(24) под тях
  const rightColA = 40 + invRows * CELL + 30 + 34 + 24;
  const phA = Math.max(equipColA, rightColA) + (G.isTouch ? 4 : 0);      // височина в art-единици
  // ПРОЗОРЕЦЪТ остава голям, но СЪДЪРЖАНИЕТО е с нормален размер; долният HUD (~42*SCALE) не се застъпва
  const reserve = 50 * SCALE;
  const PS = Math.max(SCALE, Math.min(SCALE * 1.5, (CH - reserve - 12) / phA)); // мащаб само на ВИСОЧИНАТА (не мърда с ширината)
  const pw = Math.min(CW - 16, 1700);                                          // правоъгълен: фиксирана ширина ~1700px (свита до екрана)
  // по-нисък с ~48px, но никога под съдържанието; и с капак да не слиза под XP лентата на къси екрани
  // СТАРАТА котва (отпреди кръглия HUD): прозорците застават ниско и се показват НАД (върху)
  // хотбара — той се рисува под тях. Важи и за компютър, и за мобилни (формулата е по SCALE).
  const xpY = CH - 42 * SCALE + hudBottomShift();
  const ph = Math.min(xpY - 5 * SCALE - 8, Math.max(phA * SCALE, phA * PS - 16 * SCALE));
  const x0 = (CW - pw) / 2;
  // долният ръб е съвсем малко над жълтата XP лента
  const y0 = Math.max(8, xpY - 5 * SCALE - ph);
  return { x0, y0, pw, ph, cols, invRows, gridW, BORDER };
}
function drawInventory() {
  const p = G.player;
  UI.invRects = []; UI.equipRects = []; UI.invDropRect = null; UI.invEquipRect = null; UI.invUnequipRect = null;
  const gm = invWindowGeom();
  const x0 = gm.x0, y0 = gm.y0, pw = gm.pw, ph = gm.ph, cols = gm.cols, invRows = gm.invRows, gridW = gm.gridW, BORDER = gm.BORDER;
  panel(x0, y0, pw, ph);
  const S = SCALE; // цялото съдържание (бутони, полета, статистики, клетки) е с нормален размер
  ctx.textAlign = 'left';
  ctx.font = fontBold(9);
  ctx.fillStyle = '#e8e4d0';
  ctx.fillText('HERO', x0 + 10 * S, y0 + 14 * S);
  ctx.font = fontPx(6);
  ctx.fillStyle = '#7d8899';
  ctx.fillText(G.isTouch ? 'tap an item or gear, then the button below' : 'click item — equip · click gear — unequip · right-click — drop', x0 + 60 * S, y0 + 14 * S);
  // ✕ за затваряне
  const cxr = { x: x0 + pw - 20 * S, y: y0 + 4 * S, w: 16 * S, h: 16 * S };
  panel(cxr.x, cxr.y, cxr.w, cxr.h);
  ctx.font = fontBold(9);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff6b7a';
  ctx.fillText('✕', cxr.x + cxr.w / 2, cxr.y + 11.5 * S);
  ctx.textAlign = 'left';
  UI.invCloseRect = cxr;

  // екипировка (6 слота: оръжие, броня, 2 пръстена, амулет, Камък на живота)
  let ey = y0 + 24 * S;
  const slotW = 24 * S;
  for (const slot of ['weapon', 'armor', 'ring', 'ring2', 'amulet', 'soulstone']) {
    panel(x0 + 10 * S, ey, slotW, slotW);
    const it = p.equip[slot];
    if (it) {
      blit(ctx, Spr.icons[it.icon], x0 + 10 * S + slotW / 2 - 6 * S, ey + slotW / 2 - 6 * S);
      strokeRect(x0 + 10 * S, ey, slotW, slotW, Items.rarityCol(it), S);
      if (G.equipSel === slot) strokeRect(x0 + 10 * S - S, ey - S, slotW + 2 * S, slotW + 2 * S, '#ffd23b', S); // избран за сваляне
      UI.equipRects.push({ x: x0 + 10 * S, y: ey, w: slotW, h: slotW, item: it, slot, equip: true });
    }
    ctx.font = fontPx(5.5);
    ctx.fillStyle = '#7d8899';
    ctx.fillText(SLOT_NAMES[slot], x0 + 10 * S, ey + slotW + 6 * S);
    ey += 32 * S;
  }

  // мини-статистики — ЕДНА плътна колонка до екипировката (етикет отгоре, число отдолу, без празнини)
  {
    const st = p.st;
    const statCol = [
      ['DMG', Math.round(st.dmg)],
      ['CRIT', Math.round(st.crit) + '%'],
      ['ATK/S', (1 / st.atkCd).toFixed(2)],
      ['ARMOR', st.armor],
      ['LIFE', st.maxhp],
      ['STEAL', st.vamp + '%'],
      ['SPEED', Math.round(st.spd * 10) / 10],
      ['MANA', st.maxmp],
      ['SPELL', '+' + Math.round(((st.spellMult || 1) - 1) * 100) + '%'], // общо вдигната магическа щета
      ['HP/S', Math.round((st.hpRegen || 0) * 10) / 10],                  // регенерация живот
      ['MP/S', Math.round((st.mpRegen || 0) * 10) / 10],                  // регенерация мана
    ];
    let ly = y0 + 26 * S;
    for (const [k, v] of statCol) {
      ctx.font = fontPx(4.5);
      ctx.fillStyle = '#7d8899';
      ctx.fillText(k, x0 + 44 * S, ly);
      ctx.font = fontBold(6.5);
      ctx.fillStyle = '#e8e4d0';
      ctx.fillText(String(v), x0 + 44 * S, ly + 8 * S);
      ly += 17 * S;
    }
    // КЕСИЯТА със сечено сребро: тежест + мини-лента (обменя се при сарафина)
    const sw = silverWeight(p);
    ctx.font = fontPx(4.5);
    ctx.fillStyle = '#7d8899';
    ctx.fillText('SILVER', x0 + 44 * S, ly);
    ctx.font = fontBold(6.5);
    ctx.fillStyle = sw >= SILVER_CAP ? '#ff6b7a' : '#d8dee8';
    ctx.fillText(sw + '/' + SILVER_CAP, x0 + 44 * S, ly + 8 * S);
    rcx(x0 + 44 * S, ly + 10 * S, 26 * S, 2 * S, '#232a36');
    rcx(x0 + 44 * S, ly + 10 * S, Math.min(1, sw / SILVER_CAP) * 26 * S, 2 * S, sw >= SILVER_CAP ? '#ff6b7a' : '#aab6c8');
  }

  // === ДЯСНА КОЛОНА: филтри -> мрежа с предмети -> магии -> перкове; бутоните са най-долу ===
  const gx0 = x0 + pw - (gridW + BORDER) * S; // долепена ВДЯСНО + тънка рамка
  const filt = G.invFilter || 'weapon';
  // 3 филтъра (раздели) НАД полето с предмети
  UI.invFilterRects = [];
  {
    const fw = 44 * S, fh = 12 * S, fy = y0 + 24 * S;
    ctx.font = fontBold(5.5);
    ctx.textAlign = 'center';
    INV_FILTERS.forEach((f, fi) => {
      const fx = gx0 + fi * (fw + 3 * S);
      const on = filt === f.k;
      rcx(fx, fy, fw, fh, on ? 'rgba(70,92,120,0.85)' : 'rgba(20,25,38,0.7)');
      strokeRect(fx, fy, fw, fh, on ? '#ffd23b' : '#3a4456', 1);
      ctx.fillStyle = on ? '#ffd23b' : '#7d8899';
      ctx.fillText(f.t, fx + fw / 2, fy + 8.5 * S);
      UI.invFilterRects.push({ x: fx, y: fy, w: fw, h: fh, k: f.k });
    });
    ctx.textAlign = 'left';
  }
  // мрежа с предмети — слязла малко надолу; показва само предметите от избрания раздел
  const gy0 = y0 + 40 * S;
  const rows2 = invRows, cw2 = 26 * S, gp = 2 * S;
  const shown = []; // реалните индекси в p.inv от този раздел
  for (let i = 0; i < p.inv.length; i++) if (itemFilterCat(p.inv[i]) === filt) shown.push(i);
  for (let r = 0; r < rows2; r++) for (let c = 0; c < cols; c++) {
    if (r * cols + c >= G.meta.invSlots) break;
    const j = r * cols + c;
    const rx = gx0 + c * (cw2 + gp), ry = gy0 + r * (cw2 + gp);
    panel(rx, ry, cw2, cw2);
    if (j < shown.length) {
      const i = shown[j], it = p.inv[i];
      blit(ctx, Spr.icons[it.icon], rx + cw2 / 2 - 6 * S, ry + cw2 / 2 - 6 * S);
      strokeRect(rx, ry, cw2, cw2, Items.rarityCol(it), S);
      if (G.invSel === i) strokeRect(rx - S, ry - S, cw2 + 2 * S, cw2 + 2 * S, '#ffd23b', S); // избран за сравнение
      if (it.lvl) { // нивото на предмета — долу вдясно
        ctx.font = fontPx(4.5);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#a8b2c4';
        ctx.fillText(it.lvl, rx + cw2 - 2 * S, ry + cw2 - 2 * S);
        ctx.textAlign = 'left';
      }
      UI.invRects.push({ x: rx, y: ry, w: cw2, h: cw2, item: it, idx: i });
    }
  }

  // магии ПОД полето с предмети: 5 слота с размера на предметните клетки (3 активни + 2 за в бъдеще)
  const spellY = gy0 + rows2 * (cw2 + gp) + 4 * S;
  for (let si = 0; si < 5; si++) {
    const rx = gx0 + si * (cw2 + gp);
    panel(rx, spellY, cw2, cw2);
    if (si < 3) {
      const unlocked = si === 0 || (si === 1 ? G.meta.magic3 : G.meta.magic4);
      const id = p.activeSpells && p.activeSpells[si];
      if (!unlocked) {
        rcx(rx + 2 * S, spellY + 2 * S, cw2 - 4 * S, cw2 - 4 * S, 'rgba(8,10,16,0.55)');
        rcx(rx + cw2 / 2 - 3 * S, spellY + cw2 / 2 - 2 * S, 6 * S, 4 * S, '#454e63'); // катинарче
      } else if (id) {
        const sp = SPELLS[id];
        ctx.fillStyle = sp.col;
        ctx.beginPath();
        ctx.moveTo(rx + cw2 / 2, spellY + 5 * S); ctx.lineTo(rx + cw2 - 5 * S, spellY + cw2 / 2);
        ctx.lineTo(rx + cw2 / 2, spellY + cw2 - 5 * S); ctx.lineTo(rx + 5 * S, spellY + cw2 / 2);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.fillRect(rx + cw2 / 2 - S, spellY + cw2 / 2 - 4 * S, S, 3 * S);
      }
      UI.invRects.push({ x: rx, y: spellY, w: cw2, h: cw2, openBook: true });
    } else {
      // ПАСИВНИТЕ слотове (аури) — клик отваря Книгата
      const pid = (p.activePassives || [])[si - 3];
      if (pid && SPELLS[pid]) {
        const sp2 = SPELLS[pid];
        ctx.fillStyle = sp2.col;
        ctx.beginPath();
        ctx.moveTo(rx + cw2 / 2, spellY + 5 * S); ctx.lineTo(rx + cw2 - 5 * S, spellY + cw2 / 2);
        ctx.lineTo(rx + cw2 / 2, spellY + cw2 - 5 * S); ctx.lineTo(rx + 5 * S, spellY + cw2 / 2);
        ctx.closePath(); ctx.fill();
      } else {
        rcx(rx + 2 * S, spellY + 2 * S, cw2 - 4 * S, cw2 - 4 * S, 'rgba(12,15,24,0.6)');
        ctx.fillStyle = '#2c3444';
        ctx.fillRect(rx + cw2 / 2 - S, spellY + cw2 / 2 - S, 2 * S, 2 * S);
      }
      ctx.font = fontPx(4.5); ctx.textAlign = 'right'; ctx.fillStyle = '#7fb0ff';
      ctx.fillText('P' + (si - 2), rx + cw2 - 2 * S, spellY + 7 * S);
      ctx.textAlign = 'left';
      UI.invRects.push({ x: rx, y: spellY, w: cw2, h: cw2, openBook: true });
    }
  }

  // перкове ПОД магиите
  let py = spellY + cw2 + 10 * S;
  ctx.font = fontPx(6);
  ctx.fillStyle = '#7d8899';
  ctx.fillText('Perks (from level-ups):', gx0, py);
  py += 8 * S;
  ctx.fillStyle = '#7fd0a0';
  const perkStr = Object.keys(p.perks).map(id => {
    const perk = PERKS.find(pp => pp.id === id);
    return (perk ? perk.n : id) + (p.perks[id] > 1 ? ' x' + p.perks[id] : '');
  }).join(', ') || 'none yet — level up';
  wrapText(perkStr, gx0, py, gridW * S, 8 * S);

  // бутони НАЙ-ДОЛУ, един до друг, точно под колоната с предмети (къси думи, без символи/точки)
  {
    const bw3 = 44 * S, bh3 = 13 * S, gap3 = 3 * S; // 3x44 + 2x3 = 138 art = ширината на мрежата
    const bx3 = gx0, by3 = y0 + ph - bh3 - 5 * S;
    ctx.font = fontBold(6);
    ctx.textAlign = 'center';
    const btnDefs = [
      { t: 'STATS', col: '#8ab0ff', key: 'openStats' },
      { t: 'SPELLS', col: '#8ab0ff', key: 'openBook' },
      { t: 'SKILLS', col: (p.skillPoints || 0) > 0 ? '#ffd23b' : '#7fd0a0', key: 'openTree' }, // жълто = има точки
    ];
    btnDefs.forEach((d, di) => {
      const bx = bx3 + di * (bw3 + gap3);
      panel(bx, by3, bw3, bh3);
      ctx.fillStyle = d.col;
      ctx.fillText(d.t, bx + bw3 / 2, by3 + 9 * S);
      const r = { x: bx, y: by3, w: bw3, h: bh3 };
      r[d.key] = true;
      UI.invRects.push(r);
    });
    ctx.textAlign = 'left';
  }

  // тултип и сравнение — в празното пространство по средата (по-добра видимост)
  UI.hoverItem = null;
  const mx = G.mouse.x, my = G.mouse.y;
  const midX = ((x0 + 135 * S) + gx0) / 2;  // център на празната зона между статистиките и мрежата
  const midY = y0 + ph / 2;
  // ФИКСИРАНА геометрия: празната зона (между колоната със статистики и мрежата) се дели на
  // ДВЕ РАВНИ ПОЛОВИНИ. ГОРНАТА е за екипирания предмет, ДОЛНАТА — за предмета от инвентара.
  // И двата прозореца ВИНАГИ са с размера на половината си (цяла ширина + цяла височина).
  const zx = x0 + 70 * S;                   // ляв ръб на зоната — плътно до колоната със статистики (тя свършва ~x0+63)
  const zw = gx0 - 4 * S - zx;              // пълна ширина
  const zTop = y0 + 16 * S;                 // под заглавието
  const zBot = y0 + ph - 24 * S;            // над реда с EQUIP/DROP
  const zMid = (zTop + zBot) / 2;
  const topH = zMid - 2 * S - zTop;         // височина на горната половина
  const botH = zBot - (zMid + 2 * S);       // височина на долната половина
  if (G.equipSel && p.equip[G.equipSel]) {
    // избран ЕКИПИРАН предмет -> ГОРНАТА половина, изцяло запълнена
    const it = p.equip[G.equipSel];
    const hArt = 26 + Items.statLines(it).length * 9;
    const k = Math.min(zw / 96, topH / hArt);
    tooltipPanel(it, zx, zTop, null, null, k, zw, topH);
  } else if (G.isTouch && G.invSel !== null && G.invSel !== undefined && p.inv[G.invSel]) {
    // сравнение: носеният от СРЕДАТА НАГОРЕ, НОВИЯТ от СРЕДАТА НАДОЛУ
    const it = p.inv[G.invSel];
    let cur = null; // срещу какво сравняваме (за пръстен — слотът, който би бил сменен)
    if (it.slot === 'ring') cur = (p.equip.ring && p.equip.ring2) ? p.equip.ring : (p.equip.ring || p.equip.ring2);
    else cur = p.equip[it.slot];
    const cmp = [];
    if (cur && it.slot === 'weapon') {
      const d = Math.round(it.dmg / it.cd - cur.dmg / cur.cd);
      if (d) cmp.push({ s: (d > 0 ? '+' : '') + d + ' damage/sec vs equipped', c: d > 0 ? '#7fd0a0' : '#ff6b7a' });
    }
    if (cur && it.slot === 'armor') {
      const d = it.armor - cur.armor;
      if (d) cmp.push({ s: (d > 0 ? '+' : '') + d + ' armor vs equipped', c: d > 0 ? '#7fd0a0' : '#ff6b7a' });
    }
    // предмет от ИНВЕНТАРА -> ДОЛНАТА половина; носеният срещу него -> ГОРНАТА. И двете изцяло запълнени.
    if (cur) {
      const hCArt = 26 + 9 + Items.statLines(cur).length * 9;
      const kC = Math.min(zw / 96, topH / hCArt);
      tooltipPanel(cur, zx, zTop, 'EQUIPPED', null, kC, zw, topH);
    }
    const hNArt = 26 + (cur ? 9 : 0) + Items.statLines(it).length * 9 + cmp.length * 9;
    const kN = Math.min(zw / 96, botH / hNArt);
    tooltipPanel(it, zx, zMid + 2 * S, cur ? 'NEW' : null, cmp, kN, zw, botH);
  } else {
    for (const r of [...UI.invRects, ...UI.equipRects]) {
      if (!r.item) continue;
      if (mx >= r.x && mx < r.x + r.w && my >= r.y && my < r.y + r.h) { UI.hoverItem = r; break; }
    }
    if (UI.hoverItem) drawTooltip(UI.hoverItem.item, mx, my, UI.hoverItem.equip);
  }

  // тъч: явни бутони „екипирай / изхвърли" за избрания предмет (долу под мрежата)
  if (G.isTouch && G.invSel !== null && G.invSel !== undefined && p.inv[G.invSel]) {
    const selIt = p.inv[G.invSel];
    const bw = 53 * S, bh = 14 * S, by = y0 + ph - bh - 5 * S; // НАЙ-ДОЛУ, под сравнението по средата
    const canEq = selIt.slot !== 'spell';
    const eqR = { x: midX - bw - 2 * S, y: by, w: bw, h: bh };
    panel(eqR.x, eqR.y, eqR.w, eqR.h);
    strokeRect(eqR.x, eqR.y, eqR.w, eqR.h, canEq ? '#7fd0a0' : '#454e63', S);
    ctx.font = fontBold(6.5); ctx.textAlign = 'center';
    ctx.fillStyle = canEq ? '#7fd0a0' : '#5a6478';
    ctx.fillText('EQUIP', eqR.x + bw / 2, by + 9.5 * S);
    UI.invEquipRect = canEq ? eqR : null;
    const drR = { x: midX + 2 * S, y: by, w: bw, h: bh };
    panel(drR.x, drR.y, drR.w, drR.h);
    strokeRect(drR.x, drR.y, drR.w, drR.h, '#ff6b7a', S);
    ctx.fillStyle = '#ff6b7a';
    ctx.fillText('DROP', drR.x + bw / 2, by + 9.5 * S);
    UI.invDropRect = drR;
    ctx.textAlign = 'left';
  }

  // бутон „свали" за избрания ЕКИПИРАН предмет (долу вляво, под екипировката)
  if (G.equipSel && p.equip[G.equipSel]) {
    const bw = 62 * S, bh = 14 * S, by = y0 + ph - bh - 4 * S, bx = x0 + 10 * S;
    panel(bx, by, bw, bh);
    strokeRect(bx, by, bw, bh, '#ffb454', S);
    ctx.font = fontBold(6.5); ctx.textAlign = 'center';
    ctx.fillStyle = '#ffb454';
    ctx.fillText('UNEQUIP', bx + bw / 2, by + 9.5 * S);
    ctx.textAlign = 'left';
    UI.invUnequipRect = { x: bx, y: by, w: bw, h: bh };
  }
}

function wrapText(str, x, y, maxW, lineH) {
  const words = str.split(' ');
  let line = '';
  for (const w of words) {
    if (ctx.measureText(line + w).width > maxW && line) {
      ctx.fillText(line, x, y);
      y += lineH;
      line = w + ' ';
    } else line += w + ' ';
  }
  if (line) ctx.fillText(line, x, y);
}

// един панел с данни за предмет; връща размерите си
function tooltipPanel(it, x, y, header, extraLines, S2, W2, H2) {
  const S = S2 || SCALE; // S2: по-едър мащаб за панелите в празната зона на инвентара
  const fB = n => 'bold ' + (n * S) + 'px "Segoe UI", Verdana, sans-serif';
  const fN = n => (n * S) + 'px "Segoe UI", Verdana, sans-serif';
  const lines = Items.statLines(it);
  const extra = extraLines || [];
  const w = W2 || 96 * S; // W2: изрична ширина (панелът се разпъва от ляво до дясно)
  const h = H2 || (26 + (header ? 9 : 0) + lines.length * 9 + extra.length * 9) * S; // H2: фиксирана височина (цялата половина)
  panel(x, y, w, h);
  ctx.textAlign = 'left';
  let ly = y + 11 * S;
  if (header) {
    ctx.font = fB(6);
    ctx.fillStyle = header === 'NEW' ? '#7fd0a0' : '#a8b2c4';
    ctx.fillText(header, x + 6 * S, ly);
    ly += 9 * S;
  }
  ctx.font = fB(7);
  ctx.fillStyle = Items.rarityCol(it);
  ctx.fillText(it.name, x + 6 * S, ly);
  ly += 8 * S;
  ctx.font = fN(5.5);
  ctx.fillStyle = it.uid ? '#ff7a1f' : '#7d8899';
  ctx.fillText((it.lvl ? 'Level ' + it.lvl + ' · ' : '') + (it.uid ? 'UNIQUE' : RARITY[it.rarity].n) + ' · ' + (SLOT_NAMES[it.slot] || ''), x + 6 * S, ly);
  ly += 10 * S;
  ctx.font = fN(6);
  for (const L of lines) { ctx.fillStyle = L.c; ctx.fillText(L.s, x + 6 * S, ly); ly += 9 * S; }
  for (const L of extra) { ctx.fillStyle = L.c; ctx.fillText(L.s, x + 6 * S, ly); ly += 9 * S; }
  return { w, h };
}

function drawTooltip(it, mx, my, isEquipped) {
  const S = SCALE;
  const p = G.player;
  // срещу какво сравняваме: за пръстен — заетия слот, който би бил сменен
  let cur = null;
  if (!isEquipped) {
    if (it.slot === 'ring') cur = (p.equip.ring && p.equip.ring2) ? p.equip.ring : null;
    else cur = p.equip[it.slot];
    if (it.slot === 'ring' && !cur && (p.equip.ring || p.equip.ring2)) cur = p.equip.ring || p.equip.ring2;
  }
  const cmp = [];
  if (cur && it.slot === 'weapon') {
    const d = Math.round(it.dmg / it.cd - cur.dmg / cur.cd);
    if (d) cmp.push({ s: (d > 0 ? '+' : '') + d + ' damage/sec vs equipped', c: d > 0 ? '#7fd0a0' : '#ff6b7a' });
  }
  if (cur && it.slot === 'armor') {
    const d = it.armor - cur.armor;
    if (d) cmp.push({ s: (d > 0 ? '+' : '') + d + ' armor vs equipped', c: d > 0 ? '#7fd0a0' : '#ff6b7a' });
  }
  const w = 96 * S;
  const estH = (26 + 9 + 5 * 9) * S;
  let x = mx + 10 * S, y = my + 6 * S;
  if (x + w + (cur ? w + 4 * S : 0) > CW) x = mx - w - 10 * S - (cur ? w + 4 * S : 0);
  if (x < 2 * S) x = 2 * S;
  if (y + estH > CH) y = Math.max(2 * S, CH - estH - 4 * S);
  // сравнение: НОВО + НОСЕНО едно до друго
  const main = tooltipPanel(it, x, y, cur && !isEquipped ? 'NEW' : null, cmp);
  if (cur && !isEquipped) tooltipPanel(cur, x + main.w + 4 * S, y, 'EQUIPPED');
}

function equipItem(idx) {
  const p = G.player;
  const it = p.inv[idx];

  if (it.slot === 'spell') {

  }
  const old = p.equip[slot];

function inventoryClick(mx, my) {
  const p = G.player;
  if (UI.invCloseRect && mx >= UI.invCloseRect.x && mx < UI.invCloseRect.x + UI.invCloseRect.w && my >= UI.invCloseRect.y && my < UI.invCloseRect.y + UI.invCloseRect.h) {
    G.invSel = null; G.equipSel = null;
    G.state = 'play';
    document.body.classList.remove('menu');
    return;
  }
  // филтри (раздели) над полето с предмети
  for (const r of UI.invFilterRects || []) {
    if (mx >= r.x && mx < r.x + r.w && my >= r.y && my < r.y + r.h) {
      G.invFilter = r.k; G.invSel = null; Sfx.play('pickup'); return;
    }
  }
  // тъч бутони: изхвърли / екипирай избрания предмет
  if (G.invSel != null && p.inv[G.invSel]) {
    const dr = UI.invDropRect, er = UI.invEquipRect;
    if (dr && mx >= dr.x && mx < dr.x + dr.w && my >= dr.y && my < dr.y + dr.h) {
      const it = p.inv[G.invSel];
      p.inv.splice(G.invSel, 1);
      spawnDrop(p.x, p.y, { item: it, t: -2 }); // гратис, да не се вдигне веднага
      Sfx.play('open');
      G.invSel = null;
      return;
    }
    if (er && mx >= er.x && mx < er.x + er.w && my >= er.y && my < er.y + er.h) {
      equipItem(G.invSel);
      G.invSel = null;
      return;
    }
  }
  // бутон „свали" за избрания екипиран предмет
  if (UI.invUnequipRect && G.equipSel && p.equip[G.equipSel]) {
    const u = UI.invUnequipRect;
    if (mx >= u.x && mx < u.x + u.w && my >= u.y && my < u.y + u.h) { unequipItem(G.equipSel); return; }
  }
  // клик върху ЕКИПИРАН предмет: 1-во натискане -> инфо + бутон; 2-ро върху същия -> сваля
  for (const r of UI.equipRects) {
    if (mx >= r.x && mx < r.x + r.w && my >= r.y && my < r.y + r.h) {
      if (G.equipSel === r.slot) unequipItem(r.slot);
      else { G.equipSel = r.slot; G.invSel = null; }
      return;
    }
  }
  for (const r of UI.invRects) {
    if (mx >= r.x && mx < r.x + r.w && my >= r.y && my < r.y + r.h) {
      G.equipSel = null;
      if (r.openStats) { openStats(); return; }
      if (r.openBook) { openSpellbook(); return; }
      if (r.openTree) { openSkillTree(); return; }
      if (G.isTouch && !padRecent()) {
        // само на тъч (без контролер): първо докосване — сравнение; второ върху същия — екипиране
        if (G.invSel === r.idx) { equipItem(r.idx); G.invSel = null; }
        else G.invSel = r.idx;
      } else {
        equipItem(r.idx); // мишка/контролер — директно екипиране
      }
      return;
    }
  }
  G.invSel = null;
  G.equipSel = null;
}
function unequipItem(slot) {
  const p = G.player;
  const it = p.equip[slot];
  if (!it) { G.equipSel = null; return; }
  if (p.inv.length >= G.meta.invSlots) { toast('Inventory is full!', '#ff6b7a'); Sfx.play('deny'); return; }
  p.inv.push(it);
  p.equip[slot] = null;
  calcStats(p);
  Sfx.play('pickup');
  G.equipSel = null;
}
function inventoryDrop(mx, my) {
  const p = G.player;
  // десен клик върху екипиран предмет -> сваля го в инвентара
  for (const r of UI.equipRects) {
    if (mx >= r.x && mx < r.x + r.w && my >= r.y && my < r.y + r.h) { unequipItem(r.slot); return; }
  }
  for (const r of UI.invRects) {
    if (mx >= r.x && mx < r.x + r.w && my >= r.y && my < r.y + r.h) {
      p.inv.splice(r.idx, 1);
      spawnDrop(p.x, p.y, { item: r.item, t: -2 }); // гратис да не се вдигне веднага
      Sfx.play('open');
      return;
    }
  }
}
